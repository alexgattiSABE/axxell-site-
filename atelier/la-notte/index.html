/* ============================================================================
   FUOCO — portable single-file rebuild.

   The canonical shipping form of this Template: one self-contained HTML file,
   no build step, no framework. Drop it into React / Astro / Vue / WordPress /
   plain HTML and adapt.

   ORIGINAL STACK
     Next.js 16.2 App Router + React 19.2 + Tailwind v4 + @react-spring/web 10 +
     spring-text-engine 0.1.5 + Lenis 1.3 + zustand 5. A single route (`/`) whose
     whole page is one full-bleed hero: src/app/page.tsx → src/views/home/home.tsx
     → src/views/home/hero/*.

   PORTED VERBATIM
     • The WebGL2 fluid solver — src/lib/animation/fluid-simulation.ts (a trimmed
       vendoring of Pavel Dobryakov's WebGL-Fluid-Simulation, MIT). Every shader,
       every uniform, every solver constant is byte-for-byte the source; only the
       TypeScript annotations were stripped. That includes the bespoke COMPOSITE
       shader (the one shader NOT from the original engine) which draws the video
       displaced by the velocity field with chromatic aberration.
     • The comet field — src/components/common/preloader/comet-field.ts.
     • The shared rAF ticker — src/lib/animation/ticker.ts.
     • All design tokens — src/app/globals.css, both tiers, values untouched.
       (src/style/index.css is fully commented out in the source and holds no
       tokens; globals.css is the real token file.)
     • All copy — src/data/mocks/home.ts and src/lib/site.ts, exact strings.
     • The hero's own motion constants: FLUID_CONFIG, FOLLOW_CONFIG, FADE_CONFIG,
       ORBIT_SPEED/RADIUS, STIR_STRENGTH, INK_GAIN, COLOR_INTERVAL, IDLE_TIMEOUT,
       WARP_STRENGTH, ABERRATION, and the two-hue biased pickColor().

   REBUILT IN VANILLA (choreography preserved, not approximated)
     • @react-spring/web is replaced by a ~60-line spring integrator that is the
       EXACT maths from @react-spring/core's SpringValue.advance — 1ms sub-steps,
       springForce = -tension*1e-6*(x-to), dampingForce = -friction*1e-3*v,
       a = (springForce+dampingForce)/mass, and react-spring's own precision /
       restVelocity rest test. So every tension/friction/mass literal in the
       source is used AS-IS and the feel is identical, not eased-by-eye.
     • spring-text-engine is replaced by a small DOM builder that reproduces its
       markup (a `.line-word` inline-block per word, an inline-block span per
       letter, a visually-hidden `seo` copy of the string, the animated subtree
       aria-hidden, container display:flex + flex-wrap + column-gap in em) and
       its delay formula: delay = delayIn + index * stagger.
     • React/Next chrome (Server Components, next/font/local, next/link, zustand
       intro store, ScrollLayout, AdaptiveGrid, ReducedMotion) is plain markup +
       plain JS. The zustand intro gate is a 6-line pub/sub. `prefers-reduced-
       motion` makes every spring jump to its end state, exactly as react-spring's
       global skipAnimation does in the source.
     • Fonts: GildaDisplay-Regular.ttf and GeneralSans-Regular.otf are LOCAL files
       in src/app/fonts/, so they are base64-inlined as @font-face data URIs
       rather than pulled from a CDN.
     • public/assets/hero/starry-night.mp4 is NOT inlined — it is referenced from
       il bucket GetLayers. Ora sta in assets/, ricodificato e con una seconda
       sorgente WebM. Poiche' e' di pari origine,
       cross-origin, the <video> must carry crossorigin="anonymous" (the bucket
       sends Access-Control-Allow-Origin: * for GET/HEAD): without it the frame
       cannot be uploaded as a WebGL texture and the fluid layer is dead. The
       source needs no such attribute — there the file is same-origin.
     • Lenis smooth scroll comes from CDN (same 1.x major as the source) and is
       skipped silently if the CDN is unreachable.

   DELIBERATELY OMITTED
     • The cookie-consent banner (src/components/common/Cookie/*, mounted by
       layout.tsx as <LazyCookie/>). It is app plumbing — consent state, a
       preferences modal, a localStorage store — not part of the design, and it
       renders nothing until a user interacts. Nothing else in the page depends
       on it.
     • Next runtime image generators — src/app/icon.tsx, apple-icon.tsx,
       opengraph-image.tsx. They are server-rendered PNG endpoints, not page
       content; the favicon here is a simple inline SVG that reuses the same
       brand gradient (#ffe5ac → #97bdde at 104.458deg) and ink ground (#050b16).
     • JSON-LD structured data (src/utils/seo/structured-data.ts) — every URL in
       it resolves against NEXT_PUBLIC_SITE_URL, which has no meaning offline.
     • The /api/contact route. The source form already intercepts submit and does
       nothing (there is no backend wired to the hero form); that behaviour is
       preserved here.
     • Nav hrefs ("/", "/stays", "/journal", "/about") are kept verbatim from the
       content model. In a single file they are inert — there is only one page.
============================================================================ */
