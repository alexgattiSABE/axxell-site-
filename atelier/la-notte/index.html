/* ---------------------------------------------------------------------------
   TIER 1 — PRIMITIVES (`--raw-*`), verbatim from src/app/globals.css.
   The only tier allowed to contain a hex/px/ms literal.
   --------------------------------------------------------------------------- */
:root{
  --raw-color-white:#ffffff;
  --raw-color-neutral-100:#ededed;
  --raw-color-neutral-900:#171717;
  --raw-color-neutral-950:#0a0a0a;
  --raw-color-black:#000000;

  /* Ink palette for the hero vortex — the valley's lantern light and the night
     sky above it. */
  --raw-color-yellow-100:#ffd75a;
  --raw-color-sky-200:#8ccfff;

  --raw-color-cloud-050:#f0f2fa;   /* the hero frame's page colour */
  --raw-color-navy-900:#04305c;    /* the preloader's ground */
  --raw-color-sand-200:#ffe5ac;
  --raw-color-steel-300:#97bdde;

  --raw-gradient-action:linear-gradient(104.458deg,var(--raw-color-sand-200) 10.028%,var(--raw-color-steel-300) 100%);
  /* The heading's left-to-right fade. A MASK, not a clipped background:
     background-clip:text does not reach through the text engine's transformed
     letter spans and renders the heading invisible. */
  --raw-mask-display:linear-gradient(to right,rgb(0 0 0 / 1) 0%,rgb(0 0 0 / 0.3) 100%);
  --raw-shadow-glass-inset:inset 0 -4px 12px rgb(255 255 255 / 0.2);

  /* Figma px ÷ 16 — the adaptive rem grid maps 1rem to 16px at 1440. */
  --raw-radius-field:4.375rem;   /* 70px */
  --raw-radius-button:1.8125rem; /* 29px */

  --raw-blur-glass:0.3125rem;    /* 5px */
  --raw-blur-glass-strong:1.44375rem; /* 23.1px */

  --raw-text-display:4rem;             /* 64px */
  --raw-text-display-compact:1.75rem;  /* 28px */
  --raw-text-counter:2.75rem;          /* 44px */
  --raw-text-title:1.5rem;             /* 24px */
  --raw-text-lead:1.125rem;            /* 18px */
  --raw-text-body:1rem;                /* 16px */

  --raw-leading-display:1.1;
  --raw-leading-body:1.3;

  --raw-duration-fast:150ms;
  --raw-duration-normal:250ms;
}

/* ---------------------------------------------------------------------------
   TIER 2 — SEMANTIC roles. Purpose, not appearance. Always var(--raw-*).
   This is the themeable layer — retint HERE.
   --------------------------------------------------------------------------- */
:root{
  --background:var(--raw-color-white);
  --foreground:var(--raw-color-neutral-900);

  --duration-fast:var(--raw-duration-fast);
  --duration-normal:var(--raw-duration-normal);

  /* Read at runtime by the fluid layer; each ink splat lands near one hue or
     the other and the solver marbles them. */
  --vortex-warm:var(--raw-color-yellow-100);
  --vortex-cool:var(--raw-color-sky-200);

  --scrim:var(--raw-color-black);
  --surface-base:var(--raw-color-cloud-050);
  --on-media:var(--raw-color-white);
  --action-foreground:var(--raw-color-black);

  --action-gradient:var(--raw-gradient-action);
  --display-fade:var(--raw-mask-display);

  --glass:var(--raw-blur-glass);
  --glass-strong:var(--raw-blur-glass-strong);
  --glass-inset:var(--raw-shadow-glass-inset);

  --field:var(--raw-radius-field);
  --button:var(--raw-radius-button);

  --display-size:var(--raw-text-display);
  --display-compact-size:var(--raw-text-display-compact);
  --counter-size:var(--raw-text-counter);

  --intro-ground:var(--raw-color-navy-900);
  --title-size:var(--raw-text-title);
  --lead-size:var(--raw-text-lead);
  --body-size:var(--raw-text-body);

  --display-leading:var(--raw-leading-display);
  --body-leading:var(--raw-leading-body);

  /* Bound into Tailwind namespaces in the source (@theme inline); plain
     variables here. */
  --font-sans:"General Sans",ui-sans-serif,system-ui,sans-serif;
  --font-display:"Gilda Display",ui-serif,Georgia,serif;
  --ease-entrance:cubic-bezier(0.2,0,0,1);
}

@media (prefers-color-scheme: dark){
  :root{
    --background:var(--raw-color-neutral-950);
    --foreground:var(--raw-color-neutral-100);
  }
}

/* --- reset -------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img,video,canvas{display:block}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
h1,h2{font-weight:400}

/* --- adaptive scaling grid ---------------------------------------------
   Scales the root font-size with the viewport so the rem-based layout stays
   proportional. Each breakpoint divides 16px by the design base width its range
   was laid out at: font-size = 16 * 100 / baseWidth (vw). Above 1920px the
   adaptive-grid script takes over (scale-up). Verbatim from globals.css. */
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:1920px){html{font-size:0.833333vw}}  /* 16 * 100 / 1920 */
@media (max-width:1440px){html{font-size:1.111111vw}}  /* 16 * 100 / 1440 */
@media (max-width:1024px){html{font-size:1.5625vw}}    /* 16 * 100 / 1024 */
@media (max-width:640px){html{font-size:4.444444vw}}   /* 16 * 100 / 360  */

body{
  background:var(--background);
  color:var(--foreground);
  width:100%;
  min-height:100lvh;
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------------------
   TEXT ENGINE — the DOM shape spring-text-engine produces.
   Container is FLEX, so text-align alone cannot align it: pair centring with
   justify-content. `overflow` is never used here — clipping would crop the blur
   halo, which is the point of these reveals.
   --------------------------------------------------------------------------- */
.te{position:relative;display:flex;flex-wrap:wrap}
.te-seo{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;pointer-events:none;user-select:none}
.te-inner{display:contents}
.line-word{display:inline-block;user-select:auto}
.te-unit{display:inline-block;user-select:auto;will-change:transform,opacity,filter}

/* ---------------------------------------------------------------------------
   HERO — Figma "Get Layers", node 698:174. The frame is 1440x800 and every
   measurement is that design's px ÷ 16, because the adaptive rem grid pins 1rem
   to 16px at 1440. So 4rem is the design's 64px gap, 34.5625rem its 553px field.
   --------------------------------------------------------------------------- */
.scroll-layout,.scroll-layout-content{width:100%}
.main{min-height:100lvh;width:100%}

.hero{
  position:relative;isolation:isolate;display:flex;min-height:100lvh;width:100%;
  flex-direction:column;overflow:hidden;background:var(--surface-base);
}

.hero-media{position:absolute;inset:0;width:100%;height:100%}
.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-media canvas{position:absolute;inset:0;width:100%;height:100%}

/* Sits above the canvas: the fluid layer draws the video itself, so a scrim
   underneath it would be painted over. */
.hero-scrim{position:absolute;inset:0;background:color-mix(in oklab,var(--scrim) 30%,transparent)}

/* --- masthead ----------------------------------------------------------- */
.hero-nav{
  position:relative;z-index:20;display:flex;flex-shrink:0;flex-direction:column;gap:0.75rem;
  border-bottom:1px solid color-mix(in oklab,var(--on-media) 20%,transparent);
  padding:1rem 1.25rem;
}
@media (min-width:640px){.hero-nav{padding-left:1.875rem;padding-right:1.875rem}}
@media (min-width:768px){
  .hero-nav{height:3.75rem;flex-direction:row;align-items:center;justify-content:space-between;gap:0;padding-top:0;padding-bottom:0}
}
.hero-brand{
  align-self:center;font-family:var(--font-display);font-size:var(--lead-size);
  line-height:var(--display-leading);color:var(--on-media);text-transform:uppercase;
  transition:opacity var(--duration-fast) var(--ease-entrance);
}
.hero-brand:hover{opacity:0.7}
@media (min-width:768px){.hero-brand{position:absolute;left:50%;transform:translateX(-50%)}}
.hero-nav-groups{display:flex;align-items:center;justify-content:space-between}
@media (min-width:768px){.hero-nav-groups{display:contents}}
.hero-nav ul{display:flex;align-items:center;gap:2rem}
@media (min-width:640px){.hero-nav ul{gap:4rem}}
.hero-nav-link{
  font-size:var(--body-size);line-height:var(--body-leading);color:var(--on-media);
  transition:color var(--duration-fast) var(--ease-entrance);
}
.hero-nav-link:hover{color:color-mix(in oklab,var(--on-media) 60%,transparent)}
.hero-nav-link:focus-visible,.hero-brand:focus-visible{
  outline:2px solid color-mix(in oklab,var(--on-media) 60%,transparent);
  outline-offset:4px;border-radius:0.125rem;
}

/* --- the two column rules ------------------------------------------------
   Inset by the same amount from each edge rather than pinned to absolute x
   positions, so they stay symmetrical on any viewport. Drawn ABOVE the stats
   bar, as in the design, where they carry on across the glass. Hidden below lg,
   where 260px is most of the screen. */
.hero-rule{
  position:absolute;top:3.75rem;bottom:0;z-index:30;display:none;width:1px;
  transform-origin:top;background:color-mix(in oklab,var(--on-media) 20%,transparent);
}
.hero-rule--start{left:16.25rem}
.hero-rule--end{right:16.25rem}
@media (min-width:1024px){.hero-rule{display:block}}

/* --- centred band --------------------------------------------------------
   Takes the whole band between the masthead and the stats bar and centres in
   it — the design's 225px top offset is exactly that centre. */
.hero-band{
  position:relative;z-index:10;display:flex;flex:1 1 0%;flex-direction:column;
  align-items:center;justify-content:center;gap:2rem;padding:3rem 1.25rem;
}
@media (min-width:640px){.hero-band{padding-left:1.875rem;padding-right:1.875rem}}

.hero-heading{
  display:flex;width:44.1875rem;max-width:100%;flex-direction:column;align-items:center;
  -webkit-mask-image:var(--display-fade);mask-image:var(--display-fade);
  text-align:center;font-family:var(--font-display);font-size:var(--display-compact-size);
  line-height:var(--display-leading);color:var(--on-media);
}
@media (min-width:1024px){.hero-heading{font-size:var(--display-size)}}
.hero-heading .te{justify-content:center;line-height:var(--display-leading)}

/* --- glass enquiry bar ---------------------------------------------------
   Below sm the capsule becomes a stacked card — 553px of horizontal bar has
   nowhere to go on a phone — and returns to the design's single row from sm. */
.hero-form-wrap{display:flex;width:100%;justify-content:center}
.hero-form{
  display:flex;width:34.5625rem;max-width:100%;flex-direction:column;gap:0.75rem;
  border-radius:var(--button);
  border:1px solid color-mix(in oklab,var(--on-media) 30%,transparent);
  background:color-mix(in oklab,var(--scrim) 20%,transparent);
  padding:0.75rem;box-shadow:var(--glass-inset);
  -webkit-backdrop-filter:blur(var(--glass));backdrop-filter:blur(var(--glass));
  transition:border-color var(--duration-fast) var(--ease-entrance);
}
.hero-form:focus-within{border-color:color-mix(in oklab,var(--on-media) 60%,transparent)}
@media (min-width:640px){
  .hero-form{
    height:3.375rem;flex-direction:row;align-items:center;gap:2.125rem;
    border-radius:var(--field);padding:0.1875rem 0.1875rem 0.1875rem 2.125rem;
  }
}
.hero-field{width:100%}
@media (min-width:640px){.hero-field{width:9.375rem}}
.hero-field input{
  width:100%;background:transparent;border:0;font-size:var(--body-size);
  line-height:var(--body-leading);color:var(--on-media);
  transition:color var(--duration-fast) var(--ease-entrance);
}
.hero-field input::placeholder{color:var(--on-media);transition:color var(--duration-fast) var(--ease-entrance)}
.hero-field input:focus{outline:none}
.hero-field input:focus::placeholder{color:color-mix(in oklab,var(--on-media) 50%,transparent)}
.hero-submit{
  display:flex;height:3rem;flex-shrink:0;align-items:center;justify-content:center;gap:0.5rem;
  border-radius:var(--button);
  border:1px solid color-mix(in oklab,var(--on-media) 80%,transparent);
  background-image:var(--action-gradient);
  padding-left:3rem;padding-right:3rem;
  font-family:var(--font-display);font-size:var(--lead-size);line-height:1;
  color:var(--action-foreground);
  transition:opacity var(--duration-fast) var(--ease-entrance);
}
.hero-submit:hover{opacity:0.85}
.hero-submit:focus-visible{outline:2px solid var(--on-media);outline-offset:2px}
.dot{width:0.25rem;height:0.25rem;flex-shrink:0;border-radius:9999px;background:var(--action-foreground)}

/* --- glass stats bar -----------------------------------------------------
   Below lg the three cells stack — the pitch takes a full row of its own with
   the two figures side by side underneath. From lg it becomes the design's
   three-column bar: equal 1fr flanks around an auto centre keep the pitch on
   the page's centre line whatever the figures measure. */
.hero-stats{
  position:relative;z-index:10;display:grid;flex-shrink:0;
  grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:2rem;
  border-top:1px solid color-mix(in oklab,var(--on-media) 20%,transparent);
  background:color-mix(in oklab,var(--scrim) 40%,transparent);
  padding:1.25rem;
  -webkit-backdrop-filter:blur(var(--glass-strong));backdrop-filter:blur(var(--glass-strong));
}
@media (min-width:640px){.hero-stats{padding:1.875rem}}
@media (min-width:1024px){.hero-stats{grid-template-columns:1fr auto 1fr}}
.hero-summary{order:-9999;grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:1rem}
@media (min-width:1024px){.hero-summary{order:0;grid-column:span 1;width:32.75rem}}
.hero-summary h2{font-family:var(--font-display);font-size:var(--title-size);line-height:var(--display-leading);color:var(--on-media);text-align:center}
.hero-summary .dot{background:color-mix(in oklab,var(--on-media) 20%,transparent)}
.hero-summary-body{
  font-size:var(--body-size);line-height:var(--body-leading);justify-content:center;
  color:color-mix(in oklab,var(--on-media) 70%,transparent);text-align:center;
}
@media (min-width:1024px){.hero-figure-start{order:-9999;justify-self:start}}
.hero-figure-end{justify-self:end}
/* A description list — flex-col-reverse puts the value above its term visually
   while keeping the required dt → dd order in the DOM. */
.figure{display:flex;flex-direction:column-reverse;justify-content:space-between;gap:0.5rem}
@media (min-width:1024px){.figure{height:7.8125rem;gap:0}}
.figure--start{align-items:flex-start}
.figure--end{align-items:flex-end;text-align:right}
.figure dt{font-size:var(--body-size);line-height:var(--body-leading);white-space:nowrap;color:color-mix(in oklab,var(--on-media) 70%,transparent)}
.figure dd{font-family:var(--font-display);font-size:var(--title-size);line-height:var(--display-leading);color:var(--on-media);text-transform:uppercase}

/* ---------------------------------------------------------------------------
   PRELOADER — a counting figure inside a filling ring, over a field of drifting
   comets. The exit is a MASK, not a fade: a radial-gradient hole opens from the
   centre and grows past the corners, so the page is uncovered like an aperture.
   The overlay never changes opacity.
   --------------------------------------------------------------------------- */
.preloader{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:var(--intro-ground);
}
.preloader canvas{position:absolute;inset:0;width:100%;height:100%}
.preloader-ring{position:relative;display:flex;width:18.75rem;height:18.75rem;align-items:center;justify-content:center}
@media (min-width:640px){.preloader-ring{width:21.25rem;height:21.25rem}}
.preloader-ring svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg);color:color-mix(in oklab,var(--on-media) 70%,transparent)}
.preloader-count{font-family:var(--font-display);font-size:var(--counter-size);line-height:var(--display-leading);color:var(--on-media)}
.preloader-count .pc-unit{color:color-mix(in oklab,var(--on-media) 60%,transparent)}

/* Lenis */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
</style>
</head>
<body>

<div class="scroll-layout">
<div class="scroll-layout-content">

<div class="preloader" id="preloader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <canvas id="comet-canvas" aria-hidden="true"></canvas>
  <div class="preloader-ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle id="preloader-ring-arc" cx="50" cy="50" r="48" fill="none" stroke="currentColor"
              stroke-width="0.25" stroke-linecap="round"
              stroke-dasharray="301.59289474462014" stroke-dashoffset="301.59289474462014"></circle>
    </svg>
    <p class="preloader-count"><span id="preloader-count">0</span><span class="pc-unit">%</span></p>
  </div>
</div>

<main class="main">
  <section class="hero" aria-labelledby="hero-title">

    <div class="hero-media">
      <!-- crossorigin is REQUIRED here and not in the Next source: there the file is
           same-origin under /public, here it is served from the media bucket. Without
           it the frame is opaque to WebGL and texImage2D throws SecurityError every
           frame, which is exactly how the fluid vortex goes missing. The bucket sends
           Access-Control-Allow-Origin: * for GET/HEAD. -->
      <video id="hero-video" autoplay loop muted playsinline preload="auto" aria-hidden="true"
             ><!-- Due sorgenti: l'mp4 quasi ovunque, il WebM dove manca l'H.264.
                  Qui il video non e' decorativo — il solutore di fluido lo legge
                  come texture, quindi se non decodifica non c'e' la scena. Niente
                  `crossorigin`: adesso il file e' nostro, stessa origine. -->
             <source src="assets/starry-night.mp4" type="video/mp4" />
             <source src="assets/starry-night.webm" type="video/webm" />
             </video>
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
    </div>

    <div class="hero-scrim" aria-hidden="true"></div>

    <header class="hero-nav" id="hero-nav" style="opacity:0;transform:translate3d(0,-14px,0)">
      <a class="hero-brand" href="/">Fuoco</a>
      <div class="hero-nav-groups">
        <nav aria-label="Primary">
          <ul>
            <li><a class="hero-nav-link" href="/">Casa</a></li>
            <li><a class="hero-nav-link" href="/stays">La sala</a></li>
          </ul>
        </nav>
        <nav aria-label="Secondary">
          <ul>
            <li><a class="hero-nav-link" href="/journal">Serate</a></li>
            <li><a class="hero-nav-link" href="/about">Chi siamo</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="hero-rule hero-rule--start" id="hero-rule-start" aria-hidden="true" style="opacity:0;transform:scaleY(0)"></div>
    <div class="hero-rule hero-rule--end" id="hero-rule-end" aria-hidden="true" style="opacity:0;transform:scaleY(0)"></div>

    <div class="hero-band">
      <h1 class="hero-heading" id="hero-title">
        <span class="te" data-heading-line="Una luce sulla collina,"></span>
        <span class="te" data-heading-line="accesa apposta per te."></span>
      </h1>

      <div class="hero-form-wrap" id="hero-form-wrap" style="opacity:0;transform:translate3d(0,22px,0);filter:blur(8px)">
        <form class="hero-form" id="hero-form">
          <div class="hero-field">
            <label for="name" class="sr-only">Nome</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Nome" required>
          </div>
          <div class="hero-field">
            <label for="email" class="sr-only">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" required>
          </div>
          <button type="submit" class="hero-submit">
            Prenota<span class="dot" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </div>

    <div class="hero-stats" id="hero-stats" style="opacity:0;transform:translate3d(0,30px,0)">
      <div class="hero-summary">
        <h2>Vale la strada che fai per arrivarci</h2>
        <span class="dot" aria-hidden="true"></span>
        <p class="te hero-summary-body" id="hero-summary-body"
           data-body="Fuoco sta dove la strada finisce: nessun vicino, nessun rumore, una sala calda e un cielo che avevi dimenticato. Si cucina quello che il giorno ha portato, e la sera dura quanto vuoi tu."></p>
      </div>

      <div class="hero-figure-start">
        <dl class="figure figure--start">
          <dt>Stays scouted</dt>
          <dd>240+</dd>
        </dl>
      </div>

      <div class="hero-figure-end">
        <dl class="figure figure--end">
          <dt>Sere lontane da tutto</dt>
          <dd>60K</dd>
        </dl>
      </div>
    </div>

  </section>
</main>

</div>
</div>

<script src="/atelier/vendor/lenis-1.3.19/lenis.min.js"></script>
<script>
(function () {
"use strict";

/* ===========================================================================
   SHARED ANIMATION TICKER — verbatim port of src/lib/animation/ticker.ts.
   A single, app-wide requestAnimationFrame loop, reference-counted: it starts
   on the first subscriber and stops when the last one leaves.
   =========================================================================== */
var tickerSubs = [];
var tickerRaf = null;

function tickerFrame(time) {
  var snapshot = tickerSubs.slice();
  for (var i = 0; i < snapshot.length; i++) {
    var sub = snapshot[i];
    if (tickerSubs.indexOf(sub) === -1) continue;
    if (time - sub.last <= sub.getFramerate()) continue;
    sub.last = time;
    try {
      sub.callback(time);
    } catch (error) {
      // Isolate failures — one bad subscriber must not kill the shared loop.
      console.error("[ticker] subscriber threw:", error);
    }
  }
  tickerRaf = requestAnimationFrame(tickerFrame);
}

function subscribeToTicker(callback, getFramerate) {
  var sub = { callback: callback, getFramerate: getFramerate, last: performance.now() };
  tickerSubs.push(sub);
  if (tickerRaf === null) tickerRaf = requestAnimationFrame(tickerFrame);
  return function () {
    var index = tickerSubs.indexOf(sub);
    if (index !== -1) tickerSubs.splice(index, 1);
    if (tickerSubs.length === 0 && tickerRaf !== null) {
      cancelAnimationFrame(tickerRaf);
      tickerRaf = null;
    }
  };
}

/* ===========================================================================
   SPRING ENGINE — the integrator from @react-spring/core (SpringValue.advance),
   reproduced exactly so every tension / friction / mass literal in the source is
   used as-is. 1ms sub-steps; rest test on react-spring's own precision and
   restVelocity defaults.

   `prefers-reduced-motion` makes every spring jump to its end state, which is
   what react-spring's global skipAnimation does in the source (<ReducedMotion/>
   is mounted at the app root).
   =========================================================================== */
var REDUCED = typeof window.matchMedia === "function" &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function Track(from, to, config) {
  config = config || {};
  this.to = to;
  this.pos = from;
  this.vel = 0;
  this.done = from === to;
  this.tension = config.tension != null ? config.tension : 170;
  this.friction = config.friction != null ? config.friction : 26;
  this.mass = config.mass != null ? config.mass : 1;
  this.precision = config.precision != null
    ? config.precision
    : (from === to ? 0.005 : Math.min(1, Math.abs(to - from) * 0.001));
  this.restVelocity = config.restVelocity != null ? config.restVelocity : this.precision / 10;
}

Track.prototype.advance = function (dt) {
  if (this.done) return;
  var velocity = this.vel;
  var position = this.pos;
  var to = this.to;
  var numSteps = Math.ceil(dt); // step = 1ms
  for (var n = 0; n < numSteps; n++) {
    if (Math.abs(velocity) <= this.restVelocity) {
      if (Math.abs(to - position) <= this.precision) { this.done = true; break; }
    }
    var springForce = -this.tension * 1e-6 * (position - to);
    var dampingForce = -this.friction * 1e-3 * velocity;
    var acceleration = (springForce + dampingForce) / this.mass;
    velocity = velocity + acceleration;
    position = position + velocity;
  }
  this.vel = velocity;
  this.pos = this.done ? to : position;
};

var activeSprings = [];
var springsUnsubscribe = null;
var springsLast = 0;

function springsFrame(time) {
  var dt = springsLast ? Math.min(64, time - springsLast) : 16.667;
  springsLast = time;
  var snapshot = activeSprings.slice();
  for (var i = 0; i < snapshot.length; i++) snapshot[i].advance(dt);
}

function springsStart() {
  if (springsUnsubscribe) return;
  springsLast = 0;
  springsUnsubscribe = subscribeToTicker(springsFrame, function () { return 0; });
}

function springsStop() {
  if (!springsUnsubscribe) return;
  springsUnsubscribe();
  springsUnsubscribe = null;
}

function Spring(from, config) {
  this.tracks = {};
  this.config = config || {};
  for (var key in from) this.tracks[key] = new Track(from[key], from[key], this.config);
  this.onChange = null;
  this.onRest = null;
  this.timer = null;
  this.running = false;
}

Spring.prototype.get = function (key) { return this.tracks[key].pos; };

Spring.prototype.values = function () {
  var out = {};
  for (var key in this.tracks) out[key] = this.tracks[key].pos;
  return out;
};

Spring.prototype.emit = function () { if (this.onChange) this.onChange(this.values()); };

/** Jump, no animation — react-spring's api.set(). */
Spring.prototype.set = function (values) {
  for (var key in values) {
    var track = this.tracks[key];
    if (!track) continue;
    track.pos = values[key];
    track.to = values[key];
    track.vel = 0;
    track.done = true;
  }
  this.emit();
};

Spring.prototype._run = function (props) {
  var config = props.config || this.config;
  for (var key in props) {
    if (key === "config" || key === "delay" || key === "onRest") continue;
    var previous = this.tracks[key];
    if (!previous) continue;
    var next = new Track(previous.pos, props[key], config);
    next.vel = previous.vel; // react-spring carries lastVelocity across an interrupt
    this.tracks[key] = next;
  }
  this.onRest = props.onRest || null;
  if (REDUCED) { this.finish(); return; }
  if (!this.running) {
    this.running = true;
    activeSprings.push(this);
    springsStart();
  }
  this.emit();
};

Spring.prototype.start = function (props) {
  var self = this;
  if (props.delay && !REDUCED) {
    clearTimeout(this.timer);
    this.timer = setTimeout(function () { self._run(props); }, props.delay);
    return;
  }
  this._run(props);
};

Spring.prototype.finish = function () {
  for (var key in this.tracks) {
    var track = this.tracks[key];
    track.pos = track.to;
    track.vel = 0;
    track.done = true;
  }
  this._settle();
};

Spring.prototype._settle = function () {
  if (this.running) {
    var index = activeSprings.indexOf(this);
    if (index !== -1) activeSprings.splice(index, 1);
    this.running = false;
    if (activeSprings.length === 0) springsStop();
  }
  this.emit();
  if (this.onRest) { var rest = this.onRest; this.onRest = null; rest(); }
};

Spring.prototype.advance = function (dt) {
  var idle = true;
  for (var key in this.tracks) {
    var track = this.tracks[key];
    track.advance(dt);
    if (!track.done) idle = false;
  }
  if (idle) { this._settle(); return; }
  this.emit();
};

/**
 * react-spring's transform shorthands, composed the same way: `y` becomes a
 * translate3d, `scaleY` a scale, `blur` the numeric inside filter: blur().
 */
function applyMotion(element, values) {
  var transform = "";
  if (values.y != null) transform += "translate3d(0," + values.y + "px,0)";
  if (values.scaleY != null) transform += (transform ? " " : "") + "scaleY(" + values.scaleY + ")";
  if (transform) element.style.transform = transform;
  if (values.opacity != null) element.style.opacity = values.opacity;
  if (values.blur != null) element.style.filter = "blur(" + values.blur + "px)";
}

/** <Spring tag=… from=… to=… config=… delayIn=… enabled={isComplete}> */
function springElement(element, from, to, config, delayIn) {
  applyMotion(element, from);
  var spring = new Spring(from, config);
  spring.onChange = function (values) { applyMotion(element, values); };
  return function play() {
    var props = { config: config };
    for (var key in to) props[key] = to[key];
    if (delayIn) props.delay = delayIn;
    spring.start(props);
  };
}

/* ===========================================================================
   TEXT ENGINE — the markup and the delay formula of `spring-text-engine`.

   Markup, per its Engine: container is position:relative + display:flex +
   flex-wrap:wrap + column-gap in em; a visually-hidden `seo` copy of the string
   keeps the copy crawler- and copy/paste-visible; the animated subtree is
   aria-hidden; every word is wrapped in an inline-block `.line-word`; letters
   (or words) are inline-block spans inside it.

   Delay, per its playIn(): delay = delayIn + index * stagger.
   =========================================================================== */
function buildTextEngine(container, text, options) {
  var columnGap = options.columnGap != null ? options.columnGap : 0.3;
  container.style.columnGap = columnGap + "em";

  var seo = document.createElement("span");
  seo.className = "te-seo";
  seo.textContent = text;
  container.appendChild(seo);

  var inner = document.createElement("span");
  inner.className = "te-inner";
  inner.setAttribute("aria-hidden", "true");
  container.appendChild(inner);

  var words = text.split(" ").filter(function (word) { return word.length > 0; });
  var units = [];
  var letterIndex = 0;

  words.forEach(function (word, wordIndex) {
    var lineWord = document.createElement("span");
    lineWord.className = "line-word";
    inner.appendChild(lineWord);

    if (options.wordIn) {
      var wordSpan = document.createElement("span");
      wordSpan.className = "te-unit";
      wordSpan.textContent = word;
      lineWord.appendChild(wordSpan);
      units.push({
        el: wordSpan,
        from: options.wordOut,
        to: options.wordIn,
        config: options.wordConfig,
        delay: (options.delayIn || 0) + wordIndex * (options.wordStagger || 0)
      });
      return;
    }

    if (options.letterIn) {
      for (var i = 0; i < word.length; i++) {
        var letterSpan = document.createElement("span");
        letterSpan.className = "te-unit";
        letterSpan.textContent = word.charAt(i);
        lineWord.appendChild(letterSpan);
        units.push({
          el: letterSpan,
          from: options.letterOut,
          to: options.letterIn,
          config: options.letterConfig,
          delay: (options.delayIn || 0) + letterIndex * (options.letterStagger || 0)
        });
        letterIndex++;
      }
      return;
    }

    lineWord.textContent = word;
  });

  units.forEach(function (unit) { applyMotion(unit.el, unit.from); });

  return function play() {
    units.forEach(function (unit) {
      var spring = new Spring(unit.from, unit.config);
      spring.onChange = function (values) { applyMotion(unit.el, values); };
      var props = { config: unit.config, delay: unit.delay };
      for (var key in unit.to) props[key] = unit.to[key];
      spring.start(props);
    });
  };
}

/* ===========================================================================
   INTRO GATE — the zustand store in src/hooks/intro/use-intro.ts.
   Everything in the hero stays mounted the whole time and simply holds its
   "out" state until this flips. It flips when the counter reaches 100, NOT when
   the overlay finishes clearing, so the hero animates in through the opening.
   =========================================================================== */
var intro = {
  isComplete: false,
  listeners: [],
  complete: function () {
    if (this.isComplete) return;
    this.isComplete = true;
    this.listeners.forEach(function (listener) { listener(); });
  },
  subscribe: function (listener) { this.listeners.push(listener); }
};

/* ===========================================================================
   ADAPTIVE SCALING GRID — src/hooks/use-adaptive-grid.ts + grid.config.ts.
   Scales the root font-size UP while the viewport is wider than 1920; at or
   below it the vw media queries in the stylesheet take over.
   =========================================================================== */
var FONT_BASE = 16;
var GRID_BASE_WIDTH = 1920;
var GRID_COEF = 0.6666;

function interpolateFontSize(baseFontSize, baseWidth, windowWidth, coef) {
  var widthReduction = ((baseWidth - windowWidth) / baseWidth) * 100;
  var fontReduction = widthReduction * coef;
  return baseFontSize - (baseFontSize * fontReduction) / 100;
}

function applyAdaptiveGrid() {
  var root = document.documentElement;
  var size = interpolateFontSize(FONT_BASE, GRID_BASE_WIDTH, window.innerWidth, GRID_COEF);
  if (size > FONT_BASE) root.style.setProperty("font-size", size + "px");
  else root.style.removeProperty("font-size");
}

applyAdaptiveGrid();
(function () {
  // useResizeLoop: a render-loop width check rather than a resize listener.
  var lastWidth = window.innerWidth;
  subscribeToTicker(function () {
    if (lastWidth === window.innerWidth) return;
    lastWidth = window.innerWidth;
    applyAdaptiveGrid();
  }, function () { return 100; });
})();

/* ===========================================================================
   COLOUR TOKENS → shader uniforms — src/utils/color.ts.
   Design tokens stay the single source of truth for colour even when the
   consumer is a shader uniform. Returns white for anything unparseable — a
   shader must never receive NaN.
   =========================================================================== */
var COLOR_FALLBACK = [1, 1, 1];

function hexToRgb01(hex) {
  var value = String(hex).trim().replace("#", "");
  var expanded = value.length === 3
    ? value.split("").map(function (char) { return char + char; }).join("")
    : value;
  if (!/^[0-9a-f]{6}$/i.test(expanded)) return COLOR_FALLBACK;
  var int = parseInt(expanded, 16);
  return [((int >> 16) & 255) / 255, ((int >> 8) & 255) / 255, (int & 255) / 255];
}

function readColorToken(token) {
  return hexToRgb01(getComputedStyle(document.documentElement).getPropertyValue(token));
}

/* ===========================================================================
   WEBGL2 FLUID SOLVER — ported VERBATIM from
   src/lib/animation/fluid-simulation.ts (a trimmed vendoring of Pavel
   Dobryakov's WebGL-Fluid-Simulation, MIT). Only the TypeScript annotations are
   gone: every shader, uniform, framebuffer format and solver step is identical.

   Returns null when WebGL2 or the float render targets are unavailable — a
   decorative effect must never take the page down.
   =========================================================================== */
var VERTEX_SHADER = `#version 300 es
precision highp float;
in vec2 aPosition;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
uniform vec2 texelSize;
void main () {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

var FRAGMENT_HEADER = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 fragColor;
`;

var CLEAR_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uTexture;
uniform float value;
void main () { fragColor = value * texture(uTexture, vUv); }
`;

/**
 * Final composite — the one shader that is NOT from the original engine. It
 * draws the background media itself, displaced by the fluid's own velocity
 * field, and lays the ink over the top:
 *   - Warp: each pixel samples the video at uv + velocity.
 *   - Aberration: R and B sample further along that displacement than G.
 *   - Saturation push on the warped area, so it reads as refraction.
 *   - The dye is then added with the original engine's fake gradient lighting.
 */
var COMPOSITE_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uDye;
uniform sampler2D uVideo;
uniform sampler2D uVelocity;
uniform vec2 texelSize;
uniform vec2 uSimTexel;
uniform vec2 uVideoScale;
uniform vec2 uVideoOffset;
uniform float uWarp;
uniform float uAberration;

/** Replicates CSS object-fit: cover for the video texture. */
vec2 cover (vec2 uv) { return uv * uVideoScale + uVideoOffset; }

/** Longest displacement allowed, in uv. Past this the picture just shreds. */
const float MAX_DISPLACEMENT = 0.035;

void main () {
  vec3 dye = texture(uDye, vUv).rgb;

  // Gate the whole effect on where the ink actually is. The velocity field is
  // non-zero almost everywhere once the fluid has been stirred, so warping by it
  // directly tears up the entire frame instead of just the vortex.
  float mask = smoothstep(0.015, 0.32, max(dye.r, max(dye.g, dye.b)));

  vec2 flow = texture(uVelocity, vUv).xy * uSimTexel * uWarp;
  float distance = length(flow);
  if (distance > MAX_DISPLACEMENT) flow *= MAX_DISPLACEMENT / distance;

  vec2 displacement = flow * mask;
  float strength = clamp(length(displacement) / MAX_DISPLACEMENT, 0.0, 1.0);
  vec2 shift = displacement * uAberration;

  vec3 media;
  media.r = texture(uVideo, cover(vUv + displacement + shift)).r;
  media.g = texture(uVideo, cover(vUv + displacement)).g;
  media.b = texture(uVideo, cover(vUv + displacement - shift)).b;

  float luminance = dot(media, vec3(0.299, 0.587, 0.114));
  media += (media - vec3(luminance)) * strength * 0.55;

  vec3 L = texture(uDye, vL).rgb;
  vec3 R = texture(uDye, vR).rgb;
  vec3 T = texture(uDye, vT).rgb;
  vec3 B = texture(uDye, vB).rgb;
  vec3 C = dye;
  float dx = length(R) - length(L);
  float dy = length(T) - length(B);
  vec3 n = normalize(vec3(dx, dy, length(texelSize)));
  float diffuse = clamp(dot(n, vec3(0.0, 0.0, 1.0)) + 0.7, 0.7, 1.0);
  C *= diffuse;

  fragColor = vec4(media + C, 1.0);
}
`;

var SPLAT_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
void main () {
  vec2 p = vUv - point.xy;
  p.x *= aspectRatio;
  vec3 splat = exp(-dot(p, p) / radius) * color;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}
`;

var ADVECTION_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform float dt;
uniform float dissipation;
void main () {
  vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
  fragColor = dissipation * texture(uSource, coord);
  fragColor.a = 1.0;
}
`;

var ADVECTION_MANUAL_FILTERING_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform vec2 dyeTexelSize;
uniform float dt;
uniform float dissipation;
vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
  vec2 st = uv / tsize - 0.5;
  vec2 iuv = floor(st);
  vec2 fuv = fract(st);
  vec4 a = texture(sam, (iuv + vec2(0.5, 0.5)) * tsize);
  vec4 b = texture(sam, (iuv + vec2(1.5, 0.5)) * tsize);
  vec4 c = texture(sam, (iuv + vec2(0.5, 1.5)) * tsize);
  vec4 d = texture(sam, (iuv + vec2(1.5, 1.5)) * tsize);
  return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
}
void main () {
  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
  fragColor = dissipation * bilerp(uSource, coord, dyeTexelSize);
  fragColor.a = 1.0;
}
`;

var DIVERGENCE_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uVelocity;
void main () {
  float L = texture(uVelocity, vL).x;
  float R = texture(uVelocity, vR).x;
  float T = texture(uVelocity, vT).y;
  float B = texture(uVelocity, vB).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; }
  if (vR.x > 1.0) { R = -C.x; }
  if (vT.y > 1.0) { T = -C.y; }
  if (vB.y < 0.0) { B = -C.y; }
  fragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}
`;

var CURL_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uVelocity;
void main () {
  float L = texture(uVelocity, vL).y;
  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  fragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}
`;

var VORTICITY_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;
uniform float dt;
void main () {
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity, vUv).xy;
  fragColor = vec4(vel + force * dt, 0.0, 1.0);
}
`;

var PRESSURE_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float divergence = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + B + T - divergence) * 0.25, 0.0, 0.0, 1.0);
}
`;

var GRADIENT_SUBTRACT_SHADER = FRAGMENT_HEADER + `
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 velocity = texture(uVelocity, vUv).xy;
  velocity.xy -= vec2(R - L, T - B);
  fragColor = vec4(velocity, 0.0, 1.0);
}
`;

function createFluidSimulation(canvas, config) {
  var gl = canvas.getContext("webgl2", {
    alpha: true,
    depth: false,
    stencil: false,
    antialias: false,
    preserveDrawingBuffer: false
  });
  if (!gl) return null;

  // Float render targets are what the solver stores velocity and dye in.
  if (!gl.getExtension("EXT_color_buffer_float")) return null;
  var supportsLinearFiltering = !!gl.getExtension("OES_texture_float_linear");

  var compile = function (type, source) {
    var shader = gl.createShader(type);
    if (!shader) return null;
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error("[fluid] shader compile failed:", gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  };

  var vertexShader = compile(gl.VERTEX_SHADER, VERTEX_SHADER);
  if (!vertexShader) return null;

  var failed = false;

  var createProgram = function (fragmentSource) {
    var program = gl.createProgram();
    var fragmentShader = compile(gl.FRAGMENT_SHADER, fragmentSource);

    gl.attachShader(program, vertexShader);
    if (fragmentShader) gl.attachShader(program, fragmentShader);
    gl.bindAttribLocation(program, 0, "aPosition");
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error("[fluid] program link failed:", gl.getProgramInfoLog(program));
      failed = true;
    }

    var uniforms = {};
    var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < count; i++) {
      var info = gl.getActiveUniform(program, i);
      if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name);
    }

    return { program: program, uniforms: uniforms, bind: function () { gl.useProgram(program); } };
  };

  var clearProgram = createProgram(CLEAR_SHADER);
  var compositeProgram = createProgram(COMPOSITE_SHADER);
  var splatProgram = createProgram(SPLAT_SHADER);
  var advectionProgram = createProgram(
    supportsLinearFiltering ? ADVECTION_SHADER : ADVECTION_MANUAL_FILTERING_SHADER
  );
  var divergenceProgram = createProgram(DIVERGENCE_SHADER);
  var curlProgram = createProgram(CURL_SHADER);
  var vorticityProgram = createProgram(VORTICITY_SHADER);
  var pressureProgram = createProgram(PRESSURE_SHADER);
  var gradientSubtractProgram = createProgram(GRADIENT_SUBTRACT_SHADER);

  if (failed) return null;

  var vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  var indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);

  var blit = function (destination) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, destination);
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };

  var rgba = { internalFormat: gl.RGBA16F, format: gl.RGBA };
  var rg = { internalFormat: gl.RG16F, format: gl.RG };
  var r = { internalFormat: gl.R16F, format: gl.RED };
  var texType = gl.HALF_FLOAT;
  var filtering = supportsLinearFiltering ? gl.LINEAR : gl.NEAREST;

  var createFBO = function (w, h, format, param) {
    gl.activeTexture(gl.TEXTURE0);
    var texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, format.internalFormat, w, h, 0, format.format, texType, null);

    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);

    return {
      texture: texture,
      fbo: fbo,
      width: w,
      height: h,
      attach: function (id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      }
    };
  };

  var createDoubleFBO = function (w, h, format, param) {
    var first = createFBO(w, h, format, param);
    var second = createFBO(w, h, format, param);
    return {
      get read() { return first; },
      set read(value) { first = value; },
      get write() { return second; },
      set write(value) { second = value; },
      swap: function () { var temp = first; first = second; second = temp; }
    };
  };

  var getResolution = function (resolution) {
    var aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspect < 1) aspect = 1 / aspect;
    var max = Math.round(resolution * aspect);
    var min = Math.round(resolution);
    return gl.drawingBufferWidth > gl.drawingBufferHeight
      ? { width: max, height: min }
      : { width: min, height: max };
  };

  var simWidth = 0;
  var simHeight = 0;
  var dyeWidth = 0;
  var dyeHeight = 0;
  var density, velocity, divergence, curl, pressure;

  var initFramebuffers = function () {
    var simRes = getResolution(config.simResolution);
    var dyeRes = getResolution(config.dyeResolution);
    simWidth = simRes.width;
    simHeight = simRes.height;
    dyeWidth = dyeRes.width;
    dyeHeight = dyeRes.height;

    density = createDoubleFBO(dyeWidth, dyeHeight, rgba, filtering);
    velocity = createDoubleFBO(simWidth, simHeight, rg, filtering);
    divergence = createFBO(simWidth, simHeight, r, gl.NEAREST);
    curl = createFBO(simWidth, simHeight, r, gl.NEAREST);
    pressure = createDoubleFBO(simWidth, simHeight, r, gl.NEAREST);
  };

  initFramebuffers();

  var resize = function () {
    if (canvas.width === canvas.clientWidth && canvas.height === canvas.clientHeight) return;
    canvas.width = Math.max(1, canvas.clientWidth);
    canvas.height = Math.max(1, canvas.clientHeight);
    initFramebuffers();
  };

  var splat = function (x, y, dx, dy, color) {
    gl.viewport(0, 0, simWidth, simHeight);
    splatProgram.bind();
    gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(splatProgram.uniforms.point, x / canvas.width, 1 - y / canvas.height);
    gl.uniform3f(splatProgram.uniforms.color, dx, -dy, 1);
    gl.uniform1f(splatProgram.uniforms.radius, config.splatRadius / 100);
    blit(velocity.write.fbo);
    velocity.swap();

    gl.viewport(0, 0, dyeWidth, dyeHeight);
    gl.uniform1i(splatProgram.uniforms.uTarget, density.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
    blit(density.write.fbo);
    density.swap();
  };

  var step = function (dt) {
    gl.disable(gl.BLEND);
    gl.viewport(0, 0, simWidth, simHeight);

    curlProgram.bind();
    gl.uniform2f(curlProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl.fbo);

    vorticityProgram.bind();
    gl.uniform2f(vorticityProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityProgram.uniforms.curl, config.curl);
    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
    blit(velocity.write.fbo);
    velocity.swap();

    divergenceProgram.bind();
    gl.uniform2f(divergenceProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence.fbo);

    clearProgram.bind();
    gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearProgram.uniforms.value, config.pressureDissipation);
    blit(pressure.write.fbo);
    pressure.swap();

    pressureProgram.bind();
    gl.uniform2f(pressureProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
    for (var i = 0; i < config.pressureIterations; i++) {
      gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write.fbo);
      pressure.swap();
    }

    gradientSubtractProgram.bind();
    gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write.fbo);
    velocity.swap();

    advectionProgram.bind();
    gl.uniform2f(advectionProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
    if (!supportsLinearFiltering) {
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1 / simWidth, 1 / simHeight);
    }
    var velocityId = velocity.read.attach(0);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
    gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
    gl.uniform1f(advectionProgram.uniforms.dt, dt);
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.velocityDissipation);
    blit(velocity.write.fbo);
    velocity.swap();

    gl.viewport(0, 0, dyeWidth, dyeHeight);
    if (!supportsLinearFiltering) {
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1 / dyeWidth, 1 / dyeHeight);
    }
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProgram.uniforms.uSource, density.read.attach(1));
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.densityDissipation);
    blit(density.write.fbo);
    density.swap();
  };

  var videoTexture = null;
  /** Set once a frame upload has been refused — see uploadSource. */
  var sourceBlocked = false;

  var uploadSource = function (source) {
    if (!videoTexture) {
      videoTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, videoTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
    // vUv runs y-up, the video frame arrives y-down.
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    } catch (error) {
      // Only reachable if the media is served without CORS: the frame is opaque
      // to WebGL. Same rule as a missing context — stand down for good and let the
      // plain <video> underneath show through, rather than throw once a frame.
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      sourceBlocked = true;
      console.warn("[fluid] media frame is not readable (CORS); falling back to the plain video.");
      return -1;
    }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

    return 2;
  };

  var render = function (options) {
    var source = options.source;
    var sourceAspect = options.sourceAspect;
    var warp = options.warp;
    var aberration = options.aberration;

    gl.disable(gl.BLEND);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);

    if (!source || sourceBlocked) {
      // Nothing to composite yet — stay out of the way of the plain <video>.
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return;
    }

    var sourceId = uploadSource(source);
    if (sourceId < 0) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return;
    }

    // object-fit: cover — crop the overflowing axis, centred.
    var canvasAspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
    var scaleX = sourceAspect > canvasAspect ? canvasAspect / sourceAspect : 1;
    var scaleY = sourceAspect > canvasAspect ? 1 : sourceAspect / canvasAspect;

    compositeProgram.bind();
    gl.uniform2f(compositeProgram.uniforms.texelSize, 1 / gl.drawingBufferWidth, 1 / gl.drawingBufferHeight);
    gl.uniform2f(compositeProgram.uniforms.uSimTexel, 1 / simWidth, 1 / simHeight);
    gl.uniform2f(compositeProgram.uniforms.uVideoScale, scaleX, scaleY);
    gl.uniform2f(compositeProgram.uniforms.uVideoOffset, (1 - scaleX) / 2, (1 - scaleY) / 2);
    gl.uniform1f(compositeProgram.uniforms.uWarp, warp);
    gl.uniform1f(compositeProgram.uniforms.uAberration, aberration);
    gl.uniform1i(compositeProgram.uniforms.uDye, density.read.attach(0));
    gl.uniform1i(compositeProgram.uniforms.uVelocity, velocity.read.attach(1));
    gl.uniform1i(compositeProgram.uniforms.uVideo, sourceId);
    blit(null);
  };

  var destroy = function () {
    var programs = [
      clearProgram, compositeProgram, splatProgram, advectionProgram, divergenceProgram,
      curlProgram, vorticityProgram, pressureProgram, gradientSubtractProgram
    ];
    for (var i = 0; i < programs.length; i++) gl.deleteProgram(programs[i].program);
    gl.deleteBuffer(vertexBuffer);
    gl.deleteBuffer(indexBuffer);
    if (videoTexture) gl.deleteTexture(videoTexture);
  };

  return { resize: resize, step: step, render: render, splat: splat, destroy: destroy };
}

/* ===========================================================================
   COMET FIELD — verbatim port of
   src/components/common/preloader/comet-field.ts.
   Ambient scenery on a 2D canvas: each comet is a tapered gradient streak with
   a bright head; when one leaves the frame it re-enters from the opposite side
   with fresh randomised values, so the field never visibly loops.
   =========================================================================== */
/** Down and to the LEFT, matching the meteors in the hero video. */
var COMET_ANGLE = Math.PI * 0.28;
var DIRECTION_X = -Math.cos(COMET_ANGLE);
var DIRECTION_Y = Math.sin(COMET_ANGLE);

function randomBetween(min, max) { return min + Math.random() * (max - min); }

function createCometField(canvas, colour, count) {
  if (count == null) count = 14;
  var context = canvas.getContext("2d");
  if (!context) return null;

  var r = Math.round(colour[0] * 255);
  var g = Math.round(colour[1] * 255);
  var b = Math.round(colour[2] * 255);
  var comets = [];

  var spawn = function (comet, initial) {
    var width = canvas.clientWidth;
    var height = canvas.clientHeight;

    // Travelling down-left, so fresh comets are seeded above the frame and off
    // to the right — the band they drift in from.
    comet.x = initial
      ? randomBetween(0, width)
      : randomBetween(0, width + height * Math.abs(DIRECTION_X));
    comet.y = initial ? randomBetween(0, height) : -randomBetween(0.05, 0.7) * height;
    comet.speed = randomBetween(260, 620);
    comet.length = randomBetween(90, 320);
    comet.width = randomBetween(0.6, 1.6);
    comet.alpha = randomBetween(0.25, 0.9);
  };

  for (var i = 0; i < count; i++) {
    var comet = { x: 0, y: 0, speed: 0, length: 0, width: 0, alpha: 0 };
    spawn(comet, true);
    comets.push(comet);
  }

  var resize = function () {
    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    var width = Math.max(1, Math.round(canvas.clientWidth * ratio));
    var height = Math.max(1, Math.round(canvas.clientHeight * ratio));
    if (canvas.width === width && canvas.height === height) return;

    canvas.width = width;
    canvas.height = height;
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
  };

  var draw = function (deltaSeconds) {
    var width = canvas.clientWidth;
    var height = canvas.clientHeight;

    context.clearRect(0, 0, width, height);
    context.lineCap = "round";

    for (var i = 0; i < comets.length; i++) {
      var comet = comets[i];
      comet.x += DIRECTION_X * comet.speed * deltaSeconds;
      comet.y += DIRECTION_Y * comet.speed * deltaSeconds;

      var tailX = comet.x - DIRECTION_X * comet.length;
      var tailY = comet.y - DIRECTION_Y * comet.length;

      var gradient = context.createLinearGradient(tailX, tailY, comet.x, comet.y);
      gradient.addColorStop(0, "rgba(" + r + ", " + g + ", " + b + ", 0)");
      gradient.addColorStop(1, "rgba(" + r + ", " + g + ", " + b + ", " + comet.alpha + ")");

      context.strokeStyle = gradient;
      context.lineWidth = comet.width;
      context.beginPath();
      context.moveTo(tailX, tailY);
      context.lineTo(comet.x, comet.y);
      context.stroke();

      // The tail trails up and to the right of the head, so the comet is only
      // fully gone once the TAIL has cleared the left or bottom edge.
      if (tailX < 0 || tailY > height) spawn(comet, false);
    }
  };

  resize();

  return { resize: resize, draw: draw };
}

/* ===========================================================================
   HERO MEDIA — src/views/home/hero/hero-media.tsx.
   A looping video with a fluid vortex that follows the cursor, warps the
   picture, and fades away when the cursor stops. The canvas draws the video AND
   the ink: the warp samples the frame at uv + velocity, which is impossible
   while the video is a separate DOM layer underneath. When the simulation has
   no frame yet (or fails, or is skipped on mobile) it stays transparent and the
   plain <video> shows through unchanged.
   =========================================================================== */
/** Solver tuning — the oily, marbled, vivid-on-dark look. */
var FLUID_CONFIG = {
  simResolution: 200,
  dyeResolution: 512,
  densityDissipation: 0.93,
  velocityDissipation: 0.96,
  pressureDissipation: 0.8,
  pressureIterations: 20,
  curl: 42,
  splatRadius: 0.16
};

/** Loose enough that the vortex drifts after the cursor instead of pinning to it. */
var FOLLOW_CONFIG = { tension: 90, friction: 24, mass: 1.3 };
/** Slower, so the ink swells in and dies away rather than switching. */
var FADE_CONFIG = { tension: 24, friction: 22, mass: 1.2 };

/** Radians per frame — one revolution every ~4s. */
var ORBIT_SPEED = 0.026;
/** Orbit radius in px, capped against the viewport so it stays a vortex. */
var ORBIT_RADIUS = 150;
/** Injected velocity per frame, scaled off how far the orbit point moved. */
var STIR_STRENGTH = 9;
/** How hard the ink is pushed into the dye buffer. Stays well under 1 over video. */
var INK_GAIN = 0.3;
/** ms between colour picks along the two-hue band. */
var COLOR_INTERVAL = 120;
/** ms of a motionless cursor before the vortex starts fading out. */
var IDLE_TIMEOUT = 180;
/** How far the flow drags the video. */
var WARP_STRENGTH = 0.2;
/** Colour split along the displacement, as a fraction of it. */
var ABERRATION = 0.09;
var FIXED_STEP = 0.016;

/** src/lib/springs/config.ts — hover-class motion is off at or below 768px. */
var MOBILE_WIDTH = 768;

function initHeroMedia() {
  var canvas = document.getElementById("hero-canvas");
  var video = document.getElementById("hero-video");
  if (!canvas || !video) return;

  var disabled = window.innerWidth <= MOBILE_WIDTH;
  if (disabled) { canvas.parentNode.removeChild(canvas); return; }

  // The <video> carries crossorigin="anonymous" so its frames can be uploaded as a
  // texture. If the media host ever answers without the CORS header the load fails
  // outright, so retry once as a plain cross-origin video and drop the fluid layer —
  // a decorative effect must never cost the page its hero.
  var teardown = null;
  video.addEventListener("error", function onError() {
    video.removeEventListener("error", onError);
    if (!video.hasAttribute("crossorigin")) return;
    video.removeAttribute("crossorigin");
    if (teardown) teardown();
    if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    video.load();
  });

  canvas.width = Math.max(1, canvas.clientWidth);
  canvas.height = Math.max(1, canvas.clientHeight);

  var fluid = createFluidSimulation(canvas, FLUID_CONFIG);
  if (!fluid) { canvas.parentNode.removeChild(canvas); return; }

  // One spring chases the pointer (FOLLOW_CONFIG); a second drives the fade
  // (FADE_CONFIG) — which also scales the warp, so a still cursor means a still
  // picture.
  var vortex = new Spring({ x: 0, y: 0, intensity: 0 }, FOLLOW_CONFIG);

  /** Seeded on the first pointer move, so the vortex never flies in from (0,0). */
  var seeded = false;
  var lastMoveAt = 0;
  var idle = true;

  var handleMove = function (event) {
    var rect = canvas.getBoundingClientRect();
    if (rect.height === 0) return;

    var x = event.clientX - rect.left;
    var y = event.clientY - rect.top;

    if (!seeded) { seeded = true; vortex.set({ x: x, y: y }); }

    lastMoveAt = performance.now();
    if (idle) { idle = false; vortex.start({ intensity: 1, config: FADE_CONFIG }); }

    vortex.start({ x: x, y: y, config: FOLLOW_CONFIG });
  };

  var handleLeave = function () {
    idle = true;
    vortex.start({ intensity: 0, config: FADE_CONFIG });
  };

  window.addEventListener("pointermove", handleMove, { passive: true });
  document.addEventListener("pointerleave", handleLeave);
  window.addEventListener("blur", handleLeave);

  var warm = readColorToken("--vortex-warm");
  var cool = readColorToken("--vortex-cool");

  /**
   * Lands near one hue or the other rather than anywhere between them: an even
   * spread would spend most of its splats in the washed-out middle and the two
   * colours would never read as two colours. The solver does the mixing.
   * Biased toward the warm end: over a blue night sky the cool ink gets a free
   * boost from the backdrop, so an even split reads as all-blue.
   */
  var pickColor = function () {
    var t = Math.random() < 0.55 ? Math.random() * 0.2 : 0.8 + Math.random() * 0.2;
    return {
      r: (warm[0] + (cool[0] - warm[0]) * t) * INK_GAIN,
      g: (warm[1] + (cool[1] - warm[1]) * t) * INK_GAIN,
      b: (warm[2] + (cool[2] - warm[2]) * t) * INK_GAIN
    };
  };

  var angle = 0;
  var previousX = 0;
  var previousY = 0;
  var orbiting = false;
  var color = pickColor();
  var lastColorAt = 0;

  var unsubscribe = subscribeToTicker(function (time) {
    fluid.resize();

    // A cursor that stopped moving is treated as gone: the feed stops and the
    // dye dissipates, so the vortex fades out on its own within ~a second.
    if (!idle && time - lastMoveAt > IDLE_TIMEOUT) {
      idle = true;
      vortex.start({ intensity: 0, config: FADE_CONFIG });
    }

    var intensity = vortex.get("intensity");

    if (intensity > 0.01) {
      // One stirring point circling the spring-lagged cursor. Its own motion is
      // what the solver turns into a vortex — a stationary splat would just be
      // a blob.
      var radius = Math.min(ORBIT_RADIUS, canvas.width * 0.22, canvas.height * 0.28) *
        (0.72 + 0.28 * Math.sin(angle * 0.37));
      angle += ORBIT_SPEED;

      var x = vortex.get("x") + Math.cos(angle) * radius;
      var y = vortex.get("y") + Math.sin(angle) * radius;

      if (!orbiting) {
        orbiting = true;
        previousX = x;
        previousY = y;
      } else {
        if (time - lastColorAt > COLOR_INTERVAL) {
          color = pickColor();
          lastColorAt = time;
        }

        fluid.splat(x, y, (x - previousX) * STIR_STRENGTH, (y - previousY) * STIR_STRENGTH, {
          r: color.r * intensity,
          g: color.g * intensity,
          b: color.b * intensity
        });
        previousX = x;
        previousY = y;
      }
    } else {
      orbiting = false;
    }

    fluid.step(FIXED_STEP);

    var ready = video.readyState >= 2 && video.videoHeight > 0;

    fluid.render({
      source: ready ? video : null,
      sourceAspect: ready ? video.videoWidth / video.videoHeight : 1,
      warp: WARP_STRENGTH * intensity,
      aberration: ABERRATION
    });
  }, function () { return 0; });

  teardown = function () {
    unsubscribe();
    window.removeEventListener("pointermove", handleMove);
    document.removeEventListener("pointerleave", handleLeave);
    window.removeEventListener("blur", handleLeave);
    fluid.destroy();
  };
}

/* ===========================================================================
   HERO ENTRANCE — the four <Spring> wrappers and the three TextEngines, with
   their exact from/to values, spring configs, delays and staggers.
   =========================================================================== */
/** Letters float up out of focus. No overflow — clipping would cut the blur. */
var LETTER_OUT = { y: 26, opacity: 0, blur: 10 };
var LETTER_IN = { y: 0, opacity: 1, blur: 0 };
var LETTER_STAGGER = 26;
var BASE_DELAY = 120;

/** Words drift up out of focus, same language as the heading's letters. */
var WORD_OUT = { y: 16, opacity: 0, blur: 7 };
var WORD_IN = { y: 0, opacity: 1, blur: 0 };

function initHero() {
  var plays = [];

  // Masthead — rises as one.
  plays.push(springElement(
    document.getElementById("hero-nav"),
    { opacity: 0, y: -14 }, { opacity: 1, y: 0 },
    { tension: 60, friction: 24 }, 0
  ));

  // The two column rules draw themselves downward — scaleY from a top origin,
  // which reads as the line being ruled rather than switched on.
  var ruleConfig = { tension: 40, friction: 26, mass: 1.2 };
  plays.push(springElement(document.getElementById("hero-rule-start"),
    { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1 }, ruleConfig, 240));
  plays.push(springElement(document.getElementById("hero-rule-end"),
    { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1 }, ruleConfig, 240));

  // The glass enquiry bar.
  plays.push(springElement(
    document.getElementById("hero-form-wrap"),
    { opacity: 0, y: 22, blur: 8 }, { opacity: 1, y: 0, blur: 0 },
    { tension: 60, friction: 26 }, 760
  ));

  // The glass stats bar.
  plays.push(springElement(
    document.getElementById("hero-stats"),
    { opacity: 0, y: 30 }, { opacity: 1, y: 0 },
    { tension: 55, friction: 26 }, 900
  ));

  // The display heading — ONE ENGINE PER DESIGNED LINE. Feeding the whole
  // sentence to a single engine re-wraps it (the container is a flex row of
  // per-word inline-blocks, which measures differently from a plain paragraph)
  // and the design's two lines came out as three. The second line's delayIn
  // continues the first one's stagger so it still reads as a single sweep.
  var lineNodes = document.querySelectorAll("[data-heading-line]");
  var consumed = 0;
  for (var i = 0; i < lineNodes.length; i++) {
    var line = lineNodes[i].getAttribute("data-heading-line");
    plays.push(buildTextEngine(lineNodes[i], line, {
      // The engine's default word gap is 0.3em, wider than the space this face
      // actually sets, which pushed the design's first line over its 707px
      // measure and wrapped it.
      columnGap: 0.24,
      letterOut: LETTER_OUT,
      letterIn: LETTER_IN,
      letterStagger: LETTER_STAGGER,
      letterConfig: { tension: 90, friction: 24, mass: 1.1 },
      delayIn: BASE_DELAY + consumed * LETTER_STAGGER
    }));
    consumed += line.replace(/\s/g, "").length;
  }

  // The pitch reads in word by word, after the bar has risen.
  var body = document.getElementById("hero-summary-body");
  plays.push(buildTextEngine(body, body.getAttribute("data-body"), {
    wordOut: WORD_OUT,
    wordIn: WORD_IN,
    wordStagger: 18,
    wordConfig: { tension: 80, friction: 24 },
    delayIn: 1150
  }));

  intro.subscribe(function () {
    plays.forEach(function (play) { play(); });
  });

  // There is no backend wired to this form; submit is intercepted and does
  // nothing (as in src/views/home/hero/hero-form.tsx).
  document.getElementById("hero-form").addEventListener("submit", function (event) {
    event.preventDefault();
  });
}

/* ===========================================================================
   PRELOADER — src/components/common/preloader/preloader.tsx.
   Timing is honest: the figure springs to 90 on its own, then waits for the
   window `load` event before finishing. The intro store flips at 100, i.e. as
   the aperture starts to open, so the hero animates in THROUGH it.
   =========================================================================== */
var RING_RADIUS = 48;
var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

/** Counting to 90 happens on trust; the last ten wait for the `load` event. */
var HOLD_AT = 90;
/** Floor on how long the overlay stays up — without it a warm cache reads as a glitch. */
var MIN_VISIBLE_MS = 1300;
var COUNT_CONFIG = { tension: 18, friction: 26, mass: 1.4 };
var FINISH_CONFIG = { tension: 130, friction: 26 };
/** The reveal wants to feel like an aperture opening, not a curtain snapping. */
var REVEAL_CONFIG = { tension: 90, friction: 32, mass: 1, precision: 0.5 };
/** Mask radius at full reveal, in % of the overlay — past the far corners. */
var REVEAL_END = 145;
/** Width of the mask's soft edge, in the same units. */
var REVEAL_FEATHER = 14;

/**
 * The aperture, as a mask image. The feather is on the INSIDE of the radius:
 * anchoring the opaque stop at `r` keeps the overlay solid until the reveal
 * actually starts, instead of letting the hero wash out the counter at r = 0.
 */
function aperture(radius) {
  var inner = Math.max(0, radius - REVEAL_FEATHER);
  return "radial-gradient(circle at 50% 50%, transparent " + inner + "%, black " + radius + "%)";
}

function initPreloader() {
  var overlay = document.getElementById("preloader");
  var arc = document.getElementById("preloader-ring-arc");
  var label = document.getElementById("preloader-count");
  var cometCanvas = document.getElementById("comet-canvas");

  var counter = new Spring({ value: 0 }, COUNT_CONFIG);
  counter.onChange = function (values) {
    var rounded = Math.round(values.value);
    label.textContent = rounded;
    overlay.setAttribute("aria-valuenow", rounded);
    arc.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE * (1 - values.value / 100));
  };

  var reveal = new Spring({ radius: 0 }, REVEAL_CONFIG);
  reveal.onChange = function (values) {
    var mask = aperture(values.radius);
    overlay.style.setProperty("-webkit-mask-image", mask);
    overlay.style.setProperty("mask-image", mask);
  };

  // Comet field, on the shared ticker.
  var field = createCometField(cometCanvas, readColorToken("--on-media"));
  var stopField = null;
  if (field) {
    var previous = performance.now();
    stopField = subscribeToTicker(function (time) {
      var delta = Math.min((time - previous) / 1000, 0.05);
      previous = time;
      field.resize();
      field.draw(delta);
    }, function () { return 0; });
  }

  var dismiss = function () {
    if (stopField) stopField();
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  };

  var mountedAt = performance.now();
  var timer = null;

  counter.start({ value: HOLD_AT, config: COUNT_CONFIG });

  var run = function () {
    counter.start({
      value: 100,
      config: FINISH_CONFIG,
      onRest: function () {
        // Flip the gate first: the hero starts moving as the aperture opens.
        intro.complete();
        reveal.start({ radius: REVEAL_END, config: REVEAL_CONFIG, onRest: dismiss });
      }
    });
  };

  var finish = function () {
    var remaining = MIN_VISIBLE_MS - (performance.now() - mountedAt);
    if (remaining <= 0) { run(); return; }
    timer = setTimeout(run, remaining);
  };

  if (document.readyState === "complete") finish();
  else window.addEventListener("load", finish);
}

/* ===========================================================================
   SMOOTH SCROLL — src/layouts/scroll-layout.tsx. Lenis from CDN, same 1.x major
   as the source. Skipped silently if the CDN is unreachable (the page is a
   single viewport, so nothing depends on it).
   =========================================================================== */
function initSmoothScroll() {
  if (typeof window.Lenis !== "function") return;
  window.scrollTo(0, 0);
  var lenis = new window.Lenis({ smoothWheel: true });
  window.lenis = lenis;
  var raf = function (time) { lenis.raf(time); requestAnimationFrame(raf); };
  requestAnimationFrame(raf);
}

/* =========================================================================== */
initHero();
initHeroMedia();
initPreloader();
initSmoothScroll();

})();
</script>

<style>
  #torna{position:fixed;left:clamp(14px,2.5vw,28px);bottom:clamp(14px,2.5vw,28px);z-index:9999;
