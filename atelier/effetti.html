<!-- BASE OBBLIGATORIA, e qui serve piu' che altrove.
     `vercel.json` ha `trailingSlash:false`, quindi questa pagina vive a
     `/atelier`; ma ogni mondo vive un livello piu' in giu', a
     `/atelier/la-notte`. Senza base, entrando da li'
     `vendor/three.min.js` diventerebbe `/atelier/vendor/...`,
     404, e resterebbe lo scheletro. Con la base gli indirizzi relativi
     partono sempre da `/atelier/`, a qualunque profondita' si entri. -->
<base href="/atelier/">
<title>Effetti speciali — Atelier</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#04050a;color:#dfe4ee;font-family:'DM Mono',ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    /* NEL FOGLIO ORIGINALE (indice, mazzo acceso) lo scorrimento era
       DIROTTATO sulla rotazione dell'anello e la pagina non scorreva affatto
       — da qui touch-action:none e overflow:hidden. Qui il mazzo è spento e
       l'asse centrale (Task 2) ha bisogno del contrario: una pagina che
       scorre DAVVERO, perché è lo scroll a far salire e girare l'elica. */
    overscroll-behavior-y:none}
  canvas{display:block;width:100%;height:100%}
  #stage{position:fixed;inset:0}

  /* L'ASSE CENTRALE (Task 2) — l'elica DNA di js/dna.js, montata su questo
     elemento invece che sul pin del manifesto (`[data-role="helix-stage"]`
     è quello che dna.js cerca quando non trova #wcManifestoPin). Sta SOPRA
     al fondo (#stage: il suo renderer è opaco, cancella ogni fotogramma —
     dietro non ci sarebbe niente da vedere) e SOTTO alla nav/atrio/etichette,
     che restano leggibili sopra di lei. `pointer-events:none`: è un fondale,
     non deve intercettare i click destinati al bottone dell'atrio. */
  #helixStage{position:fixed;inset:0;z-index:2;pointer-events:none}

  /* LO SPAZIO DA SCORRERE. Tutto il resto della pagina è `position:fixed`
     (nav, stage, atrio, etichette…): senza un elemento vero, nel FLUSSO del
     documento, `document.documentElement.scrollHeight` non supera mai
     l'altezza dello schermo e non c'è scroll — né nativo né di Lenis — da
     dare all'elica. Non si vede (è dietro a tutto, a `z-index` di base) ma
     è lui a dare al documento l'altezza su cui scorrere. */
  #scrollSpacer{position:relative;height:400vh;pointer-events:none}

  /* Le etichette stanno FUORI dal vetro, in DOM: un testo dentro a una
     superficie che rifrange e smeriglia diventa illeggibile. Le insegue lo
     script proiettando il punto in basso di ogni portale. */
  /* Nav propria e minima: il foglio del sito e' scritto per pagine che
     scorrono, e questa non scorre. Stessi colori, stesse misure. */
  #nav{position:fixed;top:0;left:0;right:0;height:72px;z-index:9;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(1rem,3vw,3rem);gap:.75rem;
    background:linear-gradient(180deg,rgba(4,5,10,.82),rgba(4,5,10,0));
    transition:opacity .4s ease}
  #nav.-hide{opacity:0;pointer-events:none}
  .nv-logo{color:#f0f0f6;text-decoration:none;font-size:13px;letter-spacing:.24em;font-weight:500}
  .nv-links{display:flex;list-style:none;gap:.3rem}
  .nv-links a{color:rgba(240,240,246,.62);text-decoration:none;font-size:11px;
    letter-spacing:.1em;padding:.9rem .5rem;display:inline-block}
  .nv-links a:hover,.nv-links a.active{color:#3ad8ff}
  .nv-cta{border:1px solid rgba(240,240,246,.22);margin-left:.4rem}
  #nav a:focus-visible{outline:2px solid #3ad8ff;outline-offset:2px}
  @media (max-width:600px){ .nv-links a{font-size:9.5px;padding:.9rem .28rem} }

  #labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  #labelCam{position:absolute;top:0;left:0;width:100%;height:100%;
    transform-style:preserve-3d}
/* Le scritte stanno DAVANTI alle card, non sotto. Sono ancorate al centro
     della lastra ma spostate verso di te lungo la sua normale: muovendo il
     puntatore scorrono contro il proprio portale, ed è quella parallasse a
     dare la profondità. Non toccano il vetro, quindi non vengono né rifratte
     né smerigliate — l'obiezione che valeva per un testo APPOGGIATO sopra qui
     non vale.
     L'alone scuro dietro non è decorazione: sotto ci può passare un video
     chiaro, e senza quello la scritta sparisce. */
  /* La trasformazione la scrive lo script per intero: qui NIENTE transform,
     se no sovrascrive la matrice 3D e la scritta torna piatta. */
  .lb{position:absolute;top:0;left:0;text-align:center;transform-style:preserve-3d;
    opacity:0;transition:opacity .35s ease;white-space:nowrap}
  .lb.-on{opacity:1}
  .lb::before{content:'';position:absolute;inset:-170% -34%;pointer-events:none;
    background:radial-gradient(ellipse at center,
      rgba(4,5,10,.60) 0%, rgba(4,5,10,.30) 46%, rgba(4,5,10,0) 74%)}
  .lb b,.lb span{position:relative;display:block}
  /* il margine negativo toglie lo spazio in coda che la spaziatura aggiunge
     dopo l'ultima lettera: se no la scritta appare storta a sinistra */
  .lb b{font-family:'Space Grotesk',system-ui,sans-serif;
    font-weight:600;font-size:19px;letter-spacing:.34em;margin-right:-.34em;
    color:#f0f0f6;text-transform:uppercase;
    text-shadow:0 2px 20px rgba(4,5,10,.95);
    transition:letter-spacing .35s cubic-bezier(.22,1,.36,1),color .3s ease}
  .lb span{font-family:'DM Mono',ui-monospace,monospace;
    font-size:9.5px;letter-spacing:.24em;margin-right:-.24em;margin-top:10px;
    color:rgba(223,228,238,.54);text-transform:uppercase;
    text-shadow:0 1px 14px rgba(4,5,10,.95);transition:color .3s ease}
  .lb.-hot b{color:var(--hot,#3ad8ff);letter-spacing:.46em;margin-right:-.46em}
  .lb.-hot span{color:rgba(223,228,238,.78)}
  /* LA SCRITTA DEL VUOTO. E' l'unico elemento della scena senza colore, e la
     sua scritta deve dirlo: piu' piccola, piu' spenta, in corsivo di peso e
     non di forma. Si accende soltanto quando ci passi sopra — e allora e' un
     invito, non un bottone. */
  .lb.-void b{font-size:15px;color:rgba(240,240,246,.50)}
  .lb.-void span{color:rgba(223,228,238,.34)}
  .lb.-void.-hot b{color:#3ad8ff}
  @media (max-width:760px){ .lb.-void b{font-size:10.5px} }

  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(223,228,238,.34);transition:opacity .4s ease;text-align:center}

  /* LA FOCUS CAPTION — le scritte come in Mirror Hall.
     Non piu' un'etichetta appesa a ogni card (nella rotonda sono nove e si
     accavallano): una sola didascalia in basso al centro che segue il mondo
     davanti. Contatore, NOME grande che si scambia col blur-rise, settore, e
     sotto i fermi a capsula. Tutto DOM, nitido, sopra il canvas. */
  #focus{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;
    width:92%;display:flex;flex-direction:column;align-items:center;gap:11px;
    text-align:center;opacity:0;transition:opacity .5s ease;pointer-events:none}
  #focus.-on{opacity:1}
  #focus .counter{display:flex;align-items:baseline;gap:7px;
    font-family:'DM Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.16em}
  #focus .counter .num{color:var(--hot,#3ad8ff);font-size:13px;
    text-shadow:0 0 16px rgba(58,216,255,.4)}
  #focus .counter i{color:rgba(190,214,246,.34);font-style:normal}
  #focus .counter .tot{color:rgba(190,214,246,.5)}
  #focus .fname{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;
    font-size:clamp(21px,3.2vw,34px);letter-spacing:.16em;margin-right:-.16em;
    text-transform:uppercase;color:#f0f0f6;line-height:1;
    text-shadow:0 2px 30px rgba(4,5,10,.92);will-change:transform,opacity,filter}
  /* IL VUOTO: l'unica scritta senza colore, in corsivo di peso e non di forma. */
  #focus .fname.-void{color:rgba(240,240,246,.58);font-weight:500;font-style:italic}
  @keyframes focusSwap{
    from{opacity:0;transform:translateY(9px);filter:blur(5px)}
    to{opacity:1;transform:none;filter:blur(0)}}
  #focus .fname.-swap{animation:focusSwap .5s cubic-bezier(.22,.61,.36,1) both}
  #focus .fsub{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;
    letter-spacing:.26em;margin-right:-.26em;margin-top:-2px;text-transform:uppercase;
    color:rgba(223,228,238,.55)}
  /* I FERMI, a capsula come in Mirror Hall: un punto per mondo che quando e'
     davanti sboccia in una capsula del colore del mondo. */
  #dots{display:flex;align-items:center;gap:9px;margin-top:3px}
  #dots button{width:5px;height:5px;padding:0;border:0;border-radius:4px;
    background:rgba(176,204,244,.26);cursor:pointer;pointer-events:auto;
    transition:width .5s cubic-bezier(.22,.61,.36,1),background .5s ease,box-shadow .5s ease}
  #dots button:hover{background:rgba(176,204,244,.52)}
  #dots button.-now{width:22px;background:var(--now,#3ad8ff);
    box-shadow:0 0 12px rgba(58,216,255,.55)}
  #dots button:focus-visible{outline:2px solid #3ad8ff;outline-offset:4px}
  @media (max-width:600px){
    #focus{bottom:44px} #dots button.-now{width:18px}
    #hint{font-size:9px;letter-spacing:.1em;bottom:20px;white-space:nowrap}
  }

  /* Il mondo aperto: il video a tutto schermo dopo lo zoom. */
  #world{position:fixed;inset:0;z-index:8;opacity:0;pointer-events:none;
    transition:opacity .28s ease;background:#04050a}
  #world.-on{opacity:1;pointer-events:auto}
  #world video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #world .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(4,5,10,.82) 0%,rgba(4,5,10,.25) 42%,rgba(4,5,10,.88) 100%)}
  #world .copy{position:absolute;left:clamp(1.4rem,5vw,4rem);bottom:clamp(2rem,8vh,5rem);max-width:36ch}
  #world .copy i{font-style:normal;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--hot,#3ad8ff)}
  #world .copy h2{font-size:clamp(1.8rem,4.4vw,3.1rem);font-weight:400;line-height:1.05;
    letter-spacing:.02em;margin:.5rem 0 .6rem;text-transform:uppercase}
  #world .copy p{font-size:12.5px;color:rgba(223,228,238,.6);letter-spacing:.04em;line-height:1.7}
  #world .exits{display:flex;gap:10px;margin-top:1.5rem;flex-wrap:wrap}
  #world button{background:transparent;color:#dfe4ee;border:1px solid rgba(223,228,238,.26);
    padding:9px 16px;font:inherit;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer}
  #world button:hover{border-color:var(--hot,#3ad8ff);color:var(--hot,#3ad8ff)}
  #world button:focus-visible{outline:2px solid #3ad8ff;outline-offset:2px}

  #hero{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1.4rem;text-align:center;
    padding:2rem;transition:opacity .5s ease;pointer-events:none}
  #hero.-off{opacity:0}
  #hero .k{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#3ad8ff}
  #hero h1{font-size:clamp(1.9rem,4.6vw,3.4rem);font-weight:400;line-height:1.16;
    letter-spacing:.01em;text-transform:uppercase;
    text-shadow:0 2px 30px rgba(4,5,10,.95)}
  #hero h1 em{font-style:normal;color:#3ad8ff}
  #hero button{pointer-events:auto;margin-top:.6rem;background:transparent;color:#dfe4ee;
    border:1px solid rgba(223,228,238,.3);padding:11px 26px;font:inherit;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  #hero button:hover{border-color:#3ad8ff;color:#3ad8ff}
  #hero button:focus-visible{outline:2px solid #3ad8ff;outline-offset:3px}

  #err{position:fixed;inset:0;display:none;place-items:center;padding:32px;text-align:center;
    color:#ff6b6b;font-size:13px;line-height:1.7;z-index:20}
  @media (max-width:760px){ .lb b{font-size:11px} .lb span{font-size:9.5px} }
</style>


<style>
  /* ── IL SIPARIO: il marchio si CONDENSA dal vapore ────────────────────────
     Portato da `capitoli.html` (js/loader.js) SENZA il suo runtime: là
     l'effetto girava dentro a `WC.register` e la sua linea del tempo era di
     gsap. Qui non c'è né l'uno né l'altro — il vapore è tutto nel canvas, il
     resto era orchestrazione, e si rifà in venti righe.
     La regola che conta: il velo si alza e IL CONTENUTO ENTRA MENTRE SI ALZA,
     non dopo. Il sipario che si scopre su una pagina già viva è un gesto solo;
     aspettare che sia finito ne fa due. */
  #velo{position:fixed;inset:0;z-index:10000;background:#04050a;
    display:flex;align-items:center;justify-content:center}
  #velo.-via{pointer-events:none}
  #velo-inner{position:relative;z-index:1;transition:opacity .4s cubic-bezier(.4,0,1,1)}
  #velo.-sfuma #velo-inner{opacity:0}
  #velo canvas{display:block}
  .velo-tenda{position:absolute;left:0;right:0;height:50.5%;background:#04050a;
    transition:transform .9s cubic-bezier(.87,0,.13,1)}
  .velo-t{top:0} .velo-b{bottom:0}
  #velo.-sfuma .velo-t{transform:translateY(-100%)}
  #velo.-sfuma .velo-b{transform:translateY(100%)}
  /* fino a che il sipario non parte, l'atrio non si vede: entra attraverso */
  #hero{opacity:0;transition:opacity .8s ease}
  body.-aperto #hero{opacity:1}
  /* E QUANDO SE NE VA, DEVE SFUMARE.
     `body.-aperto #hero` pesa (1,1,1) e `#hero.-off` pesa (1,1,0): finito il
     sipario vinceva sempre il primo, quindi l'atrio restava a piena opacita'
     e spariva di colpo al `display:none` dopo 600 ms. La dissolvenza c'era
     nel CSS e non si e' mai vista. Questa riga rimette il peso a posto. */
  body.-aperto #hero.-off{opacity:0}
</style>

<!-- Task 2 — l'asse centrale (l'elica DNA di js/dna.js) porta con sé il
     modulo WC che la registra e la sua base di scroll: gsap+ScrollTrigger
     (core.js li registra sempre, anche se qui non c'è una sezione da
