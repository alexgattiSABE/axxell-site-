<script src="vendor/gsap.min.js?v=20260824a"></script>
<script src="vendor/ScrollTrigger.min.js?v=20260824a"></script>
<script src="vendor/lenis.min.js?v=20260824a"></script>
<script src="vendor/three.min.js?v=20260824a"></script>
<script src="js/core.js?v=20260824a"></script>
<script src="js/glsl.js?v=20260824a"></script>
<script src="js/dna.js?v=20260824a"></script>
<!-- Task 3 — i dati del disco degli effetti (EFFETTI/CLUSTERS) e il percorso
     sull'elica (window.helixPlace). Caricato PRIMA dell'inline: quello legge
     window.EFFETTI durante il parse (al posto della vecchia lista WORLDS). -->
<script src="js/effetti-deck.js?v=20260831a"></script>
<script>
(function(){
  var errBox = document.getElementById('err');
  if (typeof THREE === 'undefined'){
    errBox.style.display = 'grid';
    errBox.textContent = 'three.js non caricato. Apri la pagina da un server (http://localhost:8788/atelier/), non con doppio clic dal Finder.';
    return;
  }

  /* IL FLAG DEL CANTIERE (Task 1). La pozza Mirror Hall e' tolta, e il
     mazzo di portali non si costruisce ancora: le funzioni del vetro
     (VERT/FRAG/TARATURA) restano definite piu' sotto perche' servono ai
     prossimi task, ma non vengono chiamate finche' questo resta a false.
     Con DECK_ON=false lo stage e' vuoto: solo lo sfondo (nebbia+pulviscolo),
     la nav, nessun portale, nessuna didascalia a fuoco. */
  /* Task 3 — IL MAZZO È ACCESO. Le 7 card degli effetti si costruiscono e
     cavalcano l'elica (window.helixPlace), guidate dallo scroll globale come
     l'asse centrale. */
  var DECK_ON = true;

  /* ⚠️ LA MINA DELLO SCROLL (Task 2→3). La giostra di index.html dirottava la
     rotellina e le frecce sulla rotazione dell'anello con e.preventDefault(),
     e bloccava lo scroll della pagina. Task 2 ha legato l'elica allo scroll
     GLOBALE (Lenis su desktop, scrollY nativo altrove) tramite #scrollSpacer;
     riaccendere quel dirottamento qui RI-bloccherebbe la pagina e fermerebbe
     l'elica. Quindi la giostra-scroll resta SPENTA (`RING_SCROLL=false`): niente
     preventDefault, niente spingi(); il disco legge lo STESSO progresso globale
     che muove l'elica (vedi `deckScrollProgress()` e il blocco in frame()), così
     elica e card scorrono insieme su una sola sorgente. */
  var RING_SCROLL = false;

  /* ======================================================================
     I SEI MONDI. Ognuno è un SETTORE, non una tecnica: è la condizione
     dell'intero progetto. Il colore non è decorativo — è quello con cui il
     mondo tinge la nebbia intorno a sé quando lo guardi, così il fondo resta
     neutro e sono i portali a colorarlo.
     `poster` è quello che si vede sempre; `video` parte solo al passaggio.
     ====================================================================== */
  /* `page` = il mondo ha una pagina sua. Chi ce l'ha si raggiunge navigando,
     sotto la copertura dello zoom; chi non ce l'ha ancora resta sul pannello
     provvisorio, cosi' la mappa e' completa anche a costruzione in corso. */
  /* MISURA UNICA PER TUTTE LE LASTRE.
     Nella costellazione ogni portale aveva la sua taglia: erano fermi, e la
     differenza si leggeva come profondita'. In una giostra sfilano uno dietro
     l'altro nello stesso posto, e la stessa differenza si legge come un
     errore. Ed e' la misura del NUCLEO: ogni mondo e' grande esattamente
     quanto lo slot che resta da riempire. */
  /* La misura e' TARATA sulla fila, non scelta a occhio: e' quella per cui
     la lastra davanti riempie il quadro come si deve E si sovrappone alla
     successiva. La sovrapposizione non e' un effetto collaterale — senza,
     il vetro non ha niente da rifrangere e torna a essere una cornice. */
  var CW = 2.95, CH = 1.84;

  /* Task 3 — LA SORGENTE DEI DATI È window.EFFETTI (7 effetti), non più la
     lista dei 9 mondi. Vive in js/effetti-deck.js, caricato prima di questo
     script. Il resto del mazzo (mesh, vetro, focus, trattini) continua a
     leggere `WORLDS`: qui è solo un alias del nuovo array, così il blocco
     ereditato non va riscritto. I record hanno `col` e `poster` come i mondi;
     `sett` è aliasato a `tipo` dentro effetti-deck.js per la focus-caption e
     i trattini. Niente `vuoto`/`page`/`video`: le card sono poster di vetro. */
  var WORLDS = window.EFFETTI;
  WORLDS.forEach(function(w, i){ w.idx = i; });

  /* ══ IL MAZZO ═════════════════════════════════════════════════════════
     Non piu' un anello. L'anello era onesto — la lastra si volta e il vetro
     si chiude — ma teneva meta' delle lastre girate di spalle, e per arrivare
     alla quinta bisognava fare mezzo giro al buio. Qui invece si devono
     VEDERE tutte, e si deve poter andare su una qualsiasi quando si vuole.
     Le nove lastre stanno quindi su una fila che sfugge in profondita' da
     tutti e due i lati, come un mazzo aperto a ventaglio. Chi e' al posto
     zero e' davanti, grande e di faccia; gli altri arretrano, rimpiccioliscono
     e si girano, ma restano tutti in quadro e tutti cliccabili. Si scorre, la
     fila scorre, e la lastra che arriva davanti si ingrandisce.
     Due conti fanno tutto il lavoro, e nessuno dei due e' decorativo:
       · `tanh` sulla x — la fila non se ne va fuori schermo, si accumula
         verso un punto di fuga. Senza, la quarta lastra e' gia' fuori.
       · la profondita' cresce LINEARE mentre la x satura. Se saturano
         tutt'e due, l'angolo di vista non e' piu' monotono: le lastre si
         sorpassano e la fila torna indietro su se stessa (provato).
     E soprattutto: LE LASTRE SI SOVRAPPONGONO, di proposito. E' la condizione
     perche' il vetro abbia qualcosa da rifrangere.
     ═════════════════════════════════════════════════════════════════════ */
  var NZ = -1.55;                       // dove gira lo sciame senza destinazione
  var STEP = 1;                         // l'unita' di scorrimento e' UNA lastra
  /* ══ LA ROTONDA (Mirror Hall) ══════════════════════════════════════════
     Le nove lastre non stanno piu' su una fila a ventaglio: stanno su un
     ANELLO, e la camera e' AL CENTRO che guarda in fuori. Chi e' davanti
     (u=0) sta a (0, cardY, -R), di faccia; girando l'anello gli altri mondi
     arrivano davanti. Si vede l'arco che ti sta di fronte (~5 lastre); gli
     altri sono dietro le tue spalle e si scoprono girando — e' il patto della
     rotonda, scelto sapendo il compromesso.
     Le lastre restano PIATTE e tangenti all'anello (non incurvate come le
     card di Mirror Hall): incurvarle romperebbe la normale dello smusso del
     vetro, la taratura del 24/08. La pozza riflettente sta sotto, alla quota
     y=0, e le lastre sono alzate a `cardY` perche' stiano sopra il pelo. */
  var RING = { R:6.6, cardY:1.18, camH:0.92, lookY:0.98 };
  var TWO_PI_N = 2*Math.PI / WORLDS.length;

  function wrapN(u, n){ u = (u + n*0.5) % n; if (u < 0) u += n; return u - n*0.5; }
  /* Quanti posti separano una lastra da quello davanti, col segno e col giro
     corto: e' il numero da cui discende tutto il resto. */
  function deckU(i, pos){ return wrapN(i - pos, WORLDS.length); }
  /* Task 3 — LA POSIZIONE NON È PIÙ SULL'ANELLO, È SULL'ELICA.
     La vecchia deckPlace disponeva le lastre su un anello attorno alla camera
     (out.set(R·sinθ, cardY, −R·cosθ)). Ora delega a window.helixPlace, che le
     fa salire lungo l'elica dell'asse centrale (vedi js/effetti-deck.js). Resta
     una funzione locale così i tre punti di chiamata (portalPoint, costruzione
     card, frame()) non cambiano. deckYaw/deckScale/deckFade restano quelli
     dell'anello, ereditati. */
  function deckPlace(u, out){
    return window.helixPlace(u, out);
  }
  /* La lastra guarda il centro: la sua normale (+Z locale) punta alla camera.
     rotation.y = -theta. E la `fwd` calcolata a valle come
     (sin(yaw),0,cos(yaw)) torna la normale giusta. */
  function deckYaw(u){ return -u * TWO_PI_N; }
  function deckRoll(u){ return 0; }              // su un anello non serve rollio
  /* Tutte le lastre sono alla stessa distanza dal centro, quindi alla stessa
     misura: e' la rotonda di Mirror Hall. Il mondo a fuoco non si stacca per
     grandezza ma perche' e' centrato, piu' acceso (uHot) e nominato dalla
     didascalia. */
  function deckScale(u){ return 1; }
  /* Chi si volta di spalle sparisce. Dietro la camera non si vedrebbe
     comunque, ma questo spegne DOLCEMENTE l'arco posteriore ai lati invece di
     farlo scomparire di scatto. c = quanto la lastra e' rivolta verso di te. */
  function deckFade(u){
    var c = Math.cos(u * TWO_PI_N);
    return c <= -0.1 ? 0 : (c >= 0.35 ? 1 : (c + 0.1) / 0.45);
  }

  var canvas   = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x04050a, 1);
  renderer.autoClear = false;

  var camera = new THREE.PerspectiveCamera(66, 1, 0.1, 240);
  /* La camera sta AL CENTRO dell'anello e guarda in fuori. Un filo di z
     positivo per non stare esattamente sul perno; `resize()` la fa arretrare
     su schermo stretto perche' la lastra davanti ci stia comunque. */
  var CAM0 = new THREE.Vector3(0, RING.camH, 0.001);
  camera.position.copy(CAM0);

  var mobile = window.matchMedia('(max-width:760px)').matches ||
               window.matchMedia('(pointer:coarse)').matches;

  /* ======================================================================
     1. IL MONDO DIETRO
     ====================================================================== */
  var bg = new THREE.Scene();

  var fogMat = new THREE.ShaderMaterial({
    depthTest:false, depthWrite:false,
    uniforms:{ uTime:{value:0}, uAspect:{value:1}, uTint:{value:new THREE.Vector3(0,0,0)}, uTintStr:{value:0} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.999,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform float uTime,uAspect,uTintStr; uniform vec3 uTint;',
      'float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
      'void main(){',
      '  vec2 p=(vUv-0.5)*vec2(uAspect,1.0); float d=length(p);',
      '  vec3 base=mix(vec3(0.055,0.052,0.085),vec3(0.010,0.011,0.021),smoothstep(0.0,0.95,d));',
      '  base+=vec3(0.020,0.012,0.050)*(1.0-smoothstep(0.0,0.55,d));',
      // il mondo guardato tinge la nebbia: il fondo resta neutro, sono i portali a colorarlo
      '  base+=uTint*uTintStr*0.085*(1.0-smoothstep(0.0,1.05,d));',
      '  base+=(h(gl_FragCoord.xy+uTime)-0.5)*0.012;',
      '  gl_FragColor=vec4(base,1.0);',
      '}'
    ].join('\n')
  });
  var fog = new THREE.Mesh(new THREE.PlaneGeometry(2,2), fogMat);
  fog.frustumCulled = false;
  bg.add(fog);

  /* ══════════════════════════════════════════════════════════════════════
     LE PARTICELLE — UNA SOLA POPOLAZIONE, TRE DESTINI.

     Questo è il pezzo che tiene insieme tutto il capitolo: NON esiste un
     tunnel e poi una mappa. Esiste un solo sistema di punti, una sola camera,
     e una sola scena. All'inizio i punti sfilano verso di te (il tunnel);
     poi il viaggio rallenta fino a fermarsi, e ognuno raggiunge la
     destinazione che aveva già assegnata dall'inizio:

       ruolo 0 — l'85%: si allarga e diventa il pulviscolo di fondo;
       ruolo 1 — il 12%: converge sulla superficie di uno dei sei portali e
                 lì densifica finché il portale non traspare e lo sostituisce;
       ruolo 2 — il resto: NON ha una destinazione. Resta a girare attorno al
                 nucleo vuoto. Sono le uniche rimaste senza posto, ed è
                 l'altra metà della frase che sta già scritta nel capitolo
                 dell'elica: «ognuna con la sua destinazione già assegnata».

     Non c'è niente da cucire fra tunnel e mappa perché non si taglia niente:
     cambia solo `uAssign`, da 0 a 1. ══════════════════════════════════════ */
  var PN = mobile ? 1500 : 3400;
  var TUNNEL_LEN = 26.0;
  var pPos = new Float32Array(PN*3), pTgt = new Float32Array(PN*3),
      pSeed = new Float32Array(PN), pRole = new Float32Array(PN);

  /* Le facce dei portali servono da bersaglio: un punto a caso sulla lastra,
     portato in coordinate di mondo. Si prendono le posizioni dell'anello A
     GIRO FERMO (spin = 0), che sono quelle su cui le lastre traspaiono a fine
     coreografia: l'ingresso avviene prima che la giostra si muova, e comunque
     appena i portali sono formati queste particelle si spengono. */
  var tmpP = new THREE.Vector3();
  function portalPoint(w, out){
    var u = deckU(w.idx, 0), sc = deckScale(u);
    out.set((Math.random()-0.5)*CW*sc*0.94, (Math.random()-0.5)*CH*sc*0.94, 0);
    out.applyEuler(new THREE.Euler(0, deckYaw(u), deckRoll(u)));
    out.add(deckPlace(u, tmpP));
    return out;
  }
  var tmpV = new THREE.Vector3();
  for (var i=0;i<PN;i++){
    // posizione di partenza: sparsa nel tubo che sfila
    var ang = Math.random()*6.283, rad = 0.9 + Math.pow(Math.random(),0.6)*4.6;
    pPos[i*3]   = Math.cos(ang)*rad;
    pPos[i*3+1] = Math.sin(ang)*rad*0.72;
    pPos[i*3+2] = Math.random()*TUNNEL_LEN;
    pSeed[i]    = Math.random();

    var r = Math.random();
    if (r < 0.12){                                   // sulla faccia di un portale
      pRole[i] = 1;
      var w = WORLDS[i % WORLDS.length];
      portalPoint(w, tmpV);
      pTgt[i*3]=tmpV.x; pTgt[i*3+1]=tmpV.y; pTgt[i*3+2]=tmpV.z;
    } else if (r < 0.17){                            // senza destinazione, attorno al vuoto
      pRole[i] = 2;
      pTgt[i*3]=0; pTgt[i*3+1]=0; pTgt[i*3+2]=0;
    } else {                                         // il fondo
      pRole[i] = 0;
      pTgt[i*3]   = (Math.random()-0.5)*15;
      pTgt[i*3+1] = (Math.random()-0.5)*9;
      pTgt[i*3+2] = (Math.random()-0.5)*7 - 1.8;
    }
  }
  var pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('aTarget',  new THREE.BufferAttribute(pTgt,3));
  pGeo.setAttribute('aSeed',    new THREE.BufferAttribute(pSeed,1));
  pGeo.setAttribute('aRole',    new THREE.BufferAttribute(pRole,1));
  pGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 40);

  var dustMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uPr:{value:renderer.getPixelRatio()},
               uTravel:{value:0}, uAssign:{value:0}, uSpeed:{value:1},
               uCardsIn:{value:0}, uNZ:{value:0}, uLen:{value:TUNNEL_LEN} },
    vertexShader:[
      'attribute vec3 aTarget; attribute float aSeed, aRole;',
      'uniform float uTime,uPr,uTravel,uAssign,uSpeed,uCardsIn,uNZ,uLen;',
      'varying float vA;',
      'void main(){',
      // dov'è mentre sfila: la z scorre e si riavvolge
      '  vec3 sp = vec3(position.xy, mod(position.z + uTravel, uLen) - uLen*0.62);',
      // ogni particella parte con un suo ritardo: l'assegnazione non è un salto
      '  float d = clamp((uAssign - aSeed*0.26) / 0.74, 0.0, 1.0);',
      '  d = d*d*(3.0-2.0*d);',
      '  vec3 tgt = aTarget;',
      '  if (aRole > 1.5){',                     // quelle senza posto: girano attorno al vuoto
      '    float a = aSeed*6.283 + uTime*0.055;',
      '    float rr = 0.95 + fract(aSeed*7.3)*0.8;',
      '    tgt = vec3(cos(a)*rr, sin(a)*rr*0.58, uNZ + (fract(aSeed*13.1)-0.5)*0.4);',
      '  }',
      '  vec3 p = mix(sp, tgt, d);',
      '  if (aRole < 0.5){',                     // il fondo respira piano
      '    p.x += sin(uTime*0.11 + aSeed*6.28)*0.20*d;',
      '    p.y += cos(uTime*0.09 + aSeed*11.0)*0.16*d;',
      '  }',
      '  vec4 mv = modelViewMatrix * vec4(p,1.0);',
      '  float base = 0.16 + 0.5*(0.5+0.5*sin(uTime*0.5 + aSeed*19.0));',
      '  vA = mix(0.85, base, d) * (0.35 + 0.65*uSpeed*0.0 + 0.65);',
      // sulla faccia dei portali le particelle si spengono via via che il
      // portale traspare: sono loro a diventarlo
      '  if (aRole > 0.5 && aRole < 1.5) vA *= (1.0 - uCardsIn);',
      '  gl_PointSize = (1.3 + 1.4*fract(aSeed*3.1) + uSpeed*2.6) * uPr * (3.4 / max(0.3, -mv.z));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'varying float vA;',
      'void main(){ float d=length(gl_PointCoord-0.5); if(d>0.5) discard;',
      '  gl_FragColor=vec4(vec3(0.62,0.78,0.95), vA*(1.0-smoothstep(0.18,0.5,d))); }'
    ].join('\n')
  });
  var dust = new THREE.Points(pGeo, dustMat);
  dust.frustumCulled = false;
  bg.add(dust);

  /* IL NUCLEO AL CENTRO NON C'E' PIU', E I RAGGI NEMMENO.
     Erano il perno dell'anello: un contorno vuoto al centro e otto raggi che
     ci convergevano. Con la fila non c'e' un centro da tenere sgombro — il
     posto vuoto e' l'ULTIMA lastra, la si raggiunge scorrendo come tutte le
     altre, e i raggi non avrebbero piu' un punto verso cui puntare. Quello
     che resta della vecchia scena e' il pulviscolo, che serviva a comporre la
     fila e continua a servire. */

  /* ======================================================================
     2. IL VETRO — materiale approvato il 24/08/2026. NON ritarare.
     `uFlat` è l'unica aggiunta: a 1 il portale si disegna piatto, ed è la
     versione che finisce nel render target per farsi vedere dagli altri.
     ====================================================================== */
  /* IL VETRO E' TORNATO A ESSERE VETRO.
     La taratura del 24/08 era di una lastra che si guarda da sola su fondo
     nero: aperta di faccia (`uOpen` 0.75) mostrava il contenuto quasi
     pulito, e la rifrazione viveva solo sullo smusso (`rMask` partiva da
     0.10). In una fila di lastre sovrapposte quel materiale sparisce — sono
     nove cornici con dentro nove fotografie.
     Qui il vetro ha un CORPO: smeriglia il contenuto anche al centro
     (`uInside`, che prima non esisteva), non si apre mai del tutto
     (`uOpen` 0.46), rifrange su tutta la superficie e non solo al bordo, e
     ha un velo lattiginoso (`uMilk`) che ne fa una lastra invece di una
     finestra. Quello che c'e' dentro si INTUISCE. */
  /* DE-SFOCO (27/08): la fila di lastre sovrapposte chiedeva un vetro con un
     CORPO fitto per non essere nove cornici; ma nella rotonda, e con la
     richiesta esplicita di «vedere il contenuto», quel velo era troppo. I tre
     numeri che nascondono il contenuto scendono: `uInside` (velo al centro)
     0.30→0.12, `uMilk` (corpo lattiginoso) 0.38→0.20, `uFrost` (smeriglia al
     bordo) 0.85→0.52. Rifrazione e trasmissione restano: e' ancora vetro, si
     vede solo cosa c'e' dentro. */
  var TARATURA = { uFres:2.2, uOpen:0.56, uThick:0.022, uDisp:0.26,
                   uBev:0.16, uRim:0.62, uGain:1.28, uPar:0.06, uBlur:0.60,
                   uFrost:0.52, uInside:0.12, uMilk:0.20, uThru:0.60 };

  var VERT = [
    'varying vec2 vUv; varying vec3 vView; varying mat3 vTBN;',
    'void main(){',
    '  vUv=uv;',
    '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
    '  vView=-mv.xyz;',
    '  vec3 T=normalize((modelViewMatrix*vec4(1.0,0.0,0.0,0.0)).xyz);',
    '  vec3 B=normalize((modelViewMatrix*vec4(0.0,1.0,0.0,0.0)).xyz);',
    '  vec3 N=normalize((modelViewMatrix*vec4(0.0,0.0,1.0,0.0)).xyz);',
    '  vTBN=mat3(T,B,N);',
    '  gl_Position=projectionMatrix*mv;',
    '}'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'varying vec2 vUv; varying vec3 vView; varying mat3 vTBN;',
    'uniform sampler2D tScene,tVideo;',
    'uniform vec2 uRes;',
    'uniform float uFres,uOpen,uThick,uDisp,uBev,uRim,uGain,uPar,uBlur,uFrost,uInside,uMilk,uThru;',
    'uniform float uVidAsp,uCardAsp,uFlat,uHot,uDim,uReveal,uVuoto;',
    'uniform vec3 uCol;',

    'float sdBox(vec2 p,vec2 b,float r){ vec2 q=abs(p)-b+r;',
    '  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }',

    // DUE anelli di prelievi, non uno: con un anello solo una smerigliatura
    // larga non sfoca, SDOPPIA — si vedono le otto copie del contorno.
    'vec3 blurVid(vec2 uv,float r){',
    '  if(r<=0.0) return texture2D(tVideo,uv).rgb;',
    '  float d=r*0.70710678, h=r*0.5, e=h*0.70710678;',
    '  vec3 s=texture2D(tVideo,uv).rgb*0.16;',
    '  s+=texture2D(tVideo,uv+vec2( r,0.0)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2(-r,0.0)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2(0.0, r)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2(0.0,-r)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2( d, d)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2( d,-d)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2(-d, d)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2(-d,-d)).rgb*0.06;',
    '  s+=texture2D(tVideo,uv+vec2( h,0.0)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2(-h,0.0)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2(0.0, h)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2(0.0,-h)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2( e, e)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2( e,-e)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2(-e, e)).rgb*0.045;',
    '  s+=texture2D(tVideo,uv+vec2(-e,-e)).rgb*0.045;',
    '  return s; }',

    'vec3 blur9(vec2 uv,float r){',
    '  if(r<=0.0) return texture2D(tScene,uv).rgb;',
    '  vec3 s=texture2D(tScene,uv).rgb*0.28; float d=r*0.70710678;',
    '  s+=texture2D(tScene,uv+vec2( r,0.0)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2(-r,0.0)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2(0.0, r)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2(0.0,-r)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2( d, d)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2( d,-d)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2(-d, d)).rgb*0.09;',
    '  s+=texture2D(tScene,uv+vec2(-d,-d)).rgb*0.09;',
    '  return s; }',

    'void main(){',
    '  vec2 p=(vUv-0.5)*2.0; p.x*=uCardAsp;',
    '  vec2 b=vec2(uCardAsp,1.0)-0.012; float rad=0.14;',
    '  float sd=sdBox(p,b,rad);',
    '  if(sd>0.0) discard;',

    // normale dello smusso: un asse per volta, continua ovunque
    '  vec2 tE=clamp((abs(p)-(b-uBev))/max(uBev,1e-4),0.0,1.0);',
    '  tE=tE*tE*(3.0-2.0*tE);',
    '  vec2 tilt=sign(p)*tE;',
    '  float bend=clamp(max(abs(tilt.x),abs(tilt.y)),0.0,1.0);',
    '  vec3 N=normalize(vTBN*normalize(vec3(tilt*1.35,1.0-bend*0.30)));',
    '  vec3 V=normalize(vView);',

    // il contenuto, smerigliato più verso il bordo
    '  vec2 vuv=vUv; float k=uCardAsp/uVidAsp;',
    '  if(k<1.0){ vuv.y=(vuv.y-0.5)*k+0.5; } else { vuv.x=(vuv.x-0.5)/k+0.5; }',
    '  vuv-=vec2(V.x,V.y)*uPar;',
    // LA SMERIGLIATURA NON PARTE PIU' DA ZERO AL CENTRO. `uInside` e' il velo
    // che c'e' anche in mezzo alla lastra: e' quello che fa intuire il
    // contenuto invece di mostrarlo.
    // Chi e' davanti smeriglia MENO: resta veloce da leggere senza per questo
    // diventare una finestra. Il velo c'e' comunque, e' la lastra a scostarsi.
    '  float frost=(uInside*(1.0-uHot*0.42) + uFrost*bend)*0.055;',
    '  vec3 inside=blurVid(clamp(vuv,0.006,0.994),frost)*uGain;',
    '  inside*=(1.0-uVuoto);',

    '  float f=pow(1.0-clamp(dot(N,V),0.0,1.0),uFres);',
    // La fascia del bordo e' in unita' NORMALIZZATE della lastra: crescendo la
    // lastra cresceva anche in pixel, e da filo di luce diventava un tubo.
    '  float rim=smoothstep(0.038,0.0,-sd);',
    '  float a=1.0-smoothstep(-0.006,0.0,sd);',

    // passaggio piatto: nessuna lettura della scena, serve solo a farsi vedere
    /* IL PASSAGGIO PIATTO E' SEMITRASPARENTE, E QUI STA IL PUNTO.
       Nel render target ci finiscono lo sfondo e poi le lastre piatte. Ma la
       lastra che poi legge quel bersaglio ci trova sopra anche SE STESSA:
       disegnandosi piatta e OPACA si tappava il proprio buco, e attraverso il
       vetro non passava piu' niente di cio' che ha dietro — ne' l'elenco ne'
       la nebbia. Restava solo la propria immagine, spostata di poco.
       A meta' alfa il bersaglio contiene tutt'e due: la lastra vede
       attraverso di se' quello che le sta dietro, e continua a vedere le
       compagne. E' l'unico numero che decide se questo vetro trasmette. */
    '  if(uFlat>0.5){',
    '    vec3 fc=inside*0.62+uCol*rim*0.5;',
    '    gl_FragColor=vec4(fc,a*0.48*uReveal); return;',
    '  }',

    /* LA SFOCATURA DI CIO' CHE STA DIETRO E' BASSA DI PROPOSITO (`uBlur`
       0.40, non 1.5). Il velo che rende illeggibile il contenuto e'
       `uInside`, ed e' un'altra cosa: agisce sulla texture della lastra.
       Questa qui agisce su cio' che si vede ATTRAVERSO, e sfocandolo tanto
       il testo dell'elenco dietro al mazzo si spappolava — spariva invece di
       spezzarsi. Il vetro deve DEFORMARE quello che ha dietro, non
       cancellarlo. */
    '  vec2 suv=gl_FragCoord.xy/uRes;',
    // LA RIFRAZIONE VIVE SU TUTTA LA LASTRA, non solo sullo smusso: e' quello
    // che fa scorrere e spezzare cio' che sta dietro anche in mezzo al vetro.
    '  float rMask=mix(0.42,1.0,bend);',
    /* LO SPESSORE E' PICCOLO PERCHE' LE LASTRE SONO GRANDI.
       `off` e' in unita' di SCHERMO: a 0.078 lo scostamento era di oltre
       cento pixel, e cio' che si vedeva attraverso non era piu' quello che
       sta dietro alla lastra ma quello che sta dietro a un palmo di distanza
       — il testo dell'elenco veniva teleportato fuori dal vetro invece di
       essere spezzato. A 0.022 la deformazione si vede e resta quella
       giusta. Con lastre piccole questo numero puo' tornare a crescere. */
    '  vec2 off=N.xy*uThick*rMask;',
    '  float br=uBlur*0.009;',
    '  vec3 sR=blur9(suv+off*(1.0+uDisp),br);',
    '  vec3 sG=blur9(suv+off,br);',
    '  vec3 sB=blur9(suv+off*(1.0-uDisp),br);',
    '  vec3 refr=vec3(sR.r,sG.g,sB.b);',

    // uHot: quanto è "guardato". Apre di più e accende il bordo del suo colore.
    '  float open=clamp((1.0-f)*uOpen*(1.0+uHot*0.34)*(1.0-uVuoto),0.0,1.0);',
    '  vec3 col=mix(refr,inside,open);',
    /* CIO' CHE STA DIETRO SI SOMMA, non si contende il posto.
       Con la sola mescolanza il contenuto della lastra e quello che le passa
       dietro si dividono lo stesso pixel: l'elenco dietro al mazzo arrivava
       al 40% del suo grigio su un poster scuro, cioe' non arrivava. Sommato,
       invece, passa cio' che DIETRO E' CHIARO e non passa cio' che e' scuro —
       che e' come si comporta una lastra traslucida, ed e' la ragione per cui
       il testo si legge attraverso il vetro mentre il nero resta nero. */
    // Chi e' davanti trasmette MENO: e' la lastra che si sta scegliendo, e
    // la sagoma della vicina che le passa dietro le toglierebbe leggibilita'
    // proprio quando serve. Di fianco invece si trasmette pieno, ed e' li'
    // che il testo dell'elenco attraversa il vetro.
    '  col+=refr*uThru*(1.0-uHot*0.55);',
    // IL CORPO DEL VETRO: un velo lattiginoso, tinto appena del colore del
    // mondo, piu' fitto verso il bordo. Senza, la lastra e' una finestra.
    '  float lum=dot(col,vec3(0.299,0.587,0.114));',
    '  col=mix(col, mix(vec3(lum),uCol*0.55+0.30,0.30)*1.06, uMilk*(0.40+0.60*bend));',
    '  col+=mix(vec3(0.42,0.78,0.95),uCol,uHot)*rim*(uRim+uHot*0.38)*(0.35+0.65*f);',
    '  col+=vec3(0.10,0.16,0.24)*f*0.5;',
    '  col*=uDim;',                       // gli altri portali arretrano
    '  gl_FragColor=vec4(col,a*uReveal);',
    '}'
  ].join('\n');

  /* ======================================================================
     3. I PORTALI
     ====================================================================== */
  var loader = new THREE.TextureLoader();
  var cards = new THREE.Group();
  var scene = new THREE.Scene();
  scene.add(cards);

  var RES = new THREE.Vector2(1,1);
  /* Un pixel nero, e serve davvero: e' quello che prende il posto della
     texture della scena mentre si sta disegnando dentro alla scena. */
  var vuota = new THREE.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, THREE.RGBAFormat);
  vuota.needsUpdate = true;
  var rt = new THREE.WebGLRenderTarget(2,2,{
    minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
    format:THREE.RGBAFormat, stencilBuffer:false, depthBuffer:true
  });

  /* IL MAZZO NON SI COSTRUISCE ANCORA (Task 1). Le prossime righe creano una
     mesh per ogni mondo — poster, materiale del vetro, ancora della scritta.
     Restano scritte per il task che rimette il mazzo in scena; qui, dietro
     DECK_ON=false, non girano mai e `cards` resta un gruppo vuoto. */
  if (DECK_ON) WORLDS.forEach(function(w, i){
    /* La lastra vuota non carica niente: dentro non c'e' un mondo, e il
       pixel nero fa da contenuto assente senza casi speciali a valle. */
    var tex = vuota;
    if (!w.vuoto){
      tex = loader.load(w.poster, function(t){
        w.posterAsp = t.image.width / t.image.height;
        w.mat.uniforms.uVidAsp.value = w.posterAsp;
      });
      tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
      tex.encoding = THREE.sRGBEncoding;
    }
    w.posterTex = tex;

    var uni = {
      tScene:{value:rt.texture}, tVideo:{value:tex}, uRes:{value:RES},
      uVidAsp:{value:16/9}, uCardAsp:{value:CW/CH},
      uFlat:{value:0}, uHot:{value:0}, uDim:{value:1}, uReveal:{value:0},
      uVuoto:{value:w.vuoto ? 1 : 0},
      uCol:{value:new THREE.Vector3(w.col[0],w.col[1],w.col[2])}
    };
    Object.keys(TARATURA).forEach(function(k){ uni[k] = { value: TARATURA[k] }; });
    /* Esposizione per mondo. La taratura del vetro non si tocca — questo è
       l'unico numero che cambia da un portale all'altro, e serve perché un
       contenuto girato di giorno in mezzo a cinque mondi notturni buca la
       scena e si mangia l'attenzione che deve andare al centro. */
    if (w.gain) uni.uGain.value = w.gain;

    var mat = new THREE.ShaderMaterial({
      uniforms:uni, vertexShader:VERT, fragmentShader:FRAG,
      /* DUE LATI. Su una giostra meta' delle lastre e' girata di spalle: con
         il taglio delle facce posteriori sparirebbero di colpo a meta' giro.
         Viste da dietro il Fresnel le trova completamente chiuse — nessun
         contenuto, solo rifrazione e bordo — che e' esattamente cio' che deve
         essere il dorso di un portale. */
      side:THREE.DoubleSide,
      transparent:true, depthWrite:false
    });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), mat);
    deckPlace(deckU(i, 0), mesh.position);
    mesh.rotation.set(0, deckYaw(deckU(i, 0)), deckRoll(deckU(i, 0)));
    mesh.scale.setScalar(deckScale(deckU(i, 0)));
    /* NIENTE renderOrder. Prima era fisso (10+i) perche' le lastre erano
       ferme; qui girano, e un ordine fisso farebbe disegnare una lastra
       lontana SOPRA a una vicina a ogni mezzo giro. Lasciato a zero, three
       riordina i trasparenti dal fondo per profondita' a ogni fotogramma. */
    mesh.userData.world = w;
    w.mesh = mesh; w.mat = mat; w.uni = uni;
    cards.add(mesh);


    /* L'ANCORA DELLA SCRITTA È UN FIGLIO DELLA CARD.
       Non un punto proiettato: un oggetto agganciato alla lastra, spostato di
       `lift` lungo il suo asse z locale — che è la normale della card. Così
       eredita di suo posizione, INCLINAZIONE e scala, e la scritta si posa sul
       piano del portale invece di restare appiccicata allo schermo. Se la card
       è girata di tre quarti, lo è anche la scritta. */
    w.fwd = new THREE.Vector3(0,0,1).applyEuler(new THREE.Euler(0, deckYaw(deckU(i,0)), 0));
    w.u = deckU(i, 0);                // il posto nella fila, col segno
    w.lift = 0.30 + CW*0.10;
    w.liftNow = w.lift;
    var anchor = new THREE.Object3D();
    anchor.position.set(0, 0, w.lift);
    mesh.add(anchor);
    w.anchorObj = anchor;

    /* NIENTE PIU' ETICHETTA PER-CARD. Nella rotonda le nove scritte
       appese alle lastre si accavallano; il nome del mondo davanti lo dice
       ora la focus-caption in basso, come in Mirror Hall. L'ancora resta
       (inerte) per non toccare oltre. */
    w.label = null;
  });

  /* ══ L'INDICE — ED E' TESTO CHE STA DENTRO ALLA SCENA ═════════════════
     Le scritte delle lastre sono DOM: nitide a qualunque risoluzione, con
     una parallasse vera, e per questo restano dove sono. Ma proprio perche'
     sono DOM stanno SOPRA al canvas, e il vetro non le puo' rifrangere —
     non entrano mai nel render target da cui la rifrazione legge.
     Questo invece e' testo disegnato su una tela e appeso nella scena,
     DIETRO al mazzo: le lastre ci passano sopra e lo scompongono, lo
     spostano, lo sdoppiano nei tre colori. E' l'unico modo per avere
     davvero del testo rifratto senza rinunciare alla nitidezza di quello
     che conta.
     Non e' solo una dimostrazione: e' l'elenco dei settori. Chi arriva
     legge in un colpo se il suo mestiere c'e', e cliccando una riga si
     porta davanti quel mondo. Le nove righe dicono quello che i nove
     trattini in basso non possono dire.
     ══════════════════════════════════════════════════════════════════ */
  var IW = 900, IH = 540, IROW0 = 150, IROWH = 44;
  var idxCv = document.createElement('canvas');
  idxCv.width = IW; idxCv.height = IH;
  var idxG = idxCv.getContext('2d');
  var idxTex = new THREE.CanvasTexture(idxCv);
  idxTex.minFilter = THREE.LinearFilter; idxTex.magFilter = THREE.LinearFilter;
  idxTex.encoding = THREE.sRGBEncoding;
  var idxMat = new THREE.MeshBasicMaterial({
    map:idxTex, transparent:true, depthWrite:false, opacity:0
  });
  var idxMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.40, 1.44), idxMat);
  idxMesh.position.set(-2.62, -1.12, -2.00);
  idxMesh.frustumCulled = false;
  /* In `bg`, non in `scene`: `bg` viene disegnato nel render target PRIMA
     delle lastre, ed e' quel passaggio che il vetro legge. Messo insieme
     alle lastre, sarebbe visibile ma non rifrangibile. */
  bg.add(idxMesh);

  var idxSopra = -1;                 // la riga sotto al puntatore
  function idxDisegna(){
    idxG.clearRect(0,0,IW,IH);
    try { idxG.letterSpacing = '3px'; } catch(e){}
    idxG.textBaseline = 'middle';
    idxG.font = '500 27px "DM Mono", ui-monospace, monospace';
    idxG.fillStyle = 'rgba(240,240,246,0.82)';
    idxG.fillText('CHE COSA TI MOSTRO?', 34, 60);
    WORLDS.forEach(function(w, i){
      var y = IROW0 + i*IROWH;
      var acceso = (w === hot) || (i === idxSopra);
      idxG.font = '400 25px "DM Mono", ui-monospace, monospace';
      idxG.fillStyle = acceso
        ? 'rgba(' + w.col.map(function(v){ return Math.round(v*255); }).join(',') + ',0.95)'
        : 'rgba(223,228,238,0.60)';
      idxG.fillText('->', 34, y);
      idxG.fillText(w.sett.toUpperCase(), 84, y);
    });
    idxTex.needsUpdate = true;
  }
  idxDisegna();
  /* Il carattere arriva dopo: la prima passata esce col monospazio di
     sistema, e senza questa seconda ci resterebbe per sempre. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(idxDisegna);

  /* Quale riga sta sotto al puntatore. Le lastre hanno la precedenza: la
     parte destra dell'elenco sta DIETRO a quella davanti, ed e' li' che
     si vede la rifrazione — cliccandoci si deve entrare nella lastra. */
  function pickRiga(){
    if (idxMat.opacity < 0.25) return -1;
    ray.setFromCamera(ptr, camera);
    var h = ray.intersectObject(idxMesh, false);
    if (!h.length || !h[0].uv) return -1;
    var y = (1 - h[0].uv.y) * IH;
    var k = Math.round((y - IROW0)/IROWH);
    return (k >= 0 && k < WORLDS.length && Math.abs(y - (IROW0 + k*IROWH)) < IROWH*0.46) ? k : -1;
  }

  /* Un solo video acceso per volta: la regola che tiene in piedi il telefono. */
  var video = document.createElement('video');
  video.muted = true; video.loop = true; video.playsInline = true;
  video.setAttribute('playsinline',''); video.preload = 'auto';
  video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(video);
  var vtex = new THREE.VideoTexture(video);
  vtex.minFilter = THREE.LinearFilter; vtex.magFilter = THREE.LinearFilter;
  vtex.format = THREE.RGBFormat; vtex.encoding = THREE.sRGBEncoding;
  var videoOn = null;

  function playOn(w){
    if (videoOn === w) return;
    if (videoOn){ videoOn.uni.tVideo.value = videoOn.posterTex;
                  videoOn.uni.uVidAsp.value = videoOn.posterAsp || 16/9;
                  videoOn.uni.uGain.value = videoOn.gain || TARATURA.uGain;
                  videoOn = null; }
    if (!w || !w.video) { video.pause(); return; }
    videoOn = w;
    if (video.getAttribute('src') !== w.video){ video.src = w.video; }
    video.play().catch(function(){});
    /* LA TEXTURE SI ATTACCA SOLO QUANDO C'E' UN FOTOGRAMMA DA LEGGERE.
       Assegnandola subito, three prova a caricare un video ancora vuoto e il
       driver risponde `INVALID_VALUE: texImage2D: no video` — a ogni
       fotogramma, finche' non arriva il primo. Non si perde niente ad
       aspettare: fino a quel momento nella lastra resta il poster. */
    /* Il guadagno segue la SORGENTE, non il mondo: il poster del prodotto e'
       su fondo bianco e il suo video e' notturno, e un solo numero per tutti
       e due li sbaglia tutti e due. */
    function attacca(){
      if (videoOn !== w) return;
      w.uni.tVideo.value = vtex;
      w.uni.uGain.value = w.gainVid || TARATURA.uGain;
    }
    if (video.readyState >= 2) attacca();
    else video.addEventListener('loadeddata', function una(){
      video.removeEventListener('loadeddata', una); attacca();
    });
  }

  /* ══════════════════════════════════════════════════════════════════════
     3.5 LA POZZA RIFLETTENTE — TOLTA (Task 1).
     C'era qui la riflessione planare di Mirror Hall: una camera specchiata
     (`reflectCam`) che rendeva bg+lastre piatte dentro `reflectRT`, un piano
     d'acqua (`water`) che campionava quel bersaglio increspandolo con onde
     procedurali, e una scia (`dropRipple`, raycast su y=0) che il puntatore
     lasciava nell'acqua. Tolta di netto — non dietro un flag, perche' lo
     stage di questo task non ha ne' pelo d'acqua ne' un piano y=0 da colpire.
     Il render e' tornato a un solo passaggio (vedi `frame()`, sezione 4).
     ══════════════════════════════════════════════════════════════════════ */

  /* ======================================================================
     4. LA GIOSTRA — lo scorrimento fa girare l'anello.
     Non c'e' una barra di scorrimento e la pagina non si muove di un pixel:
     il gesto di scorrere viene dirottato sulla rotazione. E' la promessa che
     il sito faceva gia' a parole nel capitolo dell'offerta — «un sito che si
     attraversa, non uno che si sfoglia» — solo che qui l'asse non e'
     verticale, e' l'anello.
     Tre regole, e sono tutte e tre necessarie:
       · finche' nessuno l'ha toccata la giostra gira DA SOLA, pianissimo.
         Senza, nulla dice che si puo' girare: si vede una card e basta.
       · appena la si prende in mano smette, e da li' in poi SCATTA sui suoi
         fermi quando ci si ferma. Una giostra che si pianta a meta' fra due
         mondi non ha scelto niente.
       · lo scatto arriva DOPO il gesto, mai durante: 300 ms di silenzio.
     ====================================================================== */
  var spin = 0, spinT = 0;            // dov'e' l'anello, e dove sta andando
  var toccato = false;                // qualcuno l'ha presa in mano?

  /* Task 3 — LA SORGENTE DELLO SCROLL, LA STESSA DELL'ELICA.
     dna.js legge il progresso globale così: Lenis su desktop (`WC.lenis.progress`,
     già 0..1), altrove lo scroll nativo `scrollY/(scrollHeight−innerHeight)`.
     Lo rifacciamo qui identico, così l'elica e il disco leggono lo STESSO
     numero e scorrono insieme. #scrollSpacer (400vh) dà l'altezza da scorrere. */
  function deckScrollProgress(){
    var c = function(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); };
    if (typeof WC !== 'undefined' && WC.lenis && typeof WC.lenis.progress === 'number')
      return c(WC.lenis.progress);
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    return c(window.scrollY / max);
  }
  var lastInput = -1e9;
  var dragging = false, dragId = null, dragX = 0, dragY = 0, dragAxis = 0, dragMoved = 0;

  /* Quale mondo e' davanti: th = i*STEP + spin, e davanti c'e' chi ha th = 0. */
  function frontIdx(){
    var k = Math.round(spin) % WORLDS.length;
    return (k + WORLDS.length) % WORLDS.length;
  }
  /* Il primo gesto di scorrimento ENTRA, non salta: chi arriva e scorre
     subito deve vedere il tunnel fermarsi e la giostra comporsi, e' il
     mezzo secondo per cui esiste tutta la scena. Ma un trackpad manda venti
     eventi in un gesto solo, e se ognuno saltasse la coreografia non si
     vedrebbe mai: si salta solo con un gesto NUOVO, dopo 800 ms. */
  function svegliaGiostra(){
    if (stage === 'hero'){ entra(); return true; }
    if (stage === 'arrivo'){
      if (performance.now() - arriveT > 800) skip();
      return true;
    }
    return false;
  }
  function spingi(d){
    /* Task 3 — la giostra-scroll è spenta: il disco lo muove lo scroll globale
       (vedi frame()), non questi input. Guardia su RING_SCROLL così rotellina,
       trascino e frecce non fanno scroll in competizione. */
    if (openW || !RING_SCROLL) return;
    toccato = true; lastInput = performance.now();
    spinT += d;
  }
  /* Porta davanti un mondo preciso prendendo il giro piu' corto: si somma il
     numero intero di giri che avvicina di piu' il bersaglio a dove siamo. */
  function portaDavanti(i){
    if (openW) return;
    toccato = true;
    lastInput = -1e9;                 // niente attesa: questo e' gia' un fermo
    spinT = i + Math.round((spinT - i)/WORLDS.length)*WORLDS.length;
  }

  /* La rotellina e il trackpad. `deltaMode` va normalizzato: a righe (1) un
     "clic" vale una manciata di pixel, a pagine (2) vale una schermata, e
     senza questo conto lo stesso gesto gira di un dito su un portatile e di
     mezzo giro su un mouse a scatti. */
  window.addEventListener('wheel', function(e){
    if (openW) return;
    // Task 3: il mazzo è acceso ma la giostra-scroll NO (RING_SCROLL=false):
    // lo scroll resta della PAGINA — #scrollSpacer le dà l'altezza, l'elica e
    // il disco leggono quel progresso globale. Niente preventDefault qui, o si
    // ribloccherebbe la pagina e l'elica si fermerebbe.
    if (DECK_ON && RING_SCROLL) e.preventDefault();
    if (svegliaGiostra()) return;
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    var unit = e.deltaMode === 1 ? 17 : (e.deltaMode === 2 ? window.innerHeight : 1);
    spingi(d * unit * 0.0026);
  }, {passive:false});

  /* Il trascinamento, dito o mouse che sia. L'asse si decide al primo
     movimento e non si cambia piu' idea: se no un gesto un po' storto fa
     ballare l'anello avanti e indietro. */
  window.addEventListener('pointerdown', function(e){
    if (openW || e.button) return;
    ptr.set((e.clientX/window.innerWidth)*2-1, -((e.clientY/window.innerHeight)*2-1));
    dragging = true; dragId = e.pointerId;
    dragX = e.clientX; dragY = e.clientY; dragAxis = 0; dragMoved = 0;
  });
  window.addEventListener('pointermove', function(e){
    if (!dragging || e.pointerId !== dragId) return;
    var dx = e.clientX - dragX, dy = e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (!dragAxis && dragMoved > 6) dragAxis = Math.abs(dx) >= Math.abs(dy) ? 1 : 2;
    if (!dragAxis) return;
    if (svegliaGiostra()) return;
    /* IL SEGNO NON E' UNA SCELTA: la lastra davanti deve andare DOVE VA IL
       DITO, se no si sta tirando una cosa che scappa dalla parte opposta.
       Alzando lo spin la lastra davanti scorre a destra (la sua x e'
       sin(th)*r, e in zero la derivata e' +r): quindi dito a sinistra =
       spin che cala, cioe' `dx` cosi' com'e'. In verticale vale lo stesso
       patto della rotellina: dito in su = come scorrere in giu' = avanti. */
    spingi(dragAxis === 1 ? -dx*0.0060 : -dy*0.0060);
  }, {passive:true});
  function fineTrascino(){ if (dragging){ dragging = false; lastInput = performance.now(); } }
  window.addEventListener('pointerup', fineTrascino);
  window.addEventListener('pointercancel', fineTrascino);

  window.addEventListener('keydown', function(e){
    if (openW) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown'){
      if (DECK_ON && RING_SCROLL) e.preventDefault(); if (svegliaGiostra()) return; spingi(STEP);
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){
      if (DECK_ON && RING_SCROLL) e.preventDefault(); if (svegliaGiostra()) return; spingi(-STEP);
    } else if (k === 'Enter'){
      if (svegliaGiostra()) return;
      if (hot){ e.preventDefault(); enter(hot); }
    }
  });

  /* I FERMI, in basso: otto trattini, uno per mondo, e si puo' saltare
     direttamente a uno qualsiasi. In un carosello con otto posti il conto
     di quanti ne restano non deve costare un giro completo per scoprirlo. */
  var dotsEl = document.getElementById('dots');
  WORLDS.forEach(function(w, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', w.nome + ' — ' + w.sett);
    b.style.setProperty('--now', 'rgb(' + w.col.map(function(v){return Math.round(v*255);}).join(',') + ')');
    b.addEventListener('click', function(ev){ ev.stopPropagation(); portaDavanti(i); });
    dotsEl.appendChild(b);
    w.dot = b;
  });

  if (mobile){
    document.getElementById('hint').textContent = 'trascina per cambiare mondo — tocca per entrare';
  }

  /* LA FOCUS CAPTION — nome del mondo davanti, come in Mirror Hall. Cambia col
     blur-rise a ogni mondo nuovo; il vuoto e' l'unica scritta senza colore. */
  var focusEl = document.getElementById('focus');
  var fNameEl = document.getElementById('fName'),
      fSubEl  = document.getElementById('fSub'),
      fNumEl  = document.getElementById('fNum');
  document.getElementById('fTot').textContent = String(WORLDS.length).padStart(2,'0');
  function aggiornaFocus(w){
    if (!w) return;
    fNameEl.textContent = w.nome;
    fNameEl.classList.toggle('-void', !!w.vuoto);
    fSubEl.textContent = w.sett;
    fNumEl.textContent = String(w.idx+1).padStart(2,'0');
    focusEl.style.setProperty('--hot', 'rgb(' + w.col.map(function(v){return Math.round(v*255);}).join(',') + ')');
    // riavvia l'animazione di scambio
    fNameEl.classList.remove('-swap'); void fNameEl.offsetWidth; fNameEl.classList.add('-swap');
  }

  /* ======================================================================
     5. PUNTATORE, MESSA A FUOCO, ENTRATA E USCITA
     ====================================================================== */
  /* ══════════════════════════════════════════════════════════════════════
     GLI STADI. `hero` → `arrivo` → `mappa`. Non sono scene diverse: è lo
     stesso frame, con tre numeri che si muovono.
     ══════════════════════════════════════════════════════════════════════ */
  /* UN INDIRIZZO PER MONDO, SUL PATH.
     Si condivide, il tasto indietro funziona, e Google indicizza sette pagine
     invece di una. Il rewrite che serve sta in vercel.json: senza, un ingresso
     diretto su /atelier/la-notte darebbe 404. */
  var ROOT = '/atelier';
  function worldFromPath(){
    var parts = location.pathname.replace(/\/+$/,'').split('/');
    var last = parts[parts.length-1];
    return (last === 'atelier' || last === '') ? '' : last;
  }

  /* SI TORNA DA UN MONDO: la coreografia d'ingresso e' roba da prima visita.
     Chi rientra dalla pagina di un mondo trova la mappa gia' composta, col
     portale da cui e' uscito acceso e un filo piu' avanti. Il parametro lo
     mette il link «Mappa» delle pagine dei mondi. */
  var CAME_FROM = (function(){
    try { return new URLSearchParams(location.search).get('da') || ''; }
    catch(e){ return ''; }
  })();

  var stage = 'hero';
  var travel = 0, speed = 1;      // quanto scorre il tunnel, e a che velocità
  var assign = 0;                 // 0 = sfila, 1 = tutti a destinazione
  var cardsIn = 0;                // i portali traspaiono dentro agli ammassi
  var spokeIn = 0;                // i raggi si disegnano per ultimi
  var arriveT = 0;

  function entra(){
    if (stage !== 'hero') { skip(); return; }
    stage = 'arrivo'; arriveT = performance.now();
    document.getElementById('hero').classList.add('-off');
    setTimeout(function(){ var h=document.getElementById('hero'); if(h) h.style.display='none'; }, 600);
  }
  // Alla terza volta la meraviglia è un pedaggio: un secondo clic salta in fondo.
  function skip(){
    if (stage !== 'arrivo') return;
    speed = 0; assign = 1; cardsIn = 1; spokeIn = 1; stage = 'mappa';
  }
  document.getElementById('go').addEventListener('click', function(e){ e.stopPropagation(); entra(); });

  var ray = new THREE.Raycaster();
  var ptr = new THREE.Vector2(-2,-2);
  var mx=0, my=0, tmx=0, tmy=0;
  /* CHI E' A FUOCO NON LO DECIDE PIU' IL PUNTATORE, LO DECIDE LA GIOSTRA.
     Nella costellazione i portali erano fermi e si sceglieva guardandoli; qui
     c'e' sempre e solo un mondo davanti, ed e' quello. Il puntatore resta per
     una cosa sola: sapere su quale lastra si e' cliccato. */
  var hot = null;                 // il mondo davanti
  var hotSince = 0;               // da quando: il precaricamento aspetta che ci si fermi
  var overCard = null;            // la lastra sotto al puntatore, se c'e'
  function pick(){
    ray.setFromCamera(ptr, camera);
    var h = ray.intersectObjects(cards.children, false);
    return h.length ? h[0].object.userData.world : null;
  }
  var openW = null;               // il mondo in cui si è entrati
  var zoom = 0, zoomT = 0;        // 0 = mappa, 1 = dentro
  var tintCol = new THREE.Vector3(0,0,0), tintStr = 0;

  /* Qui non c'e' piu' la guardia `pointerMoved`: serviva quando a mettere a
     fuoco era il raycast, e il primo fotogramma col mouse fermo altrove
     spegneva il portale da cui si era appena usciti. Ora a fuoco c'e' chi e'
     davanti sull'anello, e al rientro l'anello e' gia' fermo su quel mondo. */
  window.addEventListener('pointermove', function(e){
    tmx = (e.clientX/window.innerWidth)*2-1;
    tmy = (e.clientY/window.innerHeight)*2-1;
    ptr.set(tmx, -tmy);
  }, {passive:true});

  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    window.addEventListener(ev, function(){ video.play().catch(function(){}); }, {once:true});
  });

  var prefetched = {};
  function prefetch(w){
    if (!w || !w.page || prefetched[w.id]) return;
    prefetched[w.id] = 1;
    var l = document.createElement('link');
    l.rel = 'prefetch'; l.href = w.page; l.as = 'document';
    document.head.appendChild(l);
  }

  function enter(w, push){
    if (!w || openW) return;
    /* Nella rotonda si entra in chi e' davanti; ma da URL/popstate il mondo
       puo' non esserlo ancora — si scatta l'anello su di lui prima di volarci
       dentro, se no la camera parte verso una lastra di fianco. */
    if (w.idx !== frontIdx()) { spin = spinT = w.idx; }
    openW = w; zoomT = 1;
    playOn(w);

    /* IL MONDO E' UNA PAGINA: lo zoom non e' una transizione DECORATIVA, e' la
       copertura del caricamento. Si parte, e quando il portale ha riempito il
       quadro — cioe' quando fuori non si vede piu' niente — si naviga. Il
       precaricamento e' partito al passaggio del puntatore, quindi a quel punto
       la pagina c'e' gia'. */
    if (w.page){
      document.getElementById('hint').style.opacity = 0;
      document.getElementById('nav').classList.add('-hide');
      setTimeout(function(){ location.href = w.page; }, 520);
      return;
    }
    var el = document.getElementById('world');
    el.style.setProperty('--hot','rgb('+w.col.map(function(v){return Math.round(v*255);}).join(',')+')');
    document.getElementById('wKick').textContent = '// ' + w.sett;
    document.getElementById('wName').textContent = w.nome;
    document.getElementById('wDesc').textContent = w.desc;
    var vv = el.querySelector('video');
    if (vv) vv.remove();
    if (w.video){
      var v2 = document.createElement('video');
      v2.muted = true; v2.loop = true; v2.playsInline = true; v2.setAttribute('playsinline','');
      v2.src = w.video; el.insertBefore(v2, el.firstChild); v2.play().catch(function(){});
    }
    setTimeout(function(){ el.classList.add('-on'); el.setAttribute('aria-hidden','false'); }, 380);
    document.getElementById('hint').style.opacity = 0;
    document.getElementById('nav').classList.add('-hide');
    if (push !== false && window.history && history.pushState) history.pushState({w:w.id}, '', ROOT + '/' + w.id);
  }
  function leave(pop){
    if (!openW) return;
    var el = document.getElementById('world');
    el.classList.remove('-on'); el.setAttribute('aria-hidden','true');
    var vv = el.querySelector('video'); if (vv) vv.remove();
    hot = openW; openW = null; zoomT = 0;
    document.getElementById('hint').style.opacity = '';
    document.getElementById('nav').classList.remove('-hide');
    if (!pop && window.history && history.pushState) history.pushState({}, '', ROOT);
  }
  window.addEventListener('popstate', function(e){
    var id = worldFromPath();
    var w = WORLDS.filter(function(x){ return x.id === id; })[0];
    if (w && !openW) enter(w, false);
    else if (!w && openW) leave(true);
  });
  document.getElementById('wBack').addEventListener('click', function(){ leave(); });
  document.getElementById('wTalk').addEventListener('click', function(){ leave(); });
  document.getElementById('wNext').addEventListener('click', function(){
    var i = WORLDS.indexOf(openW); leave();
    setTimeout(function(){ enter(WORLDS[(i+1)%WORLDS.length]); }, 420);
  });
  window.addEventListener('keydown', function(e){ if (e.key === 'Escape') leave(); });

  window.addEventListener('click', function(){
    if (stage === 'hero'){ entra(); return; }
    if (stage === 'arrivo'){ skip(); return; }
    if (openW) return;
    /* Un trascinamento finisce sempre con un clic: senza questa guardia
       girare la giostra farebbe entrare nel mondo su cui si e' lasciato. */
    if (dragMoved > 8){ dragMoved = 0; return; }
    /* Si conta il colpo QUI e non nel fotogramma: il clic arriva subito dopo
       il rilascio, prima che il ciclo di disegno abbia rifatto il raycast, e
       con un tocco secco il risultato del fotogramma precedente e' vecchio. */
    var w = pick();
    if (w){ if (w === hot) enter(w); else portaDavanti(w.idx); return; }
    var r = pickRiga();
    if (r >= 0) portaDavanti(r);
  });

  /* Dove sta la lastra davanti, e quanto lontano bisogna stare per vederla
     intera. Il campo visivo di three e' VERTICALE: su un telefono in piedi
     l'apertura orizzontale e' meno di meta' di quella di un portatile, e con
     una distanza fissa la card davanti usciva dallo schermo da tutti e due i
     lati. La distanza quindi non e' un numero, e' un conto: quello che serve
     perche' la larghezza della lastra piu' un margine ci stia. Sul desktop il
     conto da' meno di 4.35 e vince il valore di partenza, quindi la
     composizione tarata a mano non si muove di un pixel. */
  var ZFRONT = -RING.R;                 // la lastra davanti sta a z = -R
  var MEZZOFOV = Math.tan(66*Math.PI/180/2);

  /* Task 3 — SU RITRATTO SI STRINGE IL PASSO DELL'ELICA.
     Il campo visivo di three è verticale: su un telefono in piedi l'apertura
     ORIZZONTALE è meno di metà di quella del desktop, e le card sparse di lato
     (A·sin(phase)) sbordano. Come resize() stringe la giostra nella home, qui
     si stringono apertura (A) e salita (climb) — R e turns restano — così in
     quadro ne restano 3–4 accumulate verso il fuga invece di uscire ai lati.
     I numeri base sono quelli tarati in js/effetti-deck.js; qui si scalano. */
  var HELIX_BASE = null;
  function helixTune(){
    if (!HELIX_BASE) HELIX_BASE = {
      A:window.__HELIX_TUNE.A, R:window.__HELIX_TUNE.R, turns:window.__HELIX_TUNE.turns,
      climb:window.__HELIX_TUNE.climb, yTop:window.__HELIX_TUNE.yTop
    };
    var b = HELIX_BASE, t = window.__HELIX_TUNE;
    var portrait = (window.innerWidth / window.innerHeight) < 1;
    t.A     = b.A     * (portrait ? 0.66 : 1);
    t.climb = b.climb * (portrait ? 0.82 : 1);
    t.yTop  = b.yTop  * (portrait ? 0.90 : 1);
    t.R     = b.R;
    t.turns = b.turns;
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight, pr = renderer.getPixelRatio();
    renderer.setSize(w,h,false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    helixTune();
    /* Il campo visivo di three e' VERTICALE: su un telefono in piedi
       l'apertura orizzontale e' meno di meta' di quella di un portatile. La
       camera al centro dell'anello arretra un filo verso +z su schermo
       stretto perche' la lastra davanti ci stia intera coi suoi margini; sul
       desktop il conto da' meno di zero e la camera resta sul perno. */
    var need = (CW*0.5 + (camera.aspect < 1 ? 0.22 : 0.30)) / (MEZZOFOV*camera.aspect);
    /* Task 3 — la lastra davanti non sta più a z=−R (anello) ma a z=−R+A
       (elica: il punto più vicino della spirale). La camera arretra quel tanto
       che serve perché la card ci stia coi margini: distanza = CAM0.z + (R−A).
       Su ritratto `need` cresce (FOV orizzontale stretto) e la camera arretra
       parecchio; su desktop il conto è ~0 e resta sul perno. */
    var hz = window.__HELIX_TUNE, front = hz.R - hz.A;
    CAM0.z = Math.max(0.001, need - front);
    DREF = front + CAM0.z;              // distanza camera → lastra davanti
    /* L'elenco «CHE COSA CERCHI?» resta a lato, ma SOPRA il pelo dell'acqua
       (y positivo) perche' non anneghi nella pozza; su telefono va sotto le
       lastre e ingrandito. Rifinitura nella milestone della pozza. */
    /* Su desktop l'elenco sta a SINISTRA, sopra il pelo dell'acqua, girato
       verso il centro cosi' la camera-al-perno lo legge di faccia invece che
       di taglio; resta in `bg`, quindi si specchia nell'acqua. Su telefono va
       IN ALTO (sotto ci sarebbe la pozza) e di faccia. */
    if (camera.aspect < 1){
      idxMesh.position.set(0, 1.78, -3.05); idxMesh.rotation.set(0, 0, 0); idxMesh.scale.setScalar(0.66);
    } else {
      idxMesh.position.set(-2.55, 2.05, -4.35); idxMesh.rotation.set(0, 0.52, 0); idxMesh.scale.setScalar(0.82);
    }
    rt.setSize(Math.round(w*pr), Math.round(h*pr));
    RES.set(Math.round(w*pr), Math.round(h*pr));
    fogMat.uniforms.uAspect.value = w/h;
  }
  window.addEventListener('resize', resize);
  resize();

  var proj = new THREE.Vector3();
  var labelsEl = document.getElementById('labels');
  var labelCam = document.getElementById('labelCam');
  var lastPersp = -1;
  /* I numeri della matrice vanno scritti SENZA notazione esponenziale.
     `+v.toFixed(6)` torna a essere un numero, e JavaScript stampa i valori
     molto piccoli come `4e-06`: in CSS non è un numero valido, quindi il
     browser scarta l'INTERA dichiarazione `transform` — in silenzio, senza un
     errore in console. Il risultato era la trasformata della camera che non
     veniva applicata per niente e le scritte che sparivano.
     Qui esce sempre una stringa in notazione decimale, e sotto la soglia si
     scrive zero. */
  function n(v){
    if (!isFinite(v) || Math.abs(v) < 1e-5) return '0';
    return v.toFixed(5);
  }
  function camMatrix(m){
    var e = m.elements;
    return 'matrix3d(' + [n(e[0]),n(-e[1]),n(e[2]),n(e[3]),
                          n(e[4]),n(-e[5]),n(e[6]),n(e[7]),
                          n(e[8]),n(-e[9]),n(e[10]),n(e[11]),
                          n(e[12]),n(-e[13]),n(e[14]),n(e[15])].join(',') + ')';
  }
  /* IL CSS3D LAVORA IN PIXEL, LA SCENA IN UNITÀ — E I DUE LATI DEVONO
     ANNULLARSI.
     Il layer DOM tratta un'unità di mondo come UN PIXEL. Con card larghe 1.3
     unità le scritte collassano in due pixel al centro e spariscono; e se si
     corregge solo da una parte, escono specchiate e fuori posto (provato).
     La conversione va fatta DUE VOLTE, in versi opposti: la camera viene
     ingrandita di `ppu`, l'ancora della scritta rimpicciolita di `1/ppu`.
     Nel prodotto il fattore sparisce, e resta solo l'effetto voluto — quanti
     pixel di testo stanno in un'unità di mondo.
     `ppu` è la prospettiva diviso la distanza tipica della camera dalle card:
     così a quella profondità il testo esce grande quanto è scritto nel CSS, e
     resta proporzionato se la finestra cambia. */
  /* La distanza di riferimento per le scritte: quella della lastra davanti.
     Se fosse fissa, sul telefono (dove la camera arretra) le scritte
     arriverebbero rimpicciolite; cosi' escono sempre della misura scritta
     nel CSS. La scrive `resize`, qui c'e' solo il primo valore. */
  var DREF = RING.R + CAM0.z;
  var mCam = new THREE.Matrix4(), mObj = new THREE.Matrix4(), mScale = new THREE.Matrix4();

  function objMatrix(m){
    var e = m.elements;
    return 'translate(-50%,-50%)matrix3d(' +
      [n(e[0]),n(e[1]),n(e[2]),n(e[3]),
       n(-e[4]),n(-e[5]),n(-e[6]),n(-e[7]),
       n(e[8]),n(e[9]),n(e[10]),n(e[11]),
       n(e[12]),n(e[13]),n(e[14]),n(e[15])].join(',') + ')';
  }
  var t0 = performance.now(), tPrev = t0;
  function sstep(x){ x = x < 0 ? 0 : (x > 1 ? 1 : x); return x*x*(3-2*x); }

  function frame(){
    requestAnimationFrame(frame);
    var now = performance.now();
    var t = (now-t0)/1000;
    var dt = Math.min(0.05, (now-tPrev)/1000); tPrev = now;

    /* La coreografia. Cinque numeri, nessun taglio: il tunnel rallenta, le
       particelle raggiungono la destinazione che avevano gia', i portali
       traspaiono dentro agli ammassi che si sono formati, e i raggi si
       disegnano per ultimi. Chi torna una seconda volta salta con un clic. */
    if (stage === 'arrivo'){
      var e = now - arriveT;
      speed   = 1 - sstep(e/900);
      assign  = sstep((e-550)/1250);
      cardsIn = sstep((e-1250)/800);
      spokeIn = sstep((e-1800)/700);
      if (e > 2500) stage = 'mappa';
    }
    travel += speed * dt * 5.6;

    /* LA FILA SCORRE — SULLO SCROLL GLOBALE (Task 3).
       Non più il giro d'invito + lo scatto sul fermo della giostra: il disco
       legge il progresso globale (0..1) e lo mappa sull'intera fila di card,
       così l'elica e le card avanzano insieme sulla stessa sorgente. Con N=7
       card, progress 0→prima card a fuoco, progress 1→ultima. Lo smorzamento
       resta, per un movimento morbido. */
    if (!openW){
      spinT = deckScrollProgress() * (WORLDS.length - 1);
    }
    spin += (spinT - spin)*Math.min(1, dt*7.5);

    /* Ogni lastra ripresa e rimessa al suo posto nella fila. `u` — la
       distanza dal posto davanti — e' il numero da cui discende tutto:
       dove sta, quanto e' grande, quanto e' girata, quanto si vede.
       Dietro DECK_ON=false non c'e' nessuna mesh da riposizionare — questo
       loop tocca `w.mesh`/`w.uni`, che esistono solo quando il mazzo (Task
       1: sezione 3, sopra) e' stato costruito. */
    if (DECK_ON) WORLDS.forEach(function(w, i){
      var u = deckU(i, spin);
      w.u = u;
      deckPlace(u, w.mesh.position);
      w.mesh.rotation.set(0, deckYaw(u), deckRoll(u));
      w.mesh.scale.setScalar(deckScale(u));
      w.fwd.set(Math.sin(deckYaw(u)), 0, Math.cos(deckYaw(u)));
      w.uni.uReveal.value = cardsIn * deckFade(u);
      /* La scritta si stacca dalla lastra lungo la sua normale — e' quella
         parallasse a dare la profondita' — ma solo su chi e' davanti: di
         fianco la normale punta di traverso e la scritta finirebbe lontana
         dalla propria lastra. */
      w.liftNow = w.lift * Math.exp(-u*u/1.6) * w.mesh.scale.x;
      w.anchorObj.position.z = w.lift * Math.exp(-u*u/1.6);
    });

    mx += (tmx-mx)*0.055; my += (tmy-my)*0.055;
    zoom += (zoomT-zoom)*(zoomT > zoom ? 0.115 : 0.16);   // entra in ~600ms, esce in ~400

    // a fuoco c'e' chi e' davanti, e basta — ma solo col mazzo acceso
    if (DECK_ON && stage === 'mappa' && !openW){
      var nw = WORLDS[frontIdx()];
      if (nw !== hot){
        hot = nw; hotSince = now; playOn(hot);
        WORLDS.forEach(function(x){ x.dot.classList.toggle('-now', x === hot); });
        aggiornaFocus(hot);
        idxDisegna();
      }
      /* PRECARICARE CHI PASSA E' UN'ALTRA COSA DA PRECARICARE CHI E' SCELTO.
         Prima il precaricamento partiva al passaggio del puntatore, che e'
         gia' una scelta; una giostra invece porta davanti tutti e otto i
         mondi da sola, e precaricandoli tutti si scaricherebbe un megabyte
         e mezzo di pagine a chi non ha ancora deciso niente. Si aspetta che
         qualcuno abbia preso in mano la giostra E che sia rimasto fermo su
         quel mondo mezzo secondo. */
      if (toccato && hot && now - hotSince > 600) prefetch(hot);
      if (!mobile && !dragging){
        overCard = pick();
        var r = overCard ? -1 : pickRiga();
        if (r !== idxSopra){ idxSopra = r; idxDisegna(); }
        document.body.style.cursor = (overCard || r >= 0) ? 'pointer' : '';
      }
    }

    /* La camera si sposta col puntatore: la parallasse viene da sé, i portali
       vicini si muovono più dei lontani senza doverlo scrivere da nessuna
       parte. Entrando, va incontro al portale scelto. */
    /* La camera sta al centro dell'anello e guarda verso la lastra davanti
       (0, lookY, -R). Il puntatore la sposta appena — la parallasse viene da
       se'. Entrando, vola incontro al portale scelto (che a quel punto e' gia'
       quello davanti) e finisce appena davanti a lui. */
    var tx = mx*0.34, ty = RING.camH - my*0.18, tz = CAM0.z;
    var look = new THREE.Vector3(0, RING.lookY, -RING.R);
    if (openW){
      var wp = openW.mesh.position;
      tx = wp.x*zoom + tx*(1-zoom);
      ty = wp.y*zoom + ty*(1-zoom);
      tz = (wp.z + 0.62)*zoom + CAM0.z*(1-zoom);
      look.set(wp.x*zoom + 0*(1-zoom),
               wp.y*zoom + RING.lookY*(1-zoom),
               wp.z*zoom + (-RING.R)*(1-zoom));
    }
    camera.position.set(tx, ty, tz);
    camera.lookAt(look);

    if (DECK_ON) WORLDS.forEach(function(w){
      var isHot = (w === hot || w === openW);
      var u = w.uni;
      u.uHot.value += ((isHot?1:0) - u.uHot.value)*0.12;
      /* Chi non e' davanti arretra, ma non troppo: devono restare tutte
         leggibili e raggiungibili, e' la ragione per cui la fila ha
         sostituito l'anello. */
      var dimT = isHot ? 1 : 0.80;
      u.uDim.value += (dimT - u.uDim.value)*0.10;
    });

    // la nebbia prende il colore del mondo guardato (nessuno, finche' il mazzo e' spento)
    var target = hot || openW;
    var ts = target ? 1 : 0;
    tintStr += (ts - tintStr)*0.08;
    if (target) tintCol.set(target.col[0], target.col[1], target.col[2]);
    fogMat.uniforms.uTint.value.copy(tintCol);
    fogMat.uniforms.uTintStr.value = tintStr*(1-zoom);
    if (!openW){
      document.getElementById('hint').style.opacity = (DECK_ON && stage === 'mappa' ? spokeIn*0.9 : 0);
      focusEl.classList.toggle('-on', DECK_ON && stage === 'mappa' && spokeIn > 0.5);
    }

    /* L'elenco compare quando la fila si e' composta e si ritira entrando
       in un mondo: e' un attrezzo della mappa, non della scena — e la mappa
       non c'e' finche' DECK_ON e' false. */
    var idxT = (DECK_ON && stage === 'mappa' && !openW) ? spokeIn*0.92*(1-zoom) : 0;
    idxMat.opacity += (idxT - idxMat.opacity)*0.10;

    fogMat.uniforms.uTime.value = t;
    var du = dustMat.uniforms;
    du.uTime.value = t; du.uTravel.value = travel; du.uAssign.value = assign;
    du.uSpeed.value = speed; du.uCardsIn.value = cardsIn; du.uNZ.value = NZ;

    if (video.videoWidth && videoOn) videoOn.uni.uVidAsp.value = video.videoWidth/video.videoHeight;

    /* --- UN SOLO PASSAGGIO (Task 1) ---
       Qui c'erano tre passate: (A) il RIFLESSO, camera specchiata rispetto
       al pelo dell'acqua → `reflectRT`, con bg + lastre piatte; (B) il
       PIATTO → `rt`, bg + lastre piatte SENZA acqua, la sorgente da cui il
       vetro rifrange; (C) il FINALE → schermo, bg + acqua + lastre che
       rifrangono. La pozza (acqua, riflesso, onde, scia) e' tolta di netto
       (sezione 3.5, sopra); il mazzo che il passaggio (B) doveva nutrire non
       si costruisce finche' DECK_ON e' false. Resta un solo render dritto a
       schermo, solo `bg` — nebbia e pulviscolo, niente altro. Il mazzo (e la
       sua pozza di vetro, non quella d'acqua) tornano nei prossimi task,
       dietro allo stesso flag. */
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(bg, camera);
    if (DECK_ON) renderer.render(scene, camera);
  }
  /* Task 3 — IL DISCO PARTE GIÀ COMPOSTO.
     La coreografia atrio→tunnel→mappa (con il giro d'invito) era della giostra;
     qui l'elica è l'asse sempre vivo e le card la cavalcano da subito, guidate
     dallo scroll globale. Si salta dritti a 'mappa' — così `cardsIn=1` rivela
     le card e il fuoco si accende — e si nasconde l'atrio, che parlava dei 9
     mondi e coprirebbe la scena. */
  if (DECK_ON){
    stage = 'mappa'; speed = 0; assign = 1; cardsIn = 1; spokeIn = 1; travel = 0;
    var heroEl = document.getElementById('hero');
    if (heroEl){ heroEl.classList.add('-off'); heroEl.style.display = 'none'; }
  }

  requestAnimationFrame(frame);

  // se si arriva con un indirizzo già puntato a un mondo, ci si entra
  // (irrilevante finche' il mazzo e' spento: `playOn`/`hot` presumono le mesh)
  if (DECK_ON && CAME_FROM){
    var back = WORLDS.filter(function(x){ return x.id === CAME_FROM; })[0];
    if (back){
      stage = 'mappa'; speed = 0; assign = 1; cardsIn = 1; spokeIn = 1; travel = 0;
      /* La giostra e' gia' girata fin li': si esce dal mondo e lo si ritrova
         davanti, fermo sul suo scatto. Ed e' gia' stata «toccata», quindi non
         riparte il giro d'invito — quello e' per chi non ha ancora capito. */
      spin = spinT = back.idx;
      toccato = true;
      hot = back; playOn(back);
      WORLDS.forEach(function(x){ x.dot.classList.toggle('-now', x === back); });
      aggiornaFocus(back);
      var h = document.getElementById('hero');
      h.classList.add('-off'); h.style.display = 'none';
      if (window.history && history.replaceState) history.replaceState({}, '', ROOT);
    }
  }

  var initial = worldFromPath();
  if (initial){
    var w0 = WORLDS.filter(function(x){ return x.id === initial; })[0];
    if (w0) setTimeout(function(){ enter(w0, false); }, 600);
  }

})();
</script>

<script>
/* IL SIPARIO — il marchio si condensa dal vapore.
 * Portato da js/loader.js, che girava dentro a `WC.register` con una linea del
 * tempo di gsap. Qui non c'è né l'uno né l'altro: il vapore è tutto nel canvas.
 * Il conto non è stato toccato — è quello, comprese le tre cose che nel file
 * originale sono segnate come imparate a caro prezzo:
 *   · una particella = UN pixel (sottocampionare fa tornare il grigio o la scaletta);
 *   · la distanza di nascita va AL QUADRATO (se no il vapore scopre un rettangolo);
 *   · il fronte va sfasato lungo l'altezza (se no l'onda è una riga verticale).
 */
(function(){
  var velo = document.getElementById('velo');
  var cv   = document.getElementById('velo-vapore');
  var mark = document.getElementById('wcAxxellMark');
  if (!velo) return;

  var finito = false;
  function apri(){
    if (finito) return; finito = true;
    velo.classList.add('-via');
    velo.style.display = 'none';
    document.body.classList.add('-aperto');
    document.body.style.overflow = '';
  }
  /* Il velo si alza e l'atrio entra NEL MENTRE: si sblocca all'inizio
     dell'uscita, non alla sua fine. */
  function alza(){
    velo.classList.add('-sfuma');
    document.body.classList.add('-aperto');
    setTimeout(apri, 950);
  }

  var ridotto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ridotto || !cv || !mark){ apri(); return; }

  document.body.style.overflow = 'hidden';

  var VB = { x:28, y:104, w:598, h:154 };
  var cssW = Math.min(window.innerWidth * 0.7, 620), cssH = cssW * VB.h / VB.w;
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var W = Math.round(cssW*dpr), H = Math.round(cssH*dpr);
  cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  cv.width = W; cv.height = H;
  var g = cv.getContext('2d');
  if (!g){ apri(); return; }

  var img = new Image();
  /* Un sipario che non finisce è una pagina che non esiste: se la
     rasterizzazione fallisce, si alza lo stesso. */
  img.onerror = function(){ apri(); };
  img.onload = function(){
    var ink;
    try { g.drawImage(img,0,0,W,H); ink = g.getImageData(0,0,W,H).data; }
    catch(e){ apri(); return; }
    g.clearRect(0,0,W,H);
    costruisci(ink);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+VB.x+' '+VB.y+' '+VB.w+' '+VB.h+
    '" width="'+W+'" height="'+H+'"><g fill="#ffffff">'+mark.innerHTML+'</g></svg>');

  var SPREAD = 0.34, N = 0, ox,oy,sx,sy,oa,ph,jt, frame=null, buf=null, onda=0;

  function costruisci(ink){
    var idx=[];
    for (var y=0;y<H;y++) for (var x=0;x<W;x++){
      var a = ink[(y*W+x)*4+3];
      if (a > 8) idx.push(x,y,a);          // soglia bassa: il contorno È l'antialiasing
    }
    N = idx.length/3;
    if (!N){ apri(); return; }
    ox=new Float32Array(N); oy=new Float32Array(N); sx=new Float32Array(N);
    sy=new Float32Array(N); oa=new Float32Array(N); ph=new Float32Array(N); jt=new Float32Array(N);
    var SC = Math.max(18, H*0.55);
    for (var i=0;i<N;i++){
      var X=idx[i*3], Y=idx[i*3+1];
      ox[i]=X; oy[i]=Y; oa[i]=idx[i*3+2]/255;
      var r=Math.random(); r*=r;                       // al quadrato: nuvola, non scatola
      var an=Math.random()*6.28318;
      sx[i]=X+Math.cos(an)*r*SC*0.55;
      sy[i]=Y+Math.sin(an)*r*SC*0.40 - r*SC*0.95;      // nasce in alto e scende
      ph[i]=Math.random()*6.28318;
      jt[i]=Math.sin(Y*0.021)*0.055 + Math.sin(Y*0.007+2.1)*0.035 + (Math.random()-0.5)*0.05;
    }
    frame = g.createImageData(W,H); buf = new Uint32Array(frame.data.buffer);
    t0 = performance.now();
    requestAnimationFrame(disegna);
  }

  var DUR = 3400, t0 = 0, partito = false;
  function easeInOutQuad(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function smooth(a,b,v){ var t=(v-a)/(b-a); t=t<0?0:t>1?1:t; return t*t*(3-2*t); }

  function disegna(){
    if (finito) return;
    var now = performance.now();
    var p = Math.min(1, (now - t0) / DUR);
    onda = easeInOutQuad(p) * (1 + SPREAD);
    if (p >= 1 && !partito){ partito = true; setTimeout(alza, 350); }
    if (!partito) requestAnimationFrame(disegna);
    else requestAnimationFrame(disegna);

    buf.fill(0);
    var t = now * 0.001;
    for (var i=0;i<N;i++){
      var u = (onda - (ox[i]/W + jt[i])) / SPREAD;   // il segno conta: si forma DIETRO l'onda
      if (u <= 0) continue;
      if (u > 1) u = 1;
      var settle = smooth(0.34,1.0,u);
      var veil   = smooth(0.0,0.20,u) * (1-settle);
      var px = sx[i] + (ox[i]-sx[i])*settle;
      var py = sy[i] + (oy[i]-sy[i])*settle;
      var wob = (1-settle)*6;                        // il tremolio muore col posarsi
      px += Math.sin(t*2.1 + ph[i])*wob;
      py += Math.cos(t*1.7 + ph[i]*1.3)*wob*0.7;
      var alpha = oa[i]*(settle + veil*0.32);
      if (alpha <= 0.004) continue;
      var X = px|0, Y = py|0;
      if (X<0||Y<0||X>=W||Y>=H) continue;
      var o = Y*W+X;
      var acc = (buf[o]>>>24)/255 + alpha;           // si sommano: la nebbia si addensa
      if (acc > 1) acc = 1;
      buf[o] = ((acc*255)<<24) | (255<<16) | (255<<8) | 255;
    }
    g.putImageData(frame,0,0);
  }
})();
</script>
