<!doctype html>
<html lang="en">
<head>
<!-- BASE OBBLIGATORIA: la pagina vive senza barra finale. -->
<base href="/atelier/il-prodotto/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il prodotto — un mondo della costellazione | Axxell</title>
<meta name="description" content="Come può essere il sito di chi vende un oggetto. Uno dei mondi della costellazione Axxell.">
<meta property="og:title" content="Il prodotto — un mondo della costellazione | Axxell">
<meta property="og:url" content="https://axxell.ai/atelier/il-prodotto">
<meta name="description" content="Superconscious — a neural engine that turns intent into action. A cinematic scroll-driven AI showreel: mesh-gradient hero, product carousel, particle sphere, portfolio rail, and a chrome brand-star finale.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AI STUDIO — portable single-file rebuild of the Showreel
   ("Prompts that think ahead"). Design tokens inlined from
   src/app/globals.css :root; the four WebGL scenes (hero mesh
   gradient, corner aurora, particle sphere, chrome-star target)
   are faithful vanilla-three ports of src/components/3d/*, with
   GLSL / geometry / colours kept verbatim. Every transform, fade
   and per-letter reveal is a pure function of one scroll progress
   `p` (0->1), ported from src/utils/showreel/timeline.ts.
   Motion here is JS-driven off a Lenis-smoothed scroll clock; the
   production build is spring-based, but the composition and
   choreography are preserved 1:1.
============================================================ */
:root{
  --background:#000000;
  --foreground:#f5f1ec;
  --ink:#07031a;          /* target-block deep navy-black */
  --pf-card:#14110e;      /* portfolio card surface */
  --cc-search:#161310;    /* catalist light-card search bar */
  --paper:#f5f1ec;
  --paper-alt:#f3f1ec;
  --nav-ink:#1a1a1a;
  --cc-dark-ink:#f5f1ec;
  --cc-light-ink:#1a1714;
  --cc-light-muted:#9a948d;

  --nav-surface:#e3e3e3;
  --nav-item:#ffffff;
  --nav-logo:#dadada;
  --nav-cta:#0d0d0d;
  --nav-cta-ink:#f4f4f4;
  --glass-dark:rgba(40,36,33,0.55);
  --glass-border:rgba(255,255,255,0.12);
  --glass-border-soft:rgba(255,255,255,0.14);
  --hairline:rgba(255,255,255,0.28);

  --card-violet:radial-gradient(95% 80% at 50% 28%,#ddd6fe 0%,#9a73f0 38%,#6d28d9 68%,#34146e 100%);
  --loader-glow:rgba(154,115,240,0.55);

  /* Showreel responsive geometry — desktop defaults (updated by JS per breakpoint). */
  --sr-card-w:42vmin;
  --sr-card-h:62vmin;
  --sr-carousel-r:27vmin;
  --sr-flyback:40vmin;
  --sr-hero-pad:8vmin;
  --sr-heading-1:18vmin;
  --sr-heading-2:24vmin;
  --sr-sphere-body-w:52vmin;
  --sr-sphere-body-text:2.4vmin;

  --radius-btn:8px;
  --radius-card:3vmin;
  --radius-pf:2.5vmin;
  --radius-slider:1.6vmin;
  --radius-grid:12px;
  --radius-target:30px;

  --font:"Zen Kaku Gothic New",ui-sans-serif,system-ui,-apple-system,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overflow-x:clip;
}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
ul{list-style:none}
a{color:inherit;text-decoration:none}

/* ---- word / letter reveal primitives ---- */
.word{display:inline-block;white-space:nowrap}
.ltr{display:inline-block;will-change:transform,filter,opacity}

/* ============================================================
   HEADER — floating segmented nav bar (site-header.tsx)
============================================================ */
.site-header{position:fixed;left:0;top:2vmin;z-index:100;display:flex;width:100%;flex-direction:column;align-items:center;pointer-events:none}
.nav-bar{pointer-events:auto;display:flex;align-items:stretch;gap:1px;border-radius:var(--radius-btn);background:var(--nav-surface);padding:1px;
  opacity:0;transform:translateY(-10px);transition:opacity .7s cubic-bezier(.65,0,.35,1),transform .7s cubic-bezier(.65,0,.35,1)}
.nav-bar.revealed{opacity:1;transform:none}
.nav-logo{display:flex;height:40px;width:40px;align-items:center;justify-content:center;border-radius:var(--radius-btn);background:var(--nav-logo)}
.nav-logo img{width:18px;height:18px;transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.nav-logo:hover img{transform:rotate(90deg)}
.nav-links{display:flex;align-items:stretch;gap:1px}
.nav-links a{display:flex;height:40px;width:88px;align-items:center;justify-content:center;border-radius:var(--radius-btn);background:var(--nav-item);font-size:15px;color:var(--nav-ink);transition:opacity .2s}
.nav-links a:hover{opacity:.55}
.nav-cta{display:flex;height:40px;align-items:center;justify-content:center;border-radius:var(--radius-btn);background:var(--nav-cta);padding:0 22px;font-size:15px;font-weight:500;color:var(--nav-cta-ink)}
@media (max-width:760px){.nav-links a{width:66px;font-size:13px}.nav-cta{padding:0 16px;font-size:13px}}
@media (max-width:640px){.nav-links{display:none}}

/* ============================================================
   AURORA — pinned corner shader (flame-background.tsx)
============================================================ */
#aurora{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0}
#glAurora{display:block;width:100%;height:100%}

/* ============================================================
   SCROLL STAGE (showreel-stage.tsx)
============================================================ */
main{position:relative;z-index:2}
.track{position:relative;width:100%}
.sticky-stage{position:sticky;top:0;height:100vh;overflow:hidden;padding:4vmin}
.backdrop{position:absolute;inset:0;z-index:0;background:#fff}
.marquee-wrap{position:absolute;left:0;top:50%;z-index:1;width:100vw;transform:translateY(-50%);pointer-events:none}
.marquee-row{display:flex;width:100vw;overflow:hidden;white-space:nowrap}
.marquee-strip{display:flex;align-items:center;will-change:transform}
.marquee-item{padding:0 3vw;font-size:7vw;letter-spacing:-0.03em;color:#000}
.marquee-dot{width:1.5vw;height:1.5vw;flex-shrink:0;transform:translateY(0.8vw);border-radius:9999px;border:2px solid #000}

.scene3d{position:relative;z-index:2;display:flex;width:100%;height:100%;align-items:center;justify-content:center;perspective:1500px}
.camera-rig{position:absolute;inset:0;transform-style:preserve-3d}
.carousel{position:relative;display:flex;width:100%;height:100%;align-items:center;justify-content:center;transform-style:preserve-3d}
.card{position:absolute;overflow:hidden}
.card1{overflow:hidden}
.side{height:var(--sr-card-h);width:var(--sr-card-w)}
.sphere-slot{display:flex;align-items:center;justify-content:center;overflow:visible}
.round-card{border-radius:var(--radius-card)}

/* ---- hero card ---- */
.hero-card{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--radius-card);background:#000}
#glHero{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block}
.hero-head{position:absolute;inset:0;z-index:3;display:flex;padding:40px;pointer-events:none}
.hero-h1{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:7vw;font-weight:400;line-height:.95;letter-spacing:-0.03em;color:#fff}
.hero-h1 .line2{opacity:.4}
.hero-templates{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hero-templates h2{text-align:center;font-size:3.6vmin;font-weight:400;line-height:1.15;color:#fff;filter:drop-shadow(0 10px 15px rgba(0,0,0,.4));transform:rotate(-90deg)}
.hero-img-wrap{position:absolute;inset:0;z-index:6;perspective:1400px;pointer-events:none}
.hero-img{position:absolute;left:50%;top:50%;overflow:hidden;border-radius:var(--radius-slider);box-shadow:0 25px 50px -12px rgba(0,0,0,.6);will-change:transform}
.hero-img .slide{position:absolute;inset:0}
.hero-img .slide img{width:100%;height:100%;object-fit:cover}
.hero-img .slide-2{position:absolute;left:100%;top:0;width:100%;height:100%;overflow:hidden}
.hero-img .slide-2 img{width:100%;height:100%;object-fit:cover;transform:rotate(-90deg) scale(1.65)}
.hero-bottom{position:absolute;bottom:0;left:0;width:100%;padding:40px;z-index:6;display:flex;flex-direction:column;gap:24px;color:#fff;font-weight:300;pointer-events:none}
.hero-bottom .col{display:flex;flex-direction:column;gap:24px;max-width:28rem;pointer-events:auto}
.hero-bottom p.lead{opacity:.9;line-height:1.6;font-size:16px}
.hero-bottom .btns{display:flex;align-items:center;gap:16px}
.hero-bottom .btns button{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border-radius:var(--radius-btn);font-size:17px;line-height:1}
.hero-bottom .btns .ghost{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2)}
.hero-bottom .btns .solid{background:#fff;color:#000;font-weight:500}
.hero-divider{width:100%;height:1px;background:rgba(255,255,255,.3);margin:8px 0}
.hero-proof{display:flex;justify-content:space-between;align-items:flex-end;width:100%}
.hero-pill{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:9999px;padding:6px 16px 6px 8px}
.hero-pill .avatars{display:flex}
.hero-pill .avatars img{width:32px;height:32px;border-radius:9999px;border:1px solid rgba(255,255,255,.1);object-fit:cover;margin-left:-8px}
.hero-pill .avatars img:first-child{margin-left:0}
.hero-pill span{font-size:14px;font-weight:500;opacity:.9;padding-right:8px}
.hero-proof .right{max-width:32rem;opacity:.9;line-height:1.6;text-align:right;font-size:15px}
@media (max-width:640px){.hero-divider,.hero-proof{display:none}.hero-head{padding:20px}.hero-bottom{padding:20px}}

/* ---- catalist cards ---- */
.cc{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--radius-card)}
.cc>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.2vmin}
.cc-dark{color:var(--cc-dark-ink)}
.cc-light{color:var(--cc-light-ink)}
.cc .top{display:flex;align-items:center;justify-content:space-between}
.cc .logo{display:flex;width:3.4vmin;height:3.4vmin;flex-shrink:0;align-items:center;justify-content:center;border-radius:.9vmin;background:#fff;color:var(--ink)}
.cc .logo svg{width:2.2vmin;height:2.2vmin}
.cc .url{font-size:1.5vmin;letter-spacing:.02em;opacity:.85}
.cc-pill{margin-top:2.6vmin;display:flex;align-items:center;justify-content:space-between;gap:1.5vmin;border-radius:4vmin;border:1px solid var(--glass-border);background:var(--glass-dark);padding:1.8vmin 2vmin;backdrop-filter:blur(10px)}
.cc-pill .lbl{display:flex;flex-direction:column;gap:.4vmin}
.cc-pill .lbl .s{font-size:1.4vmin;opacity:.6}
.cc-pill .lbl .t{font-size:2.2vmin}
.cc-pill .plus{display:flex;width:3vmin;height:3vmin;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;background:var(--glass-border);font-size:1.9vmin}
.cc-search{margin:auto 0;display:flex;align-items:center;gap:1.4vmin;border-radius:5vmin;background:var(--cc-search);padding:2vmin 2.2vmin;color:var(--paper)}
.cc-search .ic{display:flex;width:3vmin;height:3vmin;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;background:var(--glass-border-soft);font-size:1.9vmin}
.cc-search .q{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.7vmin;opacity:.8}
.cc .foot{margin-top:auto}
.cc .foot h3{font-size:4.6vmin;font-weight:400;line-height:1.05}
.cc .foot p{font-size:3.1vmin;font-weight:400;line-height:1.2;color:var(--paper)}
.cc .foot strong{font-weight:700;color:#fff}

/* ---- sphere card ---- */
.sphere-card{width:100%;height:100%}
.sphere-face{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius-card);background:var(--card-violet)}
.sphere-face .inner{display:flex;width:100%;height:100%;flex-direction:column;padding:3.2vmin;color:var(--paper)}
.sphere-face .top{display:flex;align-items:center;justify-content:space-between}
.sphere-face .lbl{border-radius:9999px;border:1px solid var(--glass-border);background:var(--glass-dark);padding:.8vmin 1.8vmin;font-size:1.4vmin;letter-spacing:.02em;backdrop-filter:blur(10px)}
.sphere-face .url{font-size:1.5vmin;letter-spacing:.02em;opacity:.85}
.sphere-face h3{margin-top:auto;max-width:88%;font-size:4.4vmin;font-weight:400;line-height:1.05}
.sphere-mask{position:absolute;left:50%;top:50%;height:300vh;width:300vw;background:#000;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.sphere-inner{position:absolute;left:50%;top:50%;height:100vh;width:100vw}
.sphere-gl{position:absolute;left:50%;top:50%;z-index:2;width:100%;height:100%}
#glSphere{width:100%;height:100%;display:block;pointer-events:none}
.sphere-logo{position:absolute;left:50%;top:50%;z-index:3;height:12vh;width:12vh;background:#fff;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.sphere-htop{position:absolute;left:4vmin;top:4vmin;z-index:4;margin:0;white-space:nowrap;text-align:left;font-size:var(--sr-heading-1);font-weight:400;line-height:.85;color:#fff;pointer-events:none}
.sphere-hbot{position:absolute;bottom:4vmin;right:4vmin;z-index:4;margin:0;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;text-align:right;font-size:var(--sr-heading-2);font-weight:400;line-height:.85;color:#fff;pointer-events:none}
.sphere-body{position:absolute;bottom:5vmin;left:4vmin;z-index:4;display:flex;max-width:var(--sr-sphere-body-w);flex-direction:column;gap:1.8vmin;text-align:left;font-size:var(--sr-sphere-body-text);font-weight:300;line-height:1.45;color:#fff;pointer-events:none}

/* ---- carousel CTA ---- */
.carousel-cta{position:absolute;left:0;right:0;bottom:2vmin;z-index:3;display:flex;justify-content:center;padding:0 4vmin;pointer-events:none}
.carousel-cta a{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-btn);background:var(--ink);padding:2vmin 4.2vmin;font-size:2.1vmin;line-height:1;color:var(--paper)}

/* ---- parallax grid ---- */
.grid-tile{position:absolute;left:50%;top:50%;z-index:-1;overflow:hidden;background-size:cover;background-position:center;opacity:0}

/* ---- target block ---- */
.target-block{position:absolute;left:50%;top:50%;z-index:-1;height:100vh;width:100vw;overflow:hidden;background:var(--ink);opacity:0}
#glTarget{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.final-frame{position:absolute;inset:-4vmin;z-index:3;border-radius:11vmin;border:8vmin solid #fff;opacity:0;pointer-events:none}
.cta-block{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2.5vmin;padding:9vmin;opacity:0;pointer-events:none}
.cta-block h2{margin:0;display:flex;max-width:60vw;flex-direction:column;align-items:flex-start;font-size:7vw;font-weight:400;line-height:.95;letter-spacing:-0.03em;color:var(--paper)}
.cta-block h2 .faded{opacity:.4}
.cta-block p{margin:0;max-width:26vw;font-size:2.2vmin;line-height:1.35;color:rgba(245,241,236,.7)}
.cta-block a{pointer-events:auto;margin-top:1.5vmin;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-btn);background:var(--paper);padding:2.2vmin 4.6vmin;font-size:2.5vmin;line-height:1;color:var(--ink)}

/* ============================================================
   PORTFOLIO (portfolio.tsx)
============================================================ */
.portfolio{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow:hidden;padding-top:9vmin;padding-bottom:8vmin;color:var(--paper-alt);transform:translateY(100%);will-change:transform}
.pf-viewport{position:relative;z-index:1;min-height:0;flex:1;overflow:hidden}
.pf-track{display:flex;height:100%;gap:3vmin;padding-left:3vmin;will-change:transform}
.pf-card{position:relative;display:flex;height:100%;width:62vw;flex-shrink:0;flex-direction:column;justify-content:space-between;overflow:hidden;border-radius:var(--radius-pf);background:var(--pf-card);padding:3.5vmin;color:#fff}
.pf-card video{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
.pf-meta{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:1.4vmin;font-size:1.7vmin;opacity:.9}
.pf-meta .sep{opacity:.5}
.pf-card h3{position:relative;z-index:2;margin:0;max-width:85%;font-size:7vw;font-weight:400;text-transform:capitalize;line-height:.95;letter-spacing:-0.03em}

/* ============================================================
   INTRO LOADER (intro-loader.tsx)
============================================================ */
#loader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--background);
  transition:opacity .65s cubic-bezier(.65,0,.35,1),transform .65s cubic-bezier(.65,0,.35,1)}
#loader.exiting{opacity:0;transform:translateY(-3vh);pointer-events:none}
#loader.done{display:none}
.loader-bloom{position:absolute;width:78vmin;height:78vmin;border-radius:9999px;filter:blur(80px);background-image:var(--card-violet);opacity:.85;transition:opacity 1s ease;pointer-events:none}
#loader.exiting .loader-bloom{opacity:0}
.loader-star{position:relative;will-change:transform;filter:drop-shadow(0 0 28px var(--loader-glow))}
.loader-star img{width:132px;height:132px}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-bloom"></div>
  <div class="loader-star"><img id="loaderStar" alt=""></div>
</div>

<header class="site-header">
  <nav class="nav-bar" id="navBar">
    <a href="#" class="nav-logo" aria-label="Home"><img id="navLogo" alt=""></a>
    <div class="nav-links" id="navLinks"></div>
    <a href="#get-started" class="nav-cta">Ordina</a>
  </nav>
</header>

<div id="aurora"><canvas id="glAurora"></canvas></div>

<main>
  <div class="track" id="track">
    <div class="sticky-stage">
      <div class="backdrop" id="backdrop"></div>

      <div class="marquee-wrap" id="marqueeWrap">
        <div class="marquee-row">
          <div class="marquee-strip" id="marqueeStrip"></div>
        </div>
      </div>

      <div class="scene3d">
        <div class="camera-rig" id="cameraRig">
          <div class="carousel" id="carousel">

            <!-- Card 1 — hero -->
            <div class="card card1" id="card1">
              <div class="hero-card">
                <canvas id="glHero"></canvas>
                <header class="hero-head" id="heroHead">
                  <h1 class="hero-h1">
                    <span class="line1" id="heroLine1"></span>
                    <span class="line2" id="heroLine2"></span>
                  </h1>
                </header>
                <div class="hero-templates">
                  <h2 id="heroTemplates"></h2>
                </div>
                <div class="hero-img-wrap">
                  <div class="hero-img" id="heroImg">
                    <div class="slide" id="heroSlide1"><img id="heroStone" alt=""></div>
                    <div class="slide-2" id="heroSlide2"><img id="heroRotated" alt=""></div>
                  </div>
                </div>
                <div class="hero-bottom" id="heroBottom">
                  <div class="col">
                    <p class="lead" id="heroLead"></p>
                    <div class="btns">
                      <button class="ghost">Il listino</button>
                      <button class="solid">Comincia</button>
                    </div>
                  </div>
                  <div class="hero-divider"></div>
                  <div class="hero-proof">
                    <div class="hero-pill">
                      <div class="avatars" id="heroAvatars"></div>
                      <span>Quattromila case, finora</span>
                    </div>
                    <p class="right" id="heroRight"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Card 2 — Catalist dark -->
            <div class="card side" id="card2">
              <div class="cc cc-dark">
                <img class="bg" id="ccDarkBg" alt="">
                <div class="inner">
                  <div class="top">
                    <span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.9 10.1 L22 12 L13.9 13.9 L12 22 L10.1 13.9 L2 12 L10.1 10.1 Z"/></svg></span>
                    <span class="url" id="ccDarkUrl"></span>
                  </div>
                  <div class="cc-pill">
                    <span class="lbl"><span class="s" id="ccDarkPillLabel"></span><span class="t" id="ccDarkPillTitle"></span></span>
                    <span class="plus">+</span>
                  </div>
                  <div class="foot"><h3 id="ccDarkLead"></h3></div>
                </div>
              </div>
            </div>

            <!-- Card 3 — Catalist light -->
            <div class="card side" id="card3">
              <div class="cc cc-light">
                <img class="bg" id="ccLightBg" alt="">
                <div class="inner">
                  <div class="top">
                    <span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.9 10.1 L22 12 L13.9 13.9 L12 22 L10.1 13.9 L2 12 L10.1 10.1 Z"/></svg></span>
                    <span class="url" id="ccLightUrl"></span>
                  </div>

/* ============================================================================
   TIMELINE — faithful port of src/utils/showreel/timeline.ts
============================================================================ */
const PERSP = 1500
const GEO = { carouselRVmin:27, flybackVmin:40 }

const TRACK_VH = 2000, STICKY_VH = 100
const TRAVEL_VH = TRACK_VH - STICKY_VH
const SCROLL_COMPRESS = 0.4
const VSCROLL_MAX = TRAVEL_VH / SCROLL_COMPRESS      // 4750
const OLD_MAX = 2000
const PS = OLD_MAX - 400                             // 1600
const PF_DUR = 1500
const PF_END = PS + PF_DUR                           // 3100
const GRID_START = PS + 0.72 * PF_DUR                // 2680
const P6_END = GRID_START + 1000                     // 3680
const P7_START = P6_END                              // 3680
const P7_END = P7_START + 900                        // 4580

const clamp01 = (x)=> x<0?0:x>1?1:x
const smooth = (t)=> t*t*(3-2*t)
const lerp = (a,b,t)=> a+(b-a)*t

const vScroll = (p)=> clamp01(p) * VSCROLL_MAX
const gp = (p)=> clamp01(vScroll(p)/OLD_MAX)
const phase1 = (p)=> clamp01(gp(p)/(2/15))
const phase2 = (p)=> clamp01((gp(p)-0.1)/0.05)
const phase3 = (p)=> clamp01((gp(p)-0.15)/0.25)
const phase4 = (p)=> clamp01((gp(p)-0.4)/0.35)

// Card 1 (hero)
const card1Width  = (p)=>{ const t=phase1(p); return `calc((100vw - var(--sr-hero-pad)) * ${1-t} + var(--sr-card-h) * ${t})` }
const card1Height = (p)=>{ const t=phase1(p); return `calc((100vh - var(--sr-hero-pad)) * ${1-t} + var(--sr-card-w) * ${t})` }
const card1Transform = (p)=>{ const rotateZ=phase1(p)*90; return `rotateZ(${rotateZ}deg) translateZ(calc(var(--sr-carousel-r) * ${phase2(p)} + 1px))` }
const card1Opacity = (p)=> gp(p)>=0.75 ? 0 : 1
const heroSlidePan = (p)=> phase1(p)*-100
const heroTiltFade = (p)=> 1-phase1(p)
const heroSliderWidth  = (p)=> `calc(min(90vw, 46vh) * ${1-phase1(p)} + 66vmin * ${phase1(p)})`
const heroSliderHeight = (p)=> `calc(62vh * ${1-phase1(p)} + 46vmin * ${phase1(p)})`
const heroContentFade = (p)=> Math.max(0, 1 - phase1(p)*1.9)

// Side cards
const sideCardTransform = (p, baseRotateY)=>{ const sx=Math.max(phase2(p),0.0001); return `rotateY(${baseRotateY}deg) translateZ(calc(var(--sr-carousel-r) * ${phase2(p)})) scaleX(${sx})` }
const card4Opacity = (p)=>{ const sphereFade=clamp01((vScroll(p)-PS)/400); return 1-sphereFade }
const cardZIndex = (p, slot)=>{ const rotY=phase3(p)*-270; return Math.round(Math.cos(((rotY+slot*90)*Math.PI)/180)*100)+1000 }

const carouselCtaReveal = (p)=>{ const appear=smooth(clamp01((phase1(p)-0.9)/0.1)); const fadeOut=smooth(clamp01((gp(p)-0.4)/0.06)); return appear*(1-fadeOut) }
const carouselTransform = (p)=>{ const fly=phase4(p)*phase4(p); const rotY=phase3(p)*-270; return `translateZ(calc(var(--sr-flyback) * ${-fly})) rotateY(${rotY}deg)` }

// Sphere card
const starMaskSize = (p)=> `${8 + Math.pow(phase4(p),4)*1500}vmin`
const flyBackZpx = (p, vmin)=> -(phase4(p)*phase4(p)) * GEO.flybackVmin * vmin
const blackScreenTransform = (p, vmin)=>{ const scale=(PERSP - flyBackZpx(p,vmin))/PERSP; const up=clamp01((vScroll(p)-PS)/400); const upY=smooth(up)*100; return `translate(-50%, calc(-50% - ${upY}vh)) scale(${scale})` }
const sphereSceneScale = (p, vmin)=>{ const fly=flyBackZpx(p,vmin); const radius=GEO.carouselRVmin*vmin; return (PERSP - fly - radius)/(PERSP - fly) }
const sphereLogoEase = (p)=>{ const inP=clamp01((phase3(p)-0.6)/0.4); return smooth(inP) }
const sphereBodyReveal = (p)=> smooth(clamp01((gp(p)-0.64)/0.1))
const sphereCollapse = (p)=> smooth(clamp01((gp(p)-0.52)/0.2))
const sphereScale = (p)=> 1 + 0.5*sphereCollapse(p)
const sphereLogoTransform = (p)=> `translate(-50%, -50%) scale(${0.12 + 0.88*sphereLogoEase(p) - 0.55*sphereCollapse(p)})`
const sphereLogoOpacity = (p)=> sphereLogoEase(p)
const sphereDisperse = (p)=> smooth(clamp01((vScroll(p)-(PS-400))/600))

// Marquee / backdrop / aurora
const marqueeOpacity = (p)=>{ const fade=clamp01((gp(p)-0.58)/0.12); return phase1(p)*(1-fade) }
const marqueeBlur = (p)=> (1-phase1(p))*20
const stageBackdropOpacity = (p)=> clamp01((0.75-gp(p))/0.03)
const auroraOpacity = (p)=>{ const v=vScroll(p); const fadeIn=clamp01((v-1200)/350); const fadeOut=1-clamp01((v-2900)/350); return Math.min(fadeIn,fadeOut) }

// Portfolio
const pfProgress = (p)=> clamp01((vScroll(p)-PS)/PF_DUR)
const pfEnter = (p)=> smooth(clamp01(pfProgress(p)/0.267))
const pfSlide = (p)=> clamp01((pfProgress(p)-0.267)/0.453)
const pfExit = (p)=> smooth(clamp01((pfProgress(p)-0.72)/0.28))
const portfolioActive = (p)=> vScroll(p) > PS
const portfolioTransform = (p)=>{ if(!portfolioActive(p)) return "translateY(100%)"; const ty=(1-pfEnter(p))*100; const sc=1-pfExit(p)*0.62; const tx=-pfExit(p)*130; return `translate(${tx}vw, ${ty}%) scale(${sc})` }
const pfTrackTransform = (p, maxPan)=> `translateX(${-pfSlide(p)*maxPan}px)`

// Camera flight + target
const flightActive = (p)=> vScroll(p) > GRID_START
const p6 = (p)=> clamp01((vScroll(p)-GRID_START)/1000)
const p7 = (p)=> clamp01((vScroll(p)-P7_START)/(P7_END-P7_START))
const easeP7 = (p)=>{ const t=p7(p); return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2 }
const cameraRigTransform = (p)=>{ if(!flightActive(p)) return "translate(0vw, 0vh) translateZ(0px)"; const rigX=-250*Math.sin((p6(p)*Math.PI)/2); const rigY=-100*(1-Math.cos((p6(p)*Math.PI)/2)); const rigZ=2250*easeP7(p); return `translate(${rigX}vw, ${rigY}vh) translateZ(${rigZ}px)` }
const targetOpacity = (p)=> flightActive(p) ? 1 : 0
const ctaReveal = (p)=> smooth(clamp01((p7(p)-0.5)/0.5))
const finalFrameReveal = (p)=> smooth(clamp01((p7(p)-0.8)/0.2))
const targetTransform = ()=> "translate(calc(-50% + 250vw), calc(-50% + 100vh)) translateZ(-2250px)"
const targetRadius = (p)=> flightActive(p) ? 30*(1-easeP7(p)) : 30

// Per-canvas visibility
const sceneVisibility = (p)=>{ const g=gp(p), v=vScroll(p); return {
  hero: g<0.8,
  aurora: v>1000 && v<PF_END+350,
  sphere: g>0.1 && v<GRID_START+400,
  target: v>GRID_START-300,
  portfolio: v>PS-600 && v<PF_END+350,
} }

// Parallax grid
const GRID_IMAGES = [ASSETS.grid1,ASSETS.grid2,ASSETS.grid3,ASSETS.grid4,ASSETS.grid5,ASSETS.grid6,ASSETS.grid7,ASSETS.grid8,ASSETS.grid9]
const RAW_GRID = [
  {tx:-85,ty:-60,w:"45vw",h:"70vh"},{tx:-80,ty:55,w:"40vw",h:"65vh"},{tx:85,ty:-60,w:"40vw",h:"75vh"},

  {tx:50,ty:120,w:"45vw",h:"70vh"},{tx:120,ty:-10,w:"40vw",h:"80vh"},{tx:0,ty:160,w:"45vw",h:"75vh"},
  {tx:150,ty:0,w:"50vw",h:"80vh"},{tx:200,ty:30,w:"45vw",h:"75vh"},{tx:300,ty:40,w:"40vw",h:"70vh"},

]
const GRID_ITEMS = RAW_GRID.map((it,index)=>{
  const pr = Math.abs(Math.sin((index+1)*12.9898)*43758.5453)%1
  const z = -500 - pr*2500

  const imgRand = Math.abs(Math.sin((index+1)*78.233)*12345.678)%1
  const image = GRID_IMAGES[Math.floor(imgRand*GRID_IMAGES.length)]
  return {...it, z, scale, image}
})

const blockLetterStyle = (p, index, total)=>{ const ap=clamp01((gp(p)-0.6)/0.135); const delay=(index/total)*0.55; const lp=clamp01((ap-delay)/0.45); const inv=1-smooth(lp); return { transform:`translateY(${inv*70}%)`, filter:`blur(${inv*2.0}vmin)`, opacity:Math.max(0,1-inv*1.3) } }
const templatesLetterStyle = (p, index)=>{ const t=clamp01((phase1(p)-0.45-index*0.005)/0.45); return { transform:`translateY(${(1-smooth(t))*150}%)`, filter:`blur(${(1-t)*1.5}vmin)`, opacity:t } }

/* ============================================================================
   TEXT BUILD — word-wrapped, per-letter animated spans
   Each WORD is an inline-block nowrap `.word` (never splits); letters inside
   are `.ltr` spans updated per frame from the letter-style functions.
============================================================================ */
// Build one line of text into `container`, returning the letter entries.
// Letters carry a global index (indexOffset + running count) and a `total`.
function buildLine(container, text, letters, indexOffsetRef, total){
  const words = text.split(" ")
  words.forEach((word, wi)=>{
    if(wi>0) container.appendChild(document.createTextNode(" "))
    const wEl = document.createElement("span")
    wEl.className = "word"
    for(const ch of [...word]){
      const l = document.createElement("span")
      l.className = "ltr"
      l.textContent = ch
      const idx = indexOffsetRef.v++
      letters.push({ el:l, idx, total })
      wEl.appendChild(l)
    }
    container.appendChild(wEl)
  })
}

// hero headline — each line independent total (matches ScrollLetters per line)
const heroLetterSets = []
function buildHeroLine(el, text){
  const letters=[]
  const total=[...text].filter(c=>c!==" ").length
  buildLine(el, text, letters, {v:0}, total)
  heroLetterSets.push({ letters, fn:heroLetterStyle })
}

  bottom.forEach((line,i)=>{ const span=document.createElement("span"); botEl.appendChild(span); buildLine(span, line, sphereLetters, {v:offsets[i]}, total) })
})()

}

/* ---- shared mesh-gradient fragment (hero-gradient.tsx / target-star BG_FRAG) ---- */
const MESH_GRADIENT_FRAG = (withMouse)=> /* glsl */`
precision mediump float;
uniform vec2 u_resolution;
uniform float u_time;
${withMouse ? "uniform vec2 u_mouse;" : ""}
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){

// Generic fullscreen-quad renderer for a fragment shader.
function makeQuadScene(canvas, frag, {alpha=false, withMouse=false}={}){
  const renderer=new THREE.WebGLRenderer({ canvas, alpha, antialias:false })
  renderer.setPixelRatio(Math.min(devicePixelRatio,2))
  const scene=new THREE.Scene()
  const cam=new THREE.Camera()
  const uniforms={ u_resolution:{value:V2(1,1)}, u_time:{value:0} }
  if(withMouse) uniforms.u_mouse={value:V2(0,0)}
  const mat=new THREE.ShaderMaterial({ vertexShader:CLIP_VERT, fragmentShader:frag, uniforms, transparent:alpha, depthTest:false, depthWrite:false })
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat)
  mesh.frustumCulled=false; scene.add(mesh)
  function size(){
    const w=canvas.clientWidth||1, h=canvas.clientHeight||1
    if(canvas.width!==Math.round(w*renderer.getPixelRatio()) || canvas.height!==Math.round(h*renderer.getPixelRatio())){
      renderer.setSize(w,h,false)
    }
    const dpr=renderer.getPixelRatio()
    uniforms.u_resolution.value.set(Math.round(w*dpr), Math.round(h*dpr))
  }
  return { renderer, uniforms, render(t){ size(); uniforms.u_time.value=t; renderer.render(scene,cam) } }
}

window.lenis=lenis
scrollTo(0,0)

const trackEl=document.getElementById("track")
function progress(){
  const travel=trackEl.offsetHeight - innerHeight
  return travel>0 ? clamp01(window.scrollY/travel) : 0
}

// element refs
const el = (id)=> document.getElementById(id)
const refs={
  aurora:el("aurora"), backdrop:el("backdrop"), marqueeWrap:el("marqueeWrap"),
  cameraRig:el("cameraRig"), carousel:el("carousel"),
  card1:el("card1"), card2:el("card2"), card3:el("card3"), card4:el("card4"),
  heroHead:el("heroHead"), heroTemplates:el("heroTemplates"), heroImg:el("heroImg"),
  heroSlide1:el("heroSlide1"), heroSlide2:el("heroSlide2"), heroBottom:el("heroBottom"),
  sphereMask:el("sphereMask"), sphereInner:el("sphereInner"), sphereGlWrap:el("sphereGlWrap"),
  sphereLogo:el("sphereLogo"), sphereBody:el("sphereBody"),
  carouselCta:el("carouselCta"), carouselCtaBtn:el("carouselCtaBtn"),
  targetBlock:el("targetBlock"), finalFrame:el("finalFrame"), ctaBlock:el("ctaBlock"),
  portfolio:el("portfolio"), pfTrack:el("pfTrack"),
}
refs.targetBlock.style.transform = targetTransform()

// portfolio max pan
let maxPan=0
function measurePan(){
  const track=refs.pfTrack, vp=track.parentElement
  const rightGap=(3*Math.min(innerWidth,innerHeight))/100
  maxPan=Math.max(0, track.scrollWidth - vp.clientWidth + rightGap)
}
addEventListener("resize", measurePan, {passive:true})
setTimeout(measurePan, 100)

let marqueeX=0, marqueeLast=0
const marqueeStripEl=el("marqueeStrip")

function applyDOM(p, now){
  const vmin=Math.min(innerWidth,innerHeight)/100
  // aurora + backdrop + marquee
  refs.aurora.style.opacity = auroraOpacity(p)
  refs.backdrop.style.opacity = stageBackdropOpacity(p)
  refs.marqueeWrap.style.opacity = marqueeOpacity(p)
  refs.marqueeWrap.style.filter = `blur(${marqueeBlur(p)}px)`
  // marquee running strip (25s linear, 0 -> -50%)
  if(marqueeLast) marqueeX -= ((now-marqueeLast)/25000)*50
  marqueeLast=now
  if(marqueeX<=-50) marqueeX+=50
  marqueeStripEl.style.transform=`translateX(${marqueeX}%)`
  // camera rig + carousel
  refs.cameraRig.style.transform = cameraRigTransform(p)
  refs.carousel.style.transform = carouselTransform(p)
  // card 1 (hero)
  refs.card1.style.width = card1Width(p)
  refs.card1.style.height = card1Height(p)
  refs.card1.style.transform = card1Transform(p)
  refs.card1.style.zIndex = cardZIndex(p,0)
  refs.card1.style.opacity = card1Opacity(p)
  // side cards
  refs.card2.style.transform = sideCardTransform(p,90); refs.card2.style.zIndex=cardZIndex(p,1); refs.card2.style.opacity=card1Opacity(p)
  refs.card3.style.transform = sideCardTransform(p,180); refs.card3.style.zIndex=cardZIndex(p,2); refs.card3.style.opacity=card1Opacity(p)
  refs.card4.style.transform = sideCardTransform(p,270); refs.card4.style.zIndex=cardZIndex(p,3); refs.card4.style.opacity=card4Opacity(p)
  // hero internals
  const hcf=heroContentFade(p)
  refs.heroHead.style.opacity=hcf; refs.heroBottom.style.opacity=hcf
  refs.heroImg.style.width=heroSliderWidth(p); refs.heroImg.style.height=heroSliderHeight(p)
  const tf=heroTiltFade(p)
  refs.heroImg.style.transform=`translate(-50%,-50%) rotateX(${heroMouse.cx*tf}deg) rotateY(${heroMouse.cy*tf}deg)`
  const pan=`translateX(${heroSlidePan(p)}%)`
  refs.heroSlide1.style.transform=pan; refs.heroSlide2.style.transform=pan
  applyLetterSet(heroLetterSets[0].letters, heroLetterStyle, p)
  applyLetterSet(heroLetterSets[1].letters, heroLetterStyle, p)
  applyLetterSet(templatesLetters, (pp,i)=>templatesLetterStyle(pp,i), p)
  // sphere
  refs.sphereMask.style.webkitMaskSize=starMaskSize(p); refs.sphereMask.style.maskSize=starMaskSize(p)
  refs.sphereMask.style.transform=blackScreenTransform(p,vmin)
  refs.sphereInner.style.transform=`translate(-50%,-50%) scale(${sphereSceneScale(p,vmin)})`
  refs.sphereGlWrap.style.transform=`translate(-50%,-50%) scale(${sphereScale(p)})`
  refs.sphereLogo.style.transform=sphereLogoTransform(p); refs.sphereLogo.style.opacity=sphereLogoOpacity(p)
  const sbr=sphereBodyReveal(p)
  refs.sphereBody.style.opacity=sbr; refs.sphereBody.style.transform=`translateY(${(1-sbr)*2.5}vmin)`
  applyLetterSet(sphereLetters, blockLetterStyle, p)
  // carousel CTA
  const ccr=carouselCtaReveal(p)
  refs.carouselCta.style.opacity=ccr; refs.carouselCta.style.transform=`translateY(${(1-ccr)*2.5}vh)`
  // grid tiles
  const go=gridOpacity(p)
  for(const g of gridTileEls) g.style.opacity=go
  // target block
  refs.targetBlock.style.opacity=targetOpacity(p)
  refs.targetBlock.style.borderRadius=targetRadius(p)+"px"
  refs.finalFrame.style.opacity=finalFrameReveal(p)
  const cr=ctaReveal(p)
  refs.ctaBlock.style.opacity=cr; refs.ctaBlock.style.transform=`translateY(${(1-cr)*6}vh)`
  // portfolio
  refs.portfolio.style.transform=portfolioTransform(p)
  refs.pfTrack.style.transform=pfTrackTransform(p, maxPan)
}

/* ============================================================================
   INTRO LOADER + RENDER LOOP
============================================================================ */
const loader=document.getElementById("loader")
const navBar=document.getElementById("navBar")
const loaderStar=document.querySelector(".loader-star")
let loaderStartExit=false
lenis.stop()
setTimeout(()=>{ loader.classList.add("exiting"); loaderStartExit=true; lenis.start() }, 2600)
loader.addEventListener("transitionend",(e)=>{ if(loaderStartExit && e.propertyName==="opacity"){ loader.classList.add("done"); navBar.classList.add("revealed") } })

let started=performance.now()
function frame(now){
  requestAnimationFrame(frame)
  lenis.raf(now)
  const t=(now-started)/1000
  const p=progress()
  applyDOM(p, now)
  const vis=sceneVisibility(p)
  // loader star spin (continuous while up; accelerates on exit)
  loaderStar.style.transform=`rotate(${(now*0.06)%360}deg) scale(${loaderStartExit?1.4:1})`
  // ease hero-gradient mouse uniform toward the tracked pointer
  if(heroScene.uniforms.u_mouse){ heroScene.uniforms.u_mouse.value.x += (heroMouse.tx-heroScene.uniforms.u_mouse.value.x)*0.12; heroScene.uniforms.u_mouse.value.y += (heroMouse.ty-heroScene.uniforms.u_mouse.value.y)*0.12 }
  if(vis.hero) heroScene.render(t)
  if(vis.aurora) renderAurora(t)
  if(vis.sphere) renderSphere(t, sphereDisperse(p))
  if(vis.target) renderTarget(t)
}
requestAnimationFrame(frame)

// hero card 3D tilt from pointer (window-normalized) — matches HeroCard tilt spring
addEventListener("pointermove",(e)=>{
  const nx=(e.clientX/innerWidth)*2-1, ny=(e.clientY/innerHeight)*2-1
  refs._tiltRx = -ny*9; refs._tiltRy = nx*12
},{passive:true})
// smooth the tilt in applyDOM via heroMouse.cx/cy
setInterval(()=>{
  const rx=refs._tiltRx||0, ry=refs._tiltRy||0
  heroMouse.cx += (rx-heroMouse.cx)*0.15
  heroMouse.cy += (ry-heroMouse.cy)*0.15
}, 16)

// nav smooth-scroll
navLinks.querySelectorAll("a").forEach(a=>{ a.addEventListener("click",(e)=>{ e.preventDefault() }) })
</script>
