<!-- PARLIAMONE — il modulo di contatto, in una pagina sua.
     Stava in fondo all'Atelier come capitolo 08. Il capitolo era l'ultima cosa
     da leggere dopo otto schermate di portfolio, e il modulo ci arrivava
     stanco: chi voleva scrivere doveva scorrere tutto, e chi stava guardando
     il portfolio se lo trovava in mezzo ai piedi. Adesso e' una destinazione:
     ci si arriva dal menu o dalla chiusura, da qualunque punto.

     `<base href="/atelier/">` come la pagina madre, cosi' `css/`, `js/` e
     `assets/` puntano dove devono anche se questa pagina vive un livello piu'
     in la' nell'indirizzo.

     Niente WebGL, niente capitoli: qui non c'e' niente da guardare, c'e' da
     scrivere. Delle librerie restano solo quelle che il modulo usa davvero. -->

<main id="wc-main">

    <p class="eyebrow">// Parliamone</p>
    <h2>Raccontaci cosa deve fare<br>il tuo sito.</h2>
    <form class="wc-form" id="wcForm" novalidate>
      <div class="wc-field">
        <input type="text" id="wcNome" name="nome" required placeholder=" " autocomplete="name">
        <label for="wcNome">Nome</label>
      </div>
      <div class="wc-field">
        <input type="email" id="wcEmail" name="email" required placeholder=" " autocomplete="email">
        <label for="wcEmail">Email</label>
      </div>
      <div class="wc-field">
        <textarea id="wcMsg" name="messaggio" rows="4" required placeholder=" "></textarea>
        <label for="wcMsg">Cosa hai in mente</label>
      </div>
      <button type="submit" class="wc-submit wc-hover" id="wcSubmit">
        <span id="wcSubmitLabel">Invia</span>
      </button>
      <p class="wc-form-err" id="wcFormErr" role="alert" hidden></p>
    </form>
    <div class="wc-form-ok" id="wcFormOk" hidden>
      <div class="wc-form-ok-lottie" id="wcFormOkLottie"></div>
      <p>Ricevuto. Ti rispondiamo entro un giorno lavorativo.</p>
    </div>
  </section>
</main>
