<!-- PARLIAMONE — il modulo di contatto, in una pagina sua.
     Stava in fondo all'Atelier come capitolo 08. Il capitolo era l'ultima cosa
     da leggere dopo otto schermate di portfolio, e il modulo ci arrivava
     stanco: chi voleva scrivere doveva scorrere tutto, e chi stava guardando
     il portfolio se lo trovava in mezzo ai piedi. Adesso e' una destinazione:
     ci si arriva dal menu o dalla chiusura, da qualunque punto.

     `<base href="/atelier/">` come la pagina madre, cosi' `css/`, `js/` e
     `assets/` puntano dove devono anche se questa pagina vive un livello piu'
     in la' nell'indirizzo.

     Niente WebGL, niente capitoli: qui non c'e' niente da guardare, c'e' da
     scrivere. Delle librerie restano solo quelle che il modulo usa davvero. -->
